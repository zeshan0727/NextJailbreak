name: NovaBrowser
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ''
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  NovaBrowser:
    type: application
    platform: iOS
    sources:
      - path: NovaBrowser
        excludes:
          - Info.plist
          - '**/README.md'
    info:
      path: NovaBrowser/Info.plist
      properties:
        CFBundleDisplayName: NovaBrowser
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: '1.0.6'
        CFBundleVersion: '7'
        LSRequiresIPhoneOS: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: Camera access is requested only when a website needs it and you approve.
        NSMicrophoneUsageDescription: Microphone access is requested only when a website needs it and you approve.
        NSLocationWhenInUseUsageDescription: Location access is requested only when a website needs it and you approve.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.novabrowser
        INFOPLIST_FILE: NovaBrowser/Info.plist
  NovaBrowserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NovaBrowserTests
    dependencies:
      - target: NovaBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.novabrowser.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NovaBrowser:
    build:
      targets:
        NovaBrowser: all
        NovaBrowserTests: [test]
    test:
      targets:
        - NovaBrowserTests
