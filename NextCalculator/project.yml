name: NextCalculator
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  bundleIdPrefix: com.nextsolution
targets:
  NextCalculator:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.calculator
      INFOPLIST_KEY_CFBundleDisplayName: Next Calculator
      INFOPLIST_KEY_LSRequiresIPhoneOS: true
      INFOPLIST_KEY_UIRequiresFullScreen: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
      TARGETED_DEVICE_FAMILY: 1
      SWIFT_VERSION: 5.0
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
    scheme:
      testTargets: []
