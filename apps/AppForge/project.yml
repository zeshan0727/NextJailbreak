name: AppForge
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  AppForge:
    type: application
    platform: iOS
    sources:
      - path: AppForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.appforge
        INFOPLIST_FILE: AppForge/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
schemes:
  AppForge:
    build:
      targets:
        AppForge: all
    run:
      config: Debug
    archive:
      config: Release
