name: Build AppForge
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned AppForge
        run: |
          set -euo pipefail
          xcodebuild -project AppForge.xcodeproj -scheme AppForge -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA and TIPA
        run: |
          set -euo pipefail
          mkdir -p out/Payload
          ditto "DerivedData/Build/Products/Release-iphoneos/AppForge.app" out/Payload/AppForge.app
          (cd out && zip -qry AppForge.ipa Payload)
          cp out/AppForge.ipa out/AppForge.tipa
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppForge-${{ github.run_number }}
          path: |
            out/*.ipa
            out/*.tipa
      - name: Create downloadable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "appforge-${{ github.run_number }}" out/AppForge.ipa out/AppForge.tipa \
            --title "AppForge build ${{ github.run_number }}" \
            --notes "Unsigned build. Installability depends on signing and device support." \
            --target "$GITHUB_SHA"
