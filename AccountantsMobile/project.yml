name: AccountantsMobile
options:
  bundleIdPrefix: com.nextsolution
  deploymentTarget:
    iOS: "16.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  AccountantsMobile:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AccountantsMobile
    info:
      path: AccountantsMobile/Info.plist
      properties:
        CFBundleDisplayName: Accountants
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.accountantsmobile
        PRODUCT_NAME: Accountants
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: GRDB
      - package: ZIPFoundation
