name: NextTweaks
options:
  bundleIdPrefix: com.nextsolution
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.nexttweaks
    PRODUCT_NAME: NextTweaks
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    SUPPORTS_MACCATALYST: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  NextTweaks:
    type: application
    platform: iOS
    sources:
      - NextTweaks
    settings:
      base:
        INFOPLIST_FILE: NextTweaks/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []
