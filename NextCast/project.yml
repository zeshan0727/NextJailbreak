name: NextCast
options:
  bundleIdPrefix: uk.zeshanbarvi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk
    from: 4.8.6
  AndroidTVRemoteControl:
    url: https://github.com/odyshewroman/AndroidTVRemoteControl
    branch: main
targets:
  NextCast:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - package: GoogleCast
        product: GoogleCastDynamic
      - package: AndroidTVRemoteControl
        product: AndroidTVRemoteControl
      - framework: Vendor/FFmpeg/ffmpegkit.xcframework
        embed: true
      - framework: Vendor/FFmpeg/libavcodec.xcframework
        embed: true
      - framework: Vendor/FFmpeg/libavdevice.xcframework
        embed: true
      - framework: Vendor/FFmpeg/libavfilter.xcframework
        embed: true
      - framework: Vendor/FFmpeg/libavformat.xcframework
        embed: true
      - framework: Vendor/FFmpeg/libavutil.xcframework
        embed: true
      - framework: Vendor/FFmpeg/libswresample.xcframework
        embed: true
      - framework: Vendor/FFmpeg/libswscale.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.zeshanbarvi.nextcast
        PRODUCT_NAME: NextCast
        SWIFT_VERSION: 5.0
        SWIFT_OBJC_BRIDGING_HEADER: Sources/NCFFmpegBridge.h
        CLANG_ENABLE_MODULES: YES
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        # CoreMedia's optional Swift overlay is absent on the tested iOS 16.0
        # runtime; never make it a required launch-time dependency.
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-weak-lswiftCoreMedia"
          - "-lz"
          - "-lbz2"
          - "-liconv"
          - "-lc++"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Next Cast
        CFBundleShortVersionString: "1.5.6"
        CFBundleVersion: "30"
        UILaunchScreen: {}
        CFBundleDocumentTypes:
          - CFBundleTypeName: Next Cast Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.video
              - org.matroska.mkv
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Matroska Video
            UTTypeConformsTo:
              - public.movie
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mkv
              public.mime-type:
                - video/x-matroska
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: "Next Cast discovers Chromecast devices and securely pairs with Android TV plus Samsung, Roku and LG televisions on your Wi-Fi."
        NSBonjourServices:
          - "_googlecast._tcp"
          - "_CC1AD845._googlecast._tcp"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
