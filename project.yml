name: DailyLedger
options:
  bundleIdPrefix: com.nextsolution
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.7"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.3.84"
    CURRENT_PROJECT_VERSION: "110"
targets:
  DailyLedger:
    type: application
    platform: iOS
    entitlements:
      path: DailyLedger/DailyLedger.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.nextsolution.dailyledger
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.nextsolution.dailyledger
    sources:
      - path: DailyLedger
      - path: Shared/NextLedgerWidgetSnapshot.swift
    dependencies:
      - target: DailyLedgerWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.dailyledger
        PRODUCT_NAME: Next Ledger
        INFOPLIST_FILE: DailyLedger/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
    scheme:
      shared: true
      gatherCoverageData: false

  DailyLedgerWidgets:
    type: app-extension
    platform: iOS
    entitlements:
      path: DailyLedgerWidgets/NextLedgerWidgets.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.nextsolution.dailyledger
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.nextsolution.dailyledger
    sources:
      - path: DailyLedgerWidgets
        excludes:
          - Info.plist
          - NextLedgerWidgets.entitlements
      - path: Shared/NextLedgerWidgetSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.dailyledger.widgets
        PRODUCT_NAME: NextLedgerWidgets
        INFOPLIST_FILE: DailyLedgerWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
    scheme:
      shared: true
