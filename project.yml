name: DailyLedger
options:
  bundleIdPrefix: com.nextsolution
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.7"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.3.84"
    CURRENT_PROJECT_VERSION: "101"
targets:
  DailyLedger:
    type: application
    platform: iOS
    entitlements:
      path: DailyLedger/DailyLedger.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.nextsolution.dailyledger
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.nextsolution.dailyledger
    sources:
      - path: DailyLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.nextledger
        PRODUCT_NAME: Next Ledger
        INFOPLIST_FILE: DailyLedger/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
    scheme:
      shared: true
      gatherCoverageData: false
