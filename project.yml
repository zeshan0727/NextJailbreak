name: FreeLocalVPN
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  FreeLocalVPN:
    type: application
    platform: iOS
    sources:
      - Sources/AppEntry.swift
      - Sources/ContentView.swift
      - Sources/VPNViewModel.swift
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.freelocalvpn
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
schemes:
  FreeLocalVPN:
    build:
      targets:
        FreeLocalVPN: all
    archive:
      config: Release
