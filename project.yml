name: NextLedger
options:
  bundleIdPrefix: com.nextsolution
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.7"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    CODE_SIGN_STYLE: Automatic
    OTHER_SWIFT_FLAGS: "-debug-prefix-map $(SRCROOT)=/NextLedger"
    DEVELOPMENT_TEAM: T52CDY8W32
    MARKETING_VERSION: "1.3.84"
    CURRENT_PROJECT_VERSION: "106"
targets:
  NextLedger:
    type: application
    platform: iOS
    entitlements:
      path: NextLedger/NextLedger.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.nextsolution.dailyledger
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.nextsolution.dailyledger
    sources:
      - path: NextLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.nextledger
        PRODUCT_NAME: Next Ledger
        INFOPLIST_FILE: NextLedger/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
    scheme:
      shared: true
      gatherCoverageData: false
