name: NEXTMotionStudio
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SUPPORTS_MACCATALYST: NO
targets:
  NEXTMotionStudio:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: NEXTMotionStudio-Info.plist
      properties:
        CFBundleDisplayName: NEXT Motion Studio
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "Import videos for local editing and conversion."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.motionstudio
        PRODUCT_NAME: NEXTMotionStudio
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  NEXTMotionStudio:
    build:
      targets:
        NEXTMotionStudio: all
    run:
      config: Debug
    archive:
      config: Release
