name: NextReverseLab
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.nextreverselab
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "NEXT Reverse Lab"
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Import screenshots chosen by you as evidence for a reconstruction prompt."
    INFOPLIST_KEY_UIUserInterfaceStyle: Light
    SUPPORTS_MACCATALYST: NO
targets:
  NextReverseLab:
    type: application
    platform: iOS
    sources:
      - path: Sources/NextReverseLabApp.swift
    settings:
      base:
        PRODUCT_NAME: NextReverseLab
        CODE_SIGN_STYLE: Manual