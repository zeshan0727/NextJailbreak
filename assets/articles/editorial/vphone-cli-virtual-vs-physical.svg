<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#0a284a"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="90" y="125" fill="#f4f8ff" font-size="68" font-weight="700">What vphone-cli does — and does not do</text><text x="92" y="180" fill="#9fb8d5" font-size="30">Keep virtual-iPhone jailbreak research separate from physical-device jailbreak status</text></g>
<g transform="translate(90 275)" font-family="Arial"><rect width="675" height="430" rx="30" fill="#0a1d35" stroke="#2e72b5" stroke-width="3"/><circle cx="82" cy="82" r="42" fill="#133f70"/><path d="M57 82h50M82 57v50" stroke="#67b8ff" stroke-width="8"/><text x="145" y="76" fill="#f2f7ff" font-size="38" font-weight="700">Virtual iPhone on Apple Silicon</text><text x="145" y="118" fill="#77bdff" font-size="25">SUPPORTED BY THE PROJECT</text><g fill="#d6e7fa" font-size="29"><text x="58" y="196">✓ iOS 27 RC build 24A435 catalog entry</text><text x="58" y="249">✓ “jb” firmware variant</text><text x="58" y="302">✓ Sileo + TrollStore in the guest VM</text><text x="58" y="355">✓ SSH / VNC and research tooling</text></g></g>
<g transform="translate(835 275)" font-family="Arial"><rect width="675" height="430" rx="30" fill="#111a28" stroke="#6d4451" stroke-width="3"/><circle cx="82" cy="82" r="42" fill="#471d2a"/><path d="M60 60l44 44M104 60l-44 44" stroke="#ff7887" stroke-width="8"/><text x="145" y="76" fill="#f2f7ff" font-size="38" font-weight="700">Physical iPhone on iOS 27</text><text x="145" y="118" fill="#ff8391" font-size="25">NOT PROVIDED BY THIS PROJECT</text><g fill="#d6e7fa" font-size="29"><text x="58" y="196">✕ Not an installable iPhone jailbreak app</text><text x="58" y="249">✕ Not a kernel exploit for iOS 27 final</text><text x="58" y="302">✕ Does not jailbreak your daily-use iPhone</text><text x="58" y="355">✕ Requires an Apple Silicon Mac host</text></g></g><text x="92" y="800" fill="#829bb8" font-family="Arial" font-size="25">Source: Lakr233/vphone-cli project README and September 10 firmware-catalog commit.</text></svg>