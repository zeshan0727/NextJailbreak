name: NextStorage
options:
  bundleIdPrefix: com.nextjailbreak
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  NextStorage:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    sources:
      - path: NextStorageApp.swift
      - path: AppCatalog.swift
      - path: FilzaLauncher.swift
      - path: PhotosStorage.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextjailbreak.storage
        PRODUCT_NAME: NextStorage
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_CFBundleDisplayName: Next Storage
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Analyze local photo and video storage, preview media and delete selected items with permission."
        INFOPLIST_KEY_UIRequiresFullScreen: 'NO'
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '1.0.4'
        CURRENT_PROJECT_VERSION: '5'
        CODE_SIGN_ENTITLEMENTS: NextStorage.entitlements
        SWIFT_STRICT_CONCURRENCY: minimal
