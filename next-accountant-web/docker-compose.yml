services:
  app:
    build:
      context: .
      dockerfile: src/NextAccountant.Web/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Main: Data Source=/appdata/NextAccountant.db
      App__BaseUrl: ${APP_BASE_URL}
      Storage__DocumentsPath: /appdata/documents
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      OpenAI__DocumentModel: ${OPENAI_DOCUMENT_MODEL}
    volumes:
      - appdata:/appdata
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge

volumes:
  appdata:
  caddy_data:
  caddy_config:

networks:
  edge:
