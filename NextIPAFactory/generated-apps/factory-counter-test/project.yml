name: GeneratedApp
options:
  bundleIdPrefix: com.example
targets:
  GeneratedApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GeneratedApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Factory Counter
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  GeneratedApp:
    build:
      targets:
        GeneratedApp: all
    run:
      config: Debug
