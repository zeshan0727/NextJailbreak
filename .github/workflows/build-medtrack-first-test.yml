name: MedTrack 1.2.3 Build 6 - Original Working Widget Restoration to NS Transfer

on:
  push:
    branches: [medtrack-test-v1]
    paths:
      - "MedTrackFirstTest/**"
      - ".github/workflows/build-medtrack-first-test.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medtrack-first-test-intel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      APP_NAME: MedTrack
      FILE_NAME: MedTrack-1.2.3-b6.ipa
      BUNDLE_ID: com.nextsolution.medtrack
      VERSION: "1.2.3"
      BUILD: "6"
      # Intel hosted runner avoids the standard macOS ARM allocation pool.
    steps:
      - name: Check out MedTrack test source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore original Xcode project from verified source payload
        shell: bash
        run: |
          set -euo pipefail
          test -s MedTrackFirstTest/medtrack-source.tar.gz.b64
          base64 -D -i MedTrackFirstTest/medtrack-source.tar.gz.b64 -o "$RUNNER_TEMP/medtrack-source.tar.gz"
          tar -tzf "$RUNNER_TEMP/medtrack-source.tar.gz" | grep -q 'MedTrack/MedTrackApp.swift'
          mkdir -p MedTrackFirstTest
          tar -xzf "$RUNNER_TEMP/medtrack-source.tar.gz" -C MedTrackFirstTest
          # Fix missing comma separators in the original PBX project. The tarball
          # contains the .pbxproj but not the optional project generator.
          python3 - <<'PY'
          from pathlib import Path
          import re
          project = Path("MedTrackFirstTest/MedTrack.xcodeproj/project.pbxproj")
          source = project.read_text()
          for key in ("buildPhases", "dependencies", "buildConfigurations"):
              expression = re.compile(r"(" + key + r"\s*=\s*\()([^)]*)(\))")
              def fix_array(match):
                  members = re.sub(r"(?<=\*/)\s+(?=[A-F0-9]{24}\s*/\*)", ", ", match.group(2))
                  return match.group(1) + members + match.group(3)
              source = expression.sub(fix_array, source)
          source = source.replace('DEBUG_INFORMATION_FORMAT = "\\"dwarf-with-dsym\\"";',
                                  'DEBUG_INFORMATION_FORMAT = "dwarf-with-dsym";')
          project.write_text(source)
          if not re.search(r'buildConfigurations = \([A-F0-9]{24} /\* Debug \*/, [A-F0-9]{24} /\* Release \*/\)', source):
              raise SystemExit("Failed to repair project configuration arrays")
          PY
          plutil -lint MedTrackFirstTest/MedTrack.xcodeproj/project.pbxproj
          test -s MedTrackFirstTest/MedTrack.xcodeproj/project.pbxproj
          test -s MedTrackFirstTest/MedTrack/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          echo "Restored complete MedTrack app, widget, project and tests."
          # Apply incremental Build 3 source update over the verified Build 2 archive.
          test -s MedTrackFirstTest/medtrack-v120.patch.gz.b64
          base64 -D -i MedTrackFirstTest/medtrack-v120.patch.gz.b64 -o "$RUNNER_TEMP/medtrack-v120.patch.gz"
          gunzip -c "$RUNNER_TEMP/medtrack-v120.patch.gz" | patch --batch --fuzz=0 -p0 -d MedTrackFirstTest
          # Replace the widget with a minimal iOS 16+ read-only implementation.
          # No AppIntents, interactive buttons, or extension-side notification access.
          test -s MedTrackFirstTest/WidgetBuild4/MedTrackWidget.swift
          cp MedTrackFirstTest/WidgetBuild4/MedTrackWidget.swift MedTrackFirstTest/MedTrackWidget/MedTrackWidget.swift
          ! grep -q 'import AppIntents' MedTrackFirstTest/MedTrackWidget/MedTrackWidget.swift
          python3 - <<'PY'
          from pathlib import Path
          p = Path("MedTrackFirstTest/generate_project.py")
          s = p.read_text()
          assert "'CURRENT_PROJECT_VERSION':'3'" in s
          assert "'MARKETING_VERSION':'1.2.0'" in s
          s = s.replace("'CURRENT_PROJECT_VERSION':'3'", "'CURRENT_PROJECT_VERSION':'4'")
          s = s.replace("'MARKETING_VERSION':'1.2.0'", "'MARKETING_VERSION':'1.2.1'")
          p.write_text(s)
          PY
          # Build 5 adds in-app diagnostics and disables widget binary dead stripping.
          test -s MedTrackFirstTest/medtrack-v122.patch.gz.b64
          base64 -D -i MedTrackFirstTest/medtrack-v122.patch.gz.b64 -o "$RUNNER_TEMP/medtrack-v122.patch.gz.b64decoded"
          # Skip the README-only diff (older GitHub source archive has different docs).
          gzip -dc "$RUNNER_TEMP/medtrack-v122.patch.gz.b64decoded" | sed '/^--- a\/README\.md/,$d' | patch --batch --fuzz=0 -p1 -d MedTrackFirstTest
          test -s MedTrackFirstTest/MedTrack/WidgetDiagnosticsView.swift
          # Restore the exact byte-for-byte WidgetKit source shipped in working Build 1.
          # Unlike recent test builds, this has no AppIntents, no new widget state,
          # and uses the original TimelineProvider, widget kind and fallback display.
          test -s MedTrackFirstTest/WidgetBuild6/MedTrackWidget.swift
          cp MedTrackFirstTest/WidgetBuild6/MedTrackWidget.swift MedTrackFirstTest/MedTrackWidget/MedTrackWidget.swift
          echo "7d0956f769f82d41665abe530386dd3a933a9d3354a63b48013ded0af13ca9eb  MedTrackFirstTest/MedTrackWidget/MedTrackWidget.swift" | shasum -a 256 -c -
          # Preserve all other 1.2.2 app changes; update version metadata only.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('MedTrackFirstTest/generate_project.py')
          src=p.read_text()
          assert "'CURRENT_PROJECT_VERSION':'5'" in src
          assert "'MARKETING_VERSION':'1.2.2'" in src
          src=src.replace("'CURRENT_PROJECT_VERSION':'5'", "'CURRENT_PROJECT_VERSION':'6'")
          src=src.replace("'MARKETING_VERSION':'1.2.2'", "'MARKETING_VERSION':'1.2.3'")
          p.write_text(src)
          PY
          python3 MedTrackFirstTest/generate_project.py
          plutil -lint MedTrackFirstTest/MedTrack.xcodeproj/project.pbxproj
          grep -q "1.2.3" MedTrackFirstTest/MedTrack.xcodeproj/project.pbxproj
          echo "Build 6: original Build 1 widget restored; all recent app functions retained."

      - name: Compile device build with Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project MedTrackFirstTest/MedTrack.xcodeproj \
            -scheme MedTrack -configuration Release -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/medtrack-derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" clean build | tee "$RUNNER_TEMP/medtrack-xcodebuild.log"
          APP="$RUNNER_TEMP/medtrack-derived/Build/Products/Release-iphoneos/MedTrack.app"
          test -s "$APP/MedTrack"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BUILD"
          test -d "$APP/PlugIns/MedTrackWidget.appex"
          EXT="$APP/PlugIns/MedTrackWidget.appex"
          test -s "$EXT/MedTrackWidget"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist" | grep -qx 'com.apple.widgetkit-extension'
          file "$EXT/MedTrackWidget"
          echo "Verified that embedded widget extension binary and Info.plist exist." >> "$GITHUB_STEP_SUMMARY"

      - name: Package ad-hoc-signed IPA for TrollStore test devices
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/medtrack-derived/Build/Products/Release-iphoneos/MedTrack.app"
          EXT="$APP/PlugIns/MedTrackWidget.appex"
          # Exact Build 1 ad-hoc signing pattern for both extension and host.
          # Do not inject private widget-only container entitlements.
          codesign --force --sign - --timestamp=none --entitlements MedTrackFirstTest/MedTrackWidget/MedTrackWidget.entitlements "$EXT"
          codesign --force --sign - --timestamp=none --entitlements MedTrackFirstTest/MedTrack/MedTrack.entitlements "$APP"
          codesign -d --entitlements :- "$EXT" > "$RUNNER_TEMP/widget-b6-entitlements.plist" 2>/dev/null
          python3 - <<'PY'
          import plistlib, os
          from pathlib import Path
          p=plistlib.loads((Path(os.environ['RUNNER_TEMP'])/'widget-b6-entitlements.plist').read_bytes())
          assert 'com.apple.private.security.container-required' not in p, p
          assert 'group.com.nextsolution.medtrack' in p.get('com.apple.security.application-groups',[]), p
          print('Original Build 1 signing restored: App Group present, no private widget sandbox entitlement')
          PY
          codesign --verify --verbose=2 "$APP"
          codesign --verify --verbose=2 "$EXT"
          mkdir -p "$RUNNER_TEMP/medtrack-package/Payload"
          ditto "$APP" "$RUNNER_TEMP/medtrack-package/Payload/MedTrack.app"
          ( cd "$RUNNER_TEMP/medtrack-package" && zip -qry "$RUNNER_TEMP/$FILE_NAME" Payload )
          unzip -tqq "$RUNNER_TEMP/$FILE_NAME"
          shasum -a 256 "$RUNNER_TEMP/$FILE_NAME" | awk '{print $1}' > "$RUNNER_TEMP/$FILE_NAME.sha256"
          echo "Compiled, ad-hoc signed, and zip verified (TrollStore/jailbroken test only)." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain IPA artifact and checksum
        uses: actions/upload-artifact@v4
        with:
          name: MedTrack-1.2.3-b6-IPA
          path: |
            /Users/runner/work/_temp/MedTrack-1.2.3-b6.ipa
            /Users/runner/work/_temp/MedTrack-1.2.3-b6.ipa.sha256
          if-no-files-found: error

      - name: Publish successful IPA to NS Transfer on main
        shell: bash
        run: |
          set -euo pipefail
          DEST="transfer/files/MedTrack/1.2.3"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            SITE="$RUNNER_TEMP/medtrack-site"
            if [ -e "$SITE" ]; then git worktree remove --force "$SITE" || true; fi
            git worktree add --detach "$SITE" origin/main
            mkdir -p "$SITE/$DEST"
            cp "$RUNNER_TEMP/$FILE_NAME" "$SITE/$DEST/$FILE_NAME"
            cd "$SITE"
            export FILE_NAME DEST
            python3 - <<'PY'
          import json,os,hashlib
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('transfer/index.json')
          d=json.loads(p.read_text())
          f=Path(os.environ['DEST'])/os.environ['FILE_NAME']
          blob=f.read_bytes()
          entry={
            'id':'medtrack-1.2.3-b6-test',
            'name':'MedTrack 1.2.3 — Original Build 1 Widget Restored',
            'fileName':os.environ['FILE_NAME'],
            'type':'ipa',
            'platform':'iOS 16+ · TrollStore / jailbroken testing (ad-hoc signed; not Apple Distribution)',
            'version':'1.2.3 (6)',
            'url':'https://nextjailbreak.com/'+os.environ['DEST']+'/'+os.environ['FILE_NAME'],
            'sha256':hashlib.sha256(blob).hexdigest(),
            'sizeBytes':len(blob),
            'notes':'Restores byte-for-byte original Build 1 WidgetKit interface and original standard ad-hoc widget signing with no private sandbox entitlement. iOS 16+ small 1, medium 2, large 5 medications. Retains all current reminders, Taken/Skip timestamps, archive and restore, routine-learning, and Widget Diagnostics. Installs over prior versions without clearing the local database.'
          }
          d['files']=[entry]+[x for x in d.get('files',[]) if x.get('id')!=entry['id']]
          d['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
            python3 -m json.tool transfer/index.json >/dev/null
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f "$DEST/$FILE_NAME" transfer/index.json
            git commit -m "Publish MedTrack 1.2.3 Build 6 original widget restoration IPA"
            if git push origin HEAD:main; then
              echo "Published MedTrack on NS Transfer" >> "$GITHUB_STEP_SUMMARY"
              echo "https://nextjailbreak.com/$DEST/$FILE_NAME" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$SITE" || true
          done
          exit 1
