name: Build Next Jailbreak Trigger TIPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "TriggerAppTheos/**"
      - ".github/workflows/build-nextjailbreak-trigger.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build arm64 iOS app
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build dist
          APP="build/Payload/NextJailbreakTrigger.app"
          mkdir -p "$APP" dist
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          # The app calls resume on the NSURLSessionDataTask returned by dataTaskWithRequest:.
          # Keep this compatibility repair here so the test TIPA can build from the existing source.
          sed -i '' 's/\[\[NSURLSession sharedSession\] dataTaskWithRequest:/[[[NSURLSession sharedSession] dataTaskWithRequest:/g' TriggerAppTheos/main.m

          xcrun --sdk iphoneos clang \
            -fobjc-arc \
            -fblocks \
            -arch arm64 \
            -miphoneos-version-min=16.0 \
            -isysroot "$SDK" \
            TriggerAppTheos/main.m \
            -framework UIKit \
            -framework Foundation \
            -framework Security \
            -o "$APP/NextJailbreakTrigger"

          cp TriggerAppTheos/Resources/Info.plist "$APP/Info.plist"
          chmod +x "$APP/NextJailbreakTrigger"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "$APP/Info.plist"

          codesign --force --sign - --timestamp=none "$APP"

          (cd build && /usr/bin/zip -qry ../dist/NextJailbreakTrigger.tipa Payload)
          unzip -t dist/NextJailbreakTrigger.tipa
          file "$APP/NextJailbreakTrigger"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -30 || true
          ls -lh dist/NextJailbreakTrigger.tipa

      - name: Upload TIPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextJailbreakTrigger-TIPA
          path: dist/NextJailbreakTrigger.tipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG="nextjailbreak-trigger-v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/NextJailbreakTrigger.tipa --clobber
          else
            gh release create "$TAG" dist/NextJailbreakTrigger.tipa \
              --target "$GITHUB_SHA" \
              --title "Next Jailbreak Trigger v1.0.0" \
              --notes "TrollStore TIPA for iPhone 14 Pro Max / iOS 16 testing. Triggers the verified tweak, original-source news, and Dopamine 3 publishers. GitHub token is entered on-device and stored in iOS Keychain."
          fi
