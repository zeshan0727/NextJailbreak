name: Temporary Publish Next Signer 1.4.0 to Transfer

on:
  push:
    branches:
      - feature/nextsigner-1.4.0-local-signed-apps
    paths:
      - 'NextSigner/publish-trigger-140.txt'

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-nextsigner-transfer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: '1.4.0'
      ARTIFACT_ID: '10315234717'
      R2_BUCKET: next-signer-apps
      R2_ACCOUNT_ID: 4fe920e259870b0366118a17cc5727e5
      R2_PUBLIC_BASE: https://files.nextjailbreak.com
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main for Transfer metadata
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" || { echo 'CLOUDFLARE_R2_ACCESS_KEY_ID is missing'; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo 'CLOUDFLARE_R2_SECRET_ACCESS_KEY is missing'; exit 1; }

      - name: Download verified Next Signer artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/nextsigner-artifact.zip"
          mkdir -p "$RUNNER_TEMP/nextsigner-artifact"
          unzip -q "$RUNNER_TEMP/nextsigner-artifact.zip" -d "$RUNNER_TEMP/nextsigner-artifact"
          SRC="$(find "$RUNNER_TEMP/nextsigner-artifact" -type f -name "NextSigner-${VERSION}.tipa" | head -n1)"
          test -n "$SRC" && test -s "$SRC" || { echo "NextSigner-${VERSION}.tipa not found in verified artifact"; exit 1; }
          cp "$SRC" "$RUNNER_TEMP/NextSigner-${VERSION}.tipa"
          unzip -t "$RUNNER_TEMP/NextSigner-${VERSION}.tipa" >/dev/null

      - name: Install AWS CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish binary to Cloudflare R2
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          SRC="$RUNNER_TEMP/NextSigner-${VERSION}.tipa"
          OBJECT_KEY="apps/tipa/NextSigner/${VERSION}/NextSigner-${VERSION}.tipa"
          PUBLIC_URL="$R2_PUBLIC_BASE/$OBJECT_KEY"
          SHA256=$(sha256sum "$SRC" | awk '{print $1}')
          SIZE_BYTES=$(stat -c '%s' "$SRC")

          aws s3 cp "$SRC" "s3://$R2_BUCKET/$OBJECT_KEY" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type 'application/octet-stream' \
            --cache-control 'public, max-age=31536000, immutable' \
            --only-show-errors

          curl --fail --silent --show-error --location --head \
            --retry 10 --retry-delay 3 --retry-all-errors "$PUBLIC_URL" >/dev/null

          echo "NEXTSIGNER_R2_URL=$PUBLIC_URL" >> "$GITHUB_ENV"
          echo "NEXTSIGNER_SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "NEXTSIGNER_SIZE_BYTES=$SIZE_BYTES" >> "$GITHUB_ENV"
          echo "Published $PUBLIC_URL"
          echo "SHA256 $SHA256"
          echo "SIZE $SIZE_BYTES"

      - name: Update Transfer manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          version = os.environ['VERSION']
          index_path = Path('transfer/index.json')
          data = json.loads(index_path.read_text())
          files = data.get('files', [])
          files = [item for item in files if not str(item.get('id', '')).startswith('nextsigner-')]
          entry = {
              'id': f'nextsigner-{version}',
              'name': f'Next Signer {version}',
              'fileName': f'NextSigner-{version}.tipa',
              'type': 'tipa',
              'platform': 'TrollStore / iOS 16+',
              'version': version,
              'url': os.environ['NEXTSIGNER_R2_URL'],
              'sha256': os.environ['NEXTSIGNER_SHA256'],
              'sizeBytes': int(os.environ['NEXTSIGNER_SIZE_BYTES']),
              'storage': 'Cloudflare R2',
              'notes': 'Adds true on-device IPA signing, persistent Signed Apps library, direct TrollStore install, Share/Delete controls, and manual Publish to GitHub/R2 without re-signing.'
          }
          data['files'] = [entry] + files
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          index_path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          python3 -m json.tool transfer/index.json >/dev/null

      - name: Commit Transfer metadata to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json
          if git diff --cached --quiet; then
            echo 'No Transfer metadata changes to commit'
          else
            git commit -m "Publish Next Signer ${VERSION} through Cloudflare R2"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
