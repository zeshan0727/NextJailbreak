name: Publish verified Cyanide 1.6.0 article
# Trigger verified publication after workflow registration.
on:
  push:
    branches: [main]
    paths:
      - 'automation/publish_cyanide_160_20260917.py'
      - '.github/workflows/publish-cyanide-160-20260917.yml'

permissions:
  contents: write

concurrency:
  group: nextjailbreak-cyanide-160
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Validate publisher and source visual pipeline
        run: |
          python3 -m py_compile automation/publish_cyanide_160_20260917.py automation/publish_verified_batch_20260916.py automation/ios_repo_news.py automation/source_visuals.py
          python3 -m unittest automation.tests.test_source_visuals -v
      - name: Generate one verified article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: |
          test -n "${OPENAI_API_KEY:-}"
          python3 -m automation.publish_cyanide_160_20260917 | tee cyanide-160.log
      - name: Synchronize public editorial indexes
        run: python3 automation/sync_editorial_indexes.py
      - name: Validate Cyanide page
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('automation/batch-20260916-result.json').read_text())
          assert len(data['results']) == 1, data
          item=data['results'][0]
          assert item['name']=='Cyanide' and item['version']=='1.6.0', item
          assert item['status'] in {'published','duplicate'}, item
          p=Path(item['href'])/'index.html'
          assert p.exists(), p
          t=p.read_text(encoding='utf-8')
          for needle in ['<link rel="canonical"','application/ld+json','og:image','Open original source']:
              assert needle in t, needle
          print(item)
          PY
      - name: Commit approved article
        run: |
          git config user.name "nextsolution-publisher[bot]"
          git config user.email "nextsolution-publisher[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Cyanide 1.6.0 original-source article"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyanide-160-${{ github.run_number }}
          path: cyanide-160.log
          if-no-files-found: ignore
