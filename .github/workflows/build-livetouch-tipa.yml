name: Build LiveTouch TIPA

on:
  push:
    branches: ["livetouch-test"]
    paths:
      - "ios/LiveTouchWallpaper/source.tar.gz.b64"
      - "ios/LiveTouchWallpaper/overlay/**"
      - "ios/LiveTouchWallpaper/build-fixed.sh"
      - ".github/workflows/build-livetouch-tipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Restore source and apply final cleanup overlay
        run: |
          mkdir -p ios/LiveTouchWallpaper
          python3 - <<'PY'
          import base64, pathlib
          src = pathlib.Path('ios/LiveTouchWallpaper/source.tar.gz.b64').read_text().strip()
          pathlib.Path('/tmp/livetouch-source.tar.gz').write_bytes(base64.b64decode(src))
          PY
          tar -xzf /tmp/livetouch-source.tar.gz -C ios/LiveTouchWallpaper
          test -d ios/LiveTouchWallpaper/overlay/App
          test -d ios/LiveTouchWallpaper/overlay/RootHelper
          cp -f ios/LiveTouchWallpaper/overlay/App/* ios/LiveTouchWallpaper/App/
          cp -f ios/LiveTouchWallpaper/overlay/RootHelper/* ios/LiveTouchWallpaper/RootHelper/
          chmod +x ios/LiveTouchWallpaper/build-fixed.sh
          grep -Fq 'Uninstall LiveTouch Files' ios/LiveTouchWallpaper/App/LTRootViewController.m
          grep -Fq 'uninstall' ios/LiveTouchWallpaper/App/LTRootViewController.m
          grep -Fq 'LiveTouch uninstall cleanup complete.' ios/LiveTouchWallpaper/App/LTRootHelperEmbedded.m
          grep -Fq '/usr/lib/TweakInject' ios/LiveTouchWallpaper/App/LTRootHelperEmbedded.m
          grep -Fq '/Library/MobileSubstrate/DynamicLibraries' ios/LiveTouchWallpaper/App/LTRootHelperEmbedded.m
          grep -Fq '/var/mobile/Library/LiveTouchWallpaper' ios/LiveTouchWallpaper/App/LTRootHelperEmbedded.m
          grep -Fq 'com.nextjailbreak.livetouch.plist' ios/LiveTouchWallpaper/App/LTRootHelperEmbedded.m

      - name: Install Theos dependencies
        run: |
          brew install ldid xz
          echo "THEOS=$GITHUB_WORKSPACE/.theos-roothide" >> "$GITHUB_ENV"
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$GITHUB_WORKSPACE/.theos-roothide"
          mkdir -p "$GITHUB_WORKSPACE/.theos-roothide/sdks"
          curl -L --fail -o /tmp/iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$GITHUB_WORKSPACE/.theos-roothide/sdks"

      - name: Build and validate LiveTouch 0.1.7 final cleanup
        run: |
          cd ios/LiveTouchWallpaper
          THEOS="$GITHUB_WORKSPACE/.theos-roothide" ./build-fixed.sh
          APP=build/LiveTouch-0.1.7-final-cleanup.tipa
          unzip -tq "$APP" >/dev/null
          unzip -l "$APP" | tee /tmp/livetouch-list.txt
          ! grep -Fq 'LiveTouchEngine.dylib' /tmp/livetouch-list.txt
          ! grep -Fq 'LiveTouchEngine.plist' /tmp/livetouch-list.txt
          unzip -p "$APP" Payload/LiveTouch.app/Info.plist >/tmp/LiveTouch-Info.plist
          unzip -p "$APP" Payload/LiveTouch.app/LiveTouch >/tmp/LiveTouch-main
          unzip -p "$APP" Payload/LiveTouch.app/LiveTouchRootHelper >/tmp/LiveTouch-helper
          chmod +x /tmp/LiveTouch-main /tmp/LiveTouch-helper
          plutil -lint /tmp/LiveTouch-Info.plist
          python3 - <<'PY'
          import plistlib
          with open('/tmp/LiveTouch-Info.plist','rb') as f: p=plistlib.load(f)
          assert p['CFBundleIdentifier']=='com.nextjailbreak.livetouch'
          assert p['CFBundleDisplayName']=='LiveTouch Cleanup'
          assert p['CFBundleShortVersionString']=='0.1.7'
          assert p['CFBundleVersion']=='8'
          assert p['TSRootBinaries']==['LiveTouchRootHelper']
          PY
          strings /tmp/LiveTouch-main | grep -Fq -- '--root-helper'
          strings /tmp/LiveTouch-main | grep -Fq 'Uninstall LiveTouch Files'
          strings /tmp/LiveTouch-main | grep -Fq 'LiveTouch uninstall cleanup complete.'
          strings /tmp/LiveTouch-main | grep -Fq '/usr/lib/TweakInject'
          strings /tmp/LiveTouch-main | grep -Fq '/Library/MobileSubstrate/DynamicLibraries'
          strings /tmp/LiveTouch-main | grep -Fq '/var/mobile/Library/LiveTouchWallpaper'
          strings /tmp/LiveTouch-main | grep -Fq 'com.nextjailbreak.livetouch.plist'
          ldid -e /tmp/LiveTouch-main >/tmp/LiveTouch-entitlements.plist
          grep -Fq 'platform-application' /tmp/LiveTouch-entitlements.plist
          grep -Fq 'com.apple.private.security.no-sandbox' /tmp/LiveTouch-entitlements.plist
          ! otool -L /tmp/LiveTouch-main | grep -Fq 'libroothide.dylib'
          file /tmp/LiveTouch-main /tmp/LiveTouch-helper
          shasum -a 256 "$APP"
          ls -lh "$APP"

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveTouch-0.1.7-final-cleanup
          path: ios/LiveTouchWallpaper/build/LiveTouch-0.1.7-final-cleanup.tipa
          if-no-files-found: error
