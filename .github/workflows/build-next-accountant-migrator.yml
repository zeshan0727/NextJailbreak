name: Build Next Accountant Web Migrator

# PAUSED 2026-10-27: Windows ACCOUNTANTS is the active development path.
# No automatic web deployment/build. Keep for manual resumption only.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: next-accountant-migrator-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore tools/next-accountant-migrator/NextAccountant.Migrator.csproj

      - name: Build
        run: dotnet build tools/next-accountant-migrator/NextAccountant.Migrator.csproj -c Release --no-restore

      - name: Publish single-file Windows x64
        run: dotnet publish tools/next-accountant-migrator/NextAccountant.Migrator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/migrator

      - name: Create package
        shell: pwsh
        run: |
          Copy-Item tools/next-accountant-migrator/README.md out/migrator/README.md
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo ============================================================
          echo NEXT ACCOUNTANT WEB - BUSINESS BACKUP SAFE PRECHECK
          echo ============================================================
          echo.
          echo This test does NOT upload data and does NOT change ACCOUNTANTS.
          echo It verifies the newest V6 business backup only.
          echo.
          NextAccountantMigrator.exe --prepare-only
          set "RC=%ERRORLEVEL%"
          echo.
          if "%RC%"=="0" (
            echo PRECHECK COMPLETED SUCCESSFULLY.
          ) else (
            echo PRECHECK STOPPED WITH ERROR %RC%.
          )
          echo.
          pause
          exit /b %RC%
          '@ | Set-Content -Encoding ascii out/migrator/TEST_BACKUP_ONLY.bat
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo Next Accountant - secure staging key preparation
          NextAccountantMigrator.exe --prepare-staging-key
          echo.
          echo Send ONLY NEXT_ACCOUNTANT_STAGING_PUBLIC_KEY.pem to ChatGPT.
          echo Never send the private Windows key, database or an authentication token.
          pause
          '@ | Set-Content -Encoding ascii out/migrator/PREPARE_STAGING_KEY.bat
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo This will upload a COPY of the latest verified V6 backup to isolated Cloudflare STAGING.
          echo Production ACCOUNTANTS and the production Cloudflare API will NOT be changed.
          echo.
          if not exist "NEXT_ACCOUNTANT_STAGING_CREDENTIAL.txt" (
            echo Secure staging credential is missing. Stop.
            pause
            exit /b 1
          )
          NextAccountantMigrator.exe --commit-staging-import
          echo.
          if errorlevel 1 (
            echo STAGING IMPORT FAILED or BLOCKED. See the error above.
          ) else (
            echo STAGING IMPORT COMPLETED - further financial reconciliation is still required.
          )
          pause
          '@ | Set-Content -Encoding ascii out/migrator/IMPORT_TO_STAGING_ONLY.bat
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo ============================================================
          echo NEXT ACCOUNTANT - STAGING FILE-ONLY RECOVERY
          echo ============================================================
          echo This mode NEVER reimports database rows or source schema.
          echo It requires the exact source V6 backup and verifies every
          echo staging source table count matches before touching R2.
          echo Completed R2 files are SHA-256 validated, not overwritten.
          if not exist "NEXT_ACCOUNTANT_STAGING_CREDENTIAL.txt" (
            echo Encrypted credential missing. No changes made.
            pause
            exit /b 1
          )
          NextAccountantMigrator.exe --resume-staging-files-only
          set "RC=%ERRORLEVEL%"
          echo.
          if "%RC%"=="0" (
            echo FILE RECOVERY COMPLETE - FINANCIAL RECONCILIATION STILL REQUIRED.
          ) else (
            echo FILE RECOVERY BLOCKED OR FAILED. DO NOT RE-RUN. SEND LOG.
          )
          pause
          exit /b %RC%
          '@ | Set-Content -Encoding ascii out/migrator/RESUME_FILES_ONLY.bat
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo ==================================================
          echo NEXT ACCOUNTANT WEB - PRIVATE STAGING LOGIN
          echo ==================================================
          echo This opens a read-only, authenticated web session.
          echo The business database and private files stay in Cloudflare.
          echo Your Windows encrypted credential stays on this PC.
          echo.
          if not exist "NEXT_ACCOUNTANT_STAGING_CREDENTIAL.txt" (
            echo Encrypted credential missing. Login was not started.
            pause
            exit /b 1
          )
          NextAccountantMigrator.exe --open-staging-web
          set "RC=%ERRORLEVEL%"
          if NOT "%RC%"=="0" (
            echo.
            echo PRIVATE LOGIN FAILED. See the error above.
          )
          pause
          exit /b %RC%
          '@ | Set-Content -Encoding ascii out/migrator/OPEN_ACCOUNTANT_WEB.bat
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo NEXT ACCOUNTANT - READ ONLY FINANCIAL RECONCILIATION
          echo Comparing exact imported October 26 V6 backup with Cloudflare staging.
          echo No accounting or R2 writes occur during this check.
          echo.
          if not exist "NEXT_ACCOUNTANT_STAGING_CREDENTIAL.txt" (
            echo Encrypted credential missing. Reconciliation stopped.
            pause
            exit /b 1
          )
          NextAccountantMigrator.exe --financial-reconcile-only
          set "RC=%ERRORLEVEL%"
          echo.
          if "%RC%"=="0" (
            echo FINANCIAL SOURCE TO STAGING RECONCILIATION: PASS
          ) else (
            echo FINANCIAL CHECK FAILED. DO NOT CUT OVER PRODUCTION.
          )
          pause
          exit /b %RC%
          '@ | Set-Content -Encoding ascii out/migrator/VERIFY_FINANCIALS_ONLY.bat
          Compress-Archive -Path out/migrator/* -DestinationPath out/NextAccountantWebMigrator_0.5.0_STAGING_ONLY_win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextAccountantWebMigrator-0.5.0-staging-only-win-x64
          path: out/NextAccountantWebMigrator_0.5.0_STAGING_ONLY_win-x64.zip
          if-no-files-found: error

      - name: Assemble encrypted file-only recovery bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force out/recovery | Out-Null
          gh run download 40330435637 --repo zeshan0727/NextJailbreak --name NextAccountantStagingEncryptedCredential --dir out/recovery
          foreach ($name in @('NextAccountantMigrator.exe','RESUME_FILES_ONLY.bat')) {
            Copy-Item "out/migrator/$name" "out/recovery/$name" -ErrorAction Stop
          }
          $credential = "out/recovery/NEXT_ACCOUNTANT_STAGING_CREDENTIAL.txt"
          if (-not (Test-Path $credential) -or (Get-Item $credential).Length -lt 400) {
            throw "Encrypted staging credential missing. Will not create recovery package."
          }
          @'
          NEXT ACCOUNTANT STAGING FILE-ONLY RECOVERY v0.2.2
          =================================================
          THIS IS NOT THE FULL IMPORTER. It contains no full-import launcher.

          1. Extract this ZIP on the SAME Windows user account that
             generated the staging RSA private key.
          2. Double click RESUME_FILES_ONLY.bat.
          3. The executable verifies the source business backup (schema
             21, 109 tables, 11,913 rows, 909 files, exact source filename).
          4. It remotely checks every staging table row count and verifies
             the partial R2 file index before any file writes.
          5. It does not reimport, delete, or alter any existing DB rows.
          6. Existing R2 objects are SHA-256 checked and reused.
          7. All 909 files must be hash-verified and indexed for success.
          8. On ANY failure, do NOT rerun; send the console error.

          Staging token is RSA encrypted; no plaintext credentials,
          business data, personal files or private keys are included.
          Financial statement and contract reconciliation follows separately.
          '@ | Set-Content -Encoding utf8 out/recovery/README_FIRST.txt

      - name: Upload encrypted file-only recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextAccountantStagingFileRecovery-0.2.2-OneClick-Encrypted
          path: out/recovery/*
          if-no-files-found: error
          retention-days: 7

      - name: Assemble encrypted one-click private web login package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force out/webaccess | Out-Null
          gh run download 40330435637 --repo zeshan0727/NextJailbreak --name NextAccountantStagingEncryptedCredential --dir out/webaccess
          foreach ($name in @('NextAccountantMigrator.exe','OPEN_ACCOUNTANT_WEB.bat','VERIFY_FINANCIALS_ONLY.bat')) {
            Copy-Item "out/migrator/$name" "out/webaccess/$name" -ErrorAction Stop
          }
          $cipher="out/webaccess/NEXT_ACCOUNTANT_STAGING_CREDENTIAL.txt"
          if (!(Test-Path $cipher) -or (Get-Item $cipher).Length -lt 400) {
            throw "Encrypted staging credential unavailable; private web package not built."
          }
          @'
          NEXT ACCOUNTANT PRIVATE WEB STAGING v0.5.0
          ========================================
          Extract the folder on the same Windows user profile used for
          the V6 staging migration.
          Run OPEN_ACCOUNTANT_WEB.bat to inspect private staging.
          Run VERIFY_FINANCIALS_ONLY.bat to compare the original backup
          and Cloudflare amounts without modifying either database.

          This program never uploads/changes accounting records when
          launched in private-web mode. It uses the original DPAPI
          protected staging credential to request a single-use login
          ticket (90 seconds). The browser receives a scoped HttpOnly
          read-only session cookie, not the migration credential.

          Keep these files private; do not upload them to GitHub.
          Web access expires after 8 hours. Repeat the launcher to login.
          Imported business data is in a private Cloudflare staging DB.
          This is NOT approved as the production accounting system.
          '@ | Set-Content -Encoding utf8 out/webaccess/README_FIRST.txt

      - name: Upload private web viewer (no full migration launcher)
        uses: actions/upload-artifact@v4
        with:
          name: NextAccountantPrivateWeb-0.5.0-WindowsEncrypted
          path: out/webaccess/*
          if-no-files-found: error
          retention-days: 7
