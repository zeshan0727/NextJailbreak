name: Publish Next Post to Transfer

# 1.0.15 removes all advertising code/SDKs and permanently prevents article repeats.
# Trigger publication after the verified 1.0.15 build artifact is committed.
# Verified 1.0.15 build ready.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'applications/NextPost-1.0.15-No-Ads-All-Articles.tipa'
      - '.github/workflows/publish-nextpost-transfer.yml'

permissions:
  contents: write

concurrency:
  group: publish-nextpost-transfer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Next Post and update Transfer manifest
        shell: bash
        run: |
          set -euo pipefail
          SRC='applications/NextPost-1.0.15-No-Ads-All-Articles.tipa'
          DEST_DIR='transfer/files/NextPost/1.0.15'
          DEST="$DEST_DIR/NextPost-1.0.15-No-Ads-All-Articles.tipa"
          INDEX='transfer/index.json'

          test -s "$SRC"
          test -s "$INDEX"
          mkdir -p "$DEST_DIR"
          cp "$SRC" "$DEST"

          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          SIZE=$(stat -c%s "$DEST")
          export SHA256 SIZE

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          index_path = Path('transfer/index.json')
          data = json.loads(index_path.read_text())
          files = data.get('files', [])
          entry_id = 'nextpost-1.0.15-no-ads-all-articles'
          files = [item for item in files if item.get('id') != entry_id]
          entry = {
              'id': entry_id,
              'name': 'Next Post 1.0.15 — No Ads + All Articles',
              'fileName': 'NextPost-1.0.15-No-Ads-All-Articles.tipa',
              'type': 'tipa',
              'platform': 'TrollStore / iOS 16+',
              'version': '1.0.15 (14)',
              'url': 'https://nextjailbreak.com/transfer/files/NextPost/1.0.15/NextPost-1.0.15-No-Ads-All-Articles.tipa',
              'sha256': os.environ['SHA256'],
              'sizeBytes': int(os.environ['SIZE']),
              'notes': 'Ad-free edition with a separate All Articles tab showing the complete published catalogue, numbered newest first, searchable with published dates and Generate status. Supports selecting an unused article to compose. No ad SDKs, no interstitials, no repeated posts.'
          }
          data['files'] = [entry] + files
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          index_path.write_text(json.dumps(data, indent=2) + '\n')
          PY

          python3 -m json.tool "$INDEX" >/dev/null
          grep -q 'nextpost-1.0.15-no-ads-all-articles' "$INDEX"
          grep -q "$SHA256" "$INDEX"
          test "$(sha256sum "$DEST" | awk '{print $1}')" = "$SHA256"

      - name: Commit Transfer publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/files/NextPost/1.0.15/NextPost-1.0.15-No-Ads-All-Articles.tipa transfer/index.json
          git commit -m 'Publish Next Post 1.0.15 to Transfer' || true
          git pull --rebase origin main
          git push origin HEAD:main
