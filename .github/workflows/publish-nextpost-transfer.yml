name: Publish Next Post to Transfer

# 1.0.14 removes all advertising code/SDKs and permanently prevents article repeats.
# Trigger publication after the verified 1.0.14 build artifact is committed.
# Verified 1.0.14 build ready.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'applications/NextPost-1.0.14-No-Ads-No-Repeats.tipa'
      - '.github/workflows/publish-nextpost-transfer.yml'

permissions:
  contents: write

concurrency:
  group: publish-nextpost-transfer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Next Post and update Transfer manifest
        shell: bash
        run: |
          set -euo pipefail
          SRC='applications/NextPost-1.0.14-No-Ads-No-Repeats.tipa'
          DEST_DIR='transfer/files/NextPost/1.0.14'
          DEST="$DEST_DIR/NextPost-1.0.14-No-Ads-No-Repeats.tipa"
          INDEX='transfer/index.json'

          test -s "$SRC"
          test -s "$INDEX"
          mkdir -p "$DEST_DIR"
          cp "$SRC" "$DEST"

          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          SIZE=$(stat -c%s "$DEST")
          export SHA256 SIZE

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          index_path = Path('transfer/index.json')
          data = json.loads(index_path.read_text())
          files = data.get('files', [])
          entry_id = 'nextpost-1.0.14-no-ads-no-repeats'
          files = [item for item in files if item.get('id') != entry_id]
          entry = {
              'id': entry_id,
              'name': 'Next Post 1.0.14 — No Ads + No Repeats',
              'fileName': 'NextPost-1.0.14-No-Ads-No-Repeats.tipa',
              'type': 'tipa',
              'platform': 'TrollStore / iOS 16+',
              'version': '1.0.14 (14)',
              'url': 'https://nextjailbreak.com/transfer/files/NextPost/1.0.14/NextPost-1.0.14-No-Ads-No-Repeats.tipa',
              'sha256': os.environ['SHA256'],
              'sizeBytes': int(os.environ['SIZE']),
              'notes': 'Removes all advertising UI, IronSource/LevelPlay SDK dependencies, interstitials, test controls and advertising metadata. Generated articles are permanently marked used with domain-independent IDs; when Remaining reaches zero, the app waits for newly published articles and never starts a repeat cycle. The searchable Remaining selector, automatic post composer, Refresh, Copy Text and Open in X remain.'
          }
          data['files'] = [entry] + files
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          index_path.write_text(json.dumps(data, indent=2) + '\n')
          PY

          python3 -m json.tool "$INDEX" >/dev/null
          grep -q 'nextpost-1.0.14-no-ads-no-repeats' "$INDEX"
          grep -q "$SHA256" "$INDEX"
          test "$(sha256sum "$DEST" | awk '{print $1}')" = "$SHA256"

      - name: Commit Transfer publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/files/NextPost/1.0.14/NextPost-1.0.14-No-Ads-No-Repeats.tipa transfer/index.json
          git commit -m 'Publish Next Post 1.0.14 to Transfer' || true
          git pull --rebase origin main
          git push origin HEAD:main
