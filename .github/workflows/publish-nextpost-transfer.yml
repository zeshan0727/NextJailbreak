name: Publish Next Post to Transfer

# 1.0.13 restores the 1.0.11 automatic post flow and adds manual selection from Remaining.
# Trigger publication after verified build artifact is committed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'applications/NextPost-1.0.13-Selectable-Remaining.tipa'
      - '.github/workflows/publish-nextpost-transfer.yml'

permissions:
  contents: write

concurrency:
  group: publish-nextpost-transfer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Next Post and update Transfer manifest
        shell: bash
        run: |
          set -euo pipefail
          SRC='applications/NextPost-1.0.13-Selectable-Remaining.tipa'
          DEST_DIR='transfer/files/NextPost/1.0.13'
          DEST="$DEST_DIR/NextPost-1.0.13-Selectable-Remaining.tipa"
          INDEX='transfer/index.json'

          test -s "$SRC"
          test -s "$INDEX"
          mkdir -p "$DEST_DIR"
          cp "$SRC" "$DEST"

          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          SIZE=$(stat -c%s "$DEST")
          export SHA256 SIZE

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          index_path = Path('transfer/index.json')
          data = json.loads(index_path.read_text())
          files = data.get('files', [])
          entry_id = 'nextpost-1.0.13-selectable-remaining'
          files = [item for item in files if item.get('id') != entry_id]
          entry = {
              'id': entry_id,
              'name': 'Next Post 1.0.13 — Selectable Remaining',
              'fileName': 'NextPost-1.0.13-Selectable-Remaining.tipa',
              'type': 'tipa',
              'platform': 'TrollStore / iOS 16+',
              'version': '1.0.13 (13)',
              'url': 'https://nextjailbreak.com/transfer/files/NextPost/1.0.13/NextPost-1.0.13-Selectable-Remaining.tipa',
              'sha256': os.environ['SHA256'],
              'sizeBytes': int(os.environ['SIZE']),
              'notes': 'Restores the complete 1.0.11 automatic X post generation flow and removes the 1.0.12 Your Take/protected-queue behavior. Remaining now opens a searchable list of unused articles; select any article and Generate creates the full post automatically, marks it used, and updates Remaining. Random Generate, Refresh Articles, Copy Text, Open in X, preview card and focused hashtags remain as in 1.0.11.'
          }
          data['files'] = [entry] + files
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          index_path.write_text(json.dumps(data, indent=2) + '\n')
          PY

          python3 -m json.tool "$INDEX" >/dev/null
          grep -q 'nextpost-1.0.13-selectable-remaining' "$INDEX"
          grep -q "$SHA256" "$INDEX"
          test "$(sha256sum "$DEST" | awk '{print $1}')" = "$SHA256"

      - name: Commit Transfer publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/files/NextPost/1.0.13/NextPost-1.0.13-Selectable-Remaining.tipa transfer/index.json
          git commit -m 'Publish Next Post 1.0.13 to Transfer' || true
          git pull --rebase origin main
          git push origin HEAD:main
