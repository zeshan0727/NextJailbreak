name: Publish Sealora 1.0.4 to NS Transfer
on:
  workflow_run:
    workflows: ["Sealora 1.0.4 simplified signing setup build"]
    types: [completed]
    branches: [sealora-ios-test]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-sealora-104-ns-transfer
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified Sealora 1.0.4 iOS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42821433414 --jq .conclusion)" = success
          mkdir -p "$RUNNER_TEMP/sealora103"
          gh run download 42821433414 --repo "$GITHUB_REPOSITORY" --name Sealora-1.0.4-unsigned-IPA --dir "$RUNNER_TEMP/sealora103"
          test -s "$RUNNER_TEMP/sealora103/Sealora-unsigned.ipa"
          python3 - "$RUNNER_TEMP/sealora103/Sealora-unsigned.ipa" <<'PY'
          import sys,zipfile,plistlib
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None, 'Damaged IPA'
              matches = [s for s in z.namelist() if s.startswith('Payload/') and s.endswith('.app/Info.plist') and s.count('/')==2]
              assert len(matches)==1,matches
              info = plistlib.loads(z.read(matches[0]))
              assert info['CFBundleIdentifier']=='com.nextsolution.sealora'
              assert info['CFBundleShortVersionString']=='1.0.4'
              assert str(info['CFBundleVersion'])=='5'
              assert info['MinimumOSVersion']=='16.0'
              assert not info.get('CFBundleURLTypes'), 'Retired UDID callback still present'
              executable=matches[0].removesuffix('Info.plist')+info['CFBundleExecutable']
              assert z.getinfo(executable).file_size>500_000
          PY
      - name: Publish unsigned test IPA and catalog metadata
        run: |
          set -euo pipefail
          mkdir -p transfer/files/Sealora/1.0.4
          cp "$RUNNER_TEMP/sealora103/Sealora-unsigned.ipa" transfer/files/Sealora/1.0.4/Sealora-1.0.4-unsigned.ipa
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          from datetime import datetime, timezone
          ipa=Path('transfer/files/Sealora/1.0.4/Sealora-1.0.4-unsigned.ipa')
          catalog_path=Path('transfer/index.json')
          catalog=json.loads(catalog_path.read_text())
          entry={
            'id':'sealora-1.0.4-build5-unsigned',
            'name':'Sealora 1.0.4 — No UDID Setup',
            'fileName':ipa.name,
            'type':'ipa',
            'platform':'iOS 16+; unsigned IPA (requires compatible signing before installation)',
            'version':'1.0.4 (5)',
            'url':'https://nextjailbreak.com/transfer/files/Sealora/1.0.4/Sealora-1.0.4-unsigned.ipa',
            'sha256':hashlib.sha256(ipa.read_bytes()).hexdigest(),
            'sizeBytes':ipa.stat().st_size,
            'notes':'Removed manual UDID input, UDID profile download, and UDID preflight requirement. Saved credentials and imported IPAs remain; Apple Ad Hoc device restrictions still apply at installation. Unsigned iOS 16+ test IPA.'
          }
          catalog['files']=[entry]+[x for x in catalog.get('files',[]) if not str(x.get('id','')).startswith('sealora-')]
          catalog['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          catalog_path.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n')
          print('Publishing SHA256',entry['sha256'])
          PY
          python3 -m json.tool transfer/index.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json transfer/files/Sealora/1.0.4/Sealora-1.0.4-unsigned.ipa
          git commit -m 'Publish Sealora 1.0.4 unsigned test IPA to NS Transfer'
          git pull --rebase origin main
          git push origin HEAD:main
