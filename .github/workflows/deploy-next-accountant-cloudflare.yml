name: Deploy Next Accountant Cloudflare backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-next-accountant-cloudflare.yml"
      - "cloudflare/next-accountant-api/worker.js"
      - "cloudflare/next-accountant-api/schema.sql"

permissions:
  contents: read

concurrency:
  group: next-accountant-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${TOKEN:-}" ] && [ -n "${ACCOUNT:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured in GitHub repository secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Wrangler
        if: steps.cloudflare.outputs.enabled == 'true'
        run: npm install --global wrangler@latest

      - name: Resolve or create D1 database
        if: steps.cloudflare.outputs.enabled == 'true'
        id: db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 list --json > /tmp/d1.json
          DB_ID=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/d1.json'))
          for item in data:
              if item.get('name') == 'next-accountant':
                  print(item.get('uuid') or item.get('id') or '')
                  break
          PY
          )
          if [ -z "$DB_ID" ]; then
            wrangler d1 create next-accountant
            wrangler d1 list --json > /tmp/d1.json
            DB_ID=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/d1.json'))
          for item in data:
              if item.get('name') == 'next-accountant':
                  print(item.get('uuid') or item.get('id') or '')
                  break
          PY
            )
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Ensure private R2 buckets
        if: steps.cloudflare.outputs.enabled == 'true'
        id: r2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set +e
          wrangler r2 bucket info next-accountant-files --json >/dev/null 2>&1 || wrangler r2 bucket create next-accountant-files >/dev/null 2>&1
          FILES_RC=$?
          wrangler r2 bucket info next-accountant-backups --json >/dev/null 2>&1 || wrangler r2 bucket create next-accountant-backups >/dev/null 2>&1
          BACKUPS_RC=$?

          if [ "$FILES_RC" -ne 0 ] || [ "$BACKUPS_RC" -ne 0 ]; then
            if [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
              python3 -m pip install --user --quiet awscli
              export PATH="$HOME/.local/bin:$PATH"
              ENDPOINT="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"

              aws s3api head-bucket --bucket next-accountant-files --endpoint-url "$ENDPOINT" >/dev/null 2>&1 ||
                aws s3api create-bucket --bucket next-accountant-files --endpoint-url "$ENDPOINT" >/dev/null 2>&1
              FILES_RC=$?

              aws s3api head-bucket --bucket next-accountant-backups --endpoint-url "$ENDPOINT" >/dev/null 2>&1 ||
                aws s3api create-bucket --bucket next-accountant-backups --endpoint-url "$ENDPOINT" >/dev/null 2>&1
              BACKUPS_RC=$?
            fi
          fi
          set -e

          if [ "$FILES_RC" -eq 0 ] && [ "$BACKUPS_RC" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Private ACCOUNTANTS R2 buckets are available." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "R2 permissions remain restricted. D1/Worker deployment will continue without file bindings." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Diagnose R2 S3 availability
        if: steps.cloudflare.outputs.enabled == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set +e
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "R2_S3_FILES=credentials_missing"
            echo "R2_S3_BACKUPS=credentials_missing"
            exit 0
          fi
          python3 -m pip install --user --quiet awscli
          export PATH="$HOME/.local/bin:$PATH"
          ENDPOINT="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3api head-bucket --bucket next-accountant-files --endpoint-url "$ENDPOINT" >/dev/null 2>&1
          if [ "$?" -eq 0 ]; then echo "R2_S3_FILES=available"; else echo "R2_S3_FILES=unavailable"; fi
          aws s3api head-bucket --bucket next-accountant-backups --endpoint-url "$ENDPOINT" >/dev/null 2>&1
          if [ "$?" -eq 0 ]; then echo "R2_S3_BACKUPS=available"; else echo "R2_S3_BACKUPS=unavailable"; fi
          set -e

      - name: Build deployment config
        if: steps.cloudflare.outputs.enabled == 'true'
        env:
          DB_ID: ${{ steps.db.outputs.database_id }}
        run: |
          cat > cloudflare/next-accountant-api/wrangler.deploy.toml <<EOF2
          name = "next-accountant-api"
          main = "worker.js"
          compatibility_date = "2026-10-26"
          workers_dev = false

          routes = [
            { pattern = "accounts-api.nextjailbreak.com", custom_domain = true }
          ]

          [[d1_databases]]
          binding = "DB"
          database_name = "next-accountant"
          database_id = "$DB_ID"
          EOF2

          if [ "${{ steps.r2.outputs.enabled }}" = "true" ]; then
            cat >> cloudflare/next-accountant-api/wrangler.deploy.toml <<EOF2

          [[r2_buckets]]
          binding = "FILES"
          bucket_name = "next-accountant-files"

          [[r2_buckets]]
          binding = "BACKUPS"
          bucket_name = "next-accountant-backups"
          EOF2
          fi

      - name: Apply bootstrap schema
        if: steps.cloudflare.outputs.enabled == 'true'
        working-directory: cloudflare/next-accountant-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute next-accountant --remote --file=schema.sql --config=wrangler.deploy.toml --yes

      - name: Deploy Worker
        if: steps.cloudflare.outputs.enabled == 'true'
        working-directory: cloudflare/next-accountant-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config=wrangler.deploy.toml

      - name: Configure owner and AI secrets safely
        if: steps.cloudflare.outputs.enabled == 'true'
        working-directory: cloudflare/next-accountant-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_TOKEN: ${{ secrets.NEXT_ACCOUNTANT_OWNER_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > /tmp/next-accountant-owner-public.pem <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEArMfZypOqus8VUC0UMS0I
          0zGrDSLhYyRmx4fvvostpM6j+xJu9wFV0ip5N1vSmGNjny6+YvuiVLabHoh27ZYX
          PLJGjzclnZuSAzve9QuEEjAFv02yS5L6ULI1s+bf8QILVql41LQavDNVbzlCadI7
          y9opnzPfuld2VhWgkV82rMfB3IedP+8VdUICGhx8C/Qv4tTKb5laXSzuZeYp+ZH8
          VJTj8jlQjzeCyap795FE4jNxoMJVVSGswFWHZO1g2Yv0I7bc34rox40NLHvhwhS8
          bz8YGoyH2OETHz7Aa2myZ1A2i4wGtS577a0mPM0VMllpw85bwZZ97Pv3z/hMgNWx
          aLYJVWBo0L4e4mkq3TBHiq/NhuR+QnxcCV33fF/Zd0Nv2xxauqlLywM3ey65i/Se
          jDTVf1YQdvRf/xEBOKs/UK+jWzQyT62rJbjcQ8kod0UIvpZJ9K8eFFzXtzR/ULgV
          Lhh4ztxESe/4TDl2l9v/6O0JJw/xPIuaZ7j+dR4g/u1TAgMBAAE=
          -----END PUBLIC KEY-----
          PUBKEY

          EXISTING=$(wrangler secret list --config=wrangler.deploy.toml 2>/dev/null || echo '[]')
          HAS_OWNER=$(printf '%s' "$EXISTING" | python3 -c "import sys,json; d=json.load(sys.stdin); print('true' if any((x.get('name')=='OWNER_TOKEN') for x in d) else 'false')" 2>/dev/null || echo false)

          if [ -n "${OWNER_TOKEN:-}" ]; then
            printf '%s' "$OWNER_TOKEN" | wrangler secret put OWNER_TOKEN --config=wrangler.deploy.toml >/dev/null
            echo "Owner secret synchronized from protected GitHub secret." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HAS_OWNER" = "true" ]; then
            echo "Existing Cloudflare OWNER_TOKEN preserved; no rotation performed." >> "$GITHUB_STEP_SUMMARY"
          else
            GENERATED_OWNER=$(openssl rand -hex 32)
            printf '%s' "$GENERATED_OWNER" | wrangler secret put OWNER_TOKEN --config=wrangler.deploy.toml >/dev/null
            ENCRYPTED_OWNER=$(printf '%s' "$GENERATED_OWNER" | openssl pkeyutl -encrypt -pubin -inkey /tmp/next-accountant-owner-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)
            echo "NEXT_ACCOUNTANT_OWNER_TOKEN_ENCRYPTED=$ENCRYPTED_OWNER"
            echo "A new owner token was created and escrowed only as RSA-OAEP ciphertext." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "${OPENAI_KEY:-}" ]; then
            printf '%s' "$OPENAI_KEY" | wrangler secret put OPENAI_API_KEY --config=wrangler.deploy.toml >/dev/null
          else
            echo "OPENAI_API_KEY is not set for this Worker yet." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify backend
        if: steps.cloudflare.outputs.enabled == 'true'
        run: |
          sleep 8
          curl --fail --retry 8 --retry-delay 4 --max-time 20 https://accounts-api.nextjailbreak.com/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          echo "### Next Accountant Cloudflare backend verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: https://accounts-api.nextjailbreak.com/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1: next-accountant" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.r2.outputs.enabled }}" = "true" ]; then
            echo "- R2: next-accountant-files / next-accountant-backups" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- R2: pending API-token permission upgrade" >> "$GITHUB_STEP_SUMMARY"
          fi
