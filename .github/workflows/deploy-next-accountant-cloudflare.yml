name: Deploy Next Accountant Cloudflare backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-next-accountant-cloudflare.yml"
      - "cloudflare/next-accountant-api/**"

permissions:
  contents: read

concurrency:
  group: next-accountant-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${TOKEN:-}" ] && [ -n "${ACCOUNT:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured in GitHub repository secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Wrangler
        if: steps.cloudflare.outputs.enabled == 'true'
        run: npm install --global wrangler@latest

      - name: Resolve or create D1 database
        if: steps.cloudflare.outputs.enabled == 'true'
        id: db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 list --json > /tmp/d1.json
          DB_ID=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/d1.json'))
          for item in data:
              if item.get('name') == 'next-accountant':
                  print(item.get('uuid') or item.get('id') or '')
                  break
          PY
          )
          if [ -z "$DB_ID" ]; then
            wrangler d1 create next-accountant
            wrangler d1 list --json > /tmp/d1.json
            DB_ID=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/d1.json'))
          for item in data:
              if item.get('name') == 'next-accountant':
                  print(item.get('uuid') or item.get('id') or '')
                  break
          PY
            )
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Ensure private R2 buckets
        if: steps.cloudflare.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler r2 bucket info next-accountant-files --json >/dev/null 2>&1 || wrangler r2 bucket create next-accountant-files
          wrangler r2 bucket info next-accountant-backups --json >/dev/null 2>&1 || wrangler r2 bucket create next-accountant-backups

      - name: Build deployment config
        if: steps.cloudflare.outputs.enabled == 'true'
        env:
          DB_ID: ${{ steps.db.outputs.database_id }}
        run: |
          cat > cloudflare/next-accountant-api/wrangler.deploy.toml <<EOF2
          name = "next-accountant-api"
          main = "worker.js"
          compatibility_date = "2026-10-26"
          workers_dev = false

          routes = [
            { pattern = "accounts-api.nextjailbreak.com", custom_domain = true }
          ]

          [[d1_databases]]
          binding = "DB"
          database_name = "next-accountant"
          database_id = "$DB_ID"

          [[r2_buckets]]
          binding = "FILES"
          bucket_name = "next-accountant-files"

          [[r2_buckets]]
          binding = "BACKUPS"
          bucket_name = "next-accountant-backups"
          EOF2

      - name: Apply bootstrap schema
        if: steps.cloudflare.outputs.enabled == 'true'
        working-directory: cloudflare/next-accountant-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute next-accountant --remote --file=schema.sql --config=wrangler.deploy.toml --yes

      - name: Deploy Worker
        if: steps.cloudflare.outputs.enabled == 'true'
        working-directory: cloudflare/next-accountant-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config=wrangler.deploy.toml

      - name: Configure owner and AI secrets when available
        if: steps.cloudflare.outputs.enabled == 'true'
        working-directory: cloudflare/next-accountant-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_TOKEN: ${{ secrets.NEXT_ACCOUNTANT_OWNER_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${OWNER_TOKEN:-}" ]; then
            printf '%s' "$OWNER_TOKEN" | wrangler secret put OWNER_TOKEN --config=wrangler.deploy.toml
          else
            echo "NEXT_ACCOUNTANT_OWNER_TOKEN is not set; protected endpoints remain disabled." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${OPENAI_KEY:-}" ]; then
            printf '%s' "$OPENAI_KEY" | wrangler secret put OPENAI_API_KEY --config=wrangler.deploy.toml
          else
            echo "OPENAI_API_KEY is not set for this Worker yet." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify backend
        if: steps.cloudflare.outputs.enabled == 'true'
        run: |
          sleep 8
          curl --fail --retry 8 --retry-delay 4 --max-time 20 https://accounts-api.nextjailbreak.com/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          echo "### Next Accountant Cloudflare backend verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: https://accounts-api.nextjailbreak.com/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1: next-accountant" >> "$GITHUB_STEP_SUMMARY"
          echo "- R2: next-accountant-files / next-accountant-backups" >> "$GITHUB_STEP_SUMMARY"
