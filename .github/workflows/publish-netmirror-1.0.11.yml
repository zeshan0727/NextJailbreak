name: Publish NetMirror 1.0.11 To NS Transfer

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-netmirror-1.0.11.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild TIPA from transfer chunks
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p transfer/files/NetMirror/1.0.11
          cat transfer/builds/NetMirror-1.0.11-chunks/part*.txt | base64 -d > transfer/files/NetMirror/1.0.11/NetMirror-1.0.11-Direct-DeviceEventEmitter-Fix.tipa
          test "$(stat -c%s transfer/files/NetMirror/1.0.11/NetMirror-1.0.11-Direct-DeviceEventEmitter-Fix.tipa)" = "6413174"
          echo "be2e68d5c17b7cc49096709fbd8c085d757db037ffb8519a2f2b35ff01d9f0d0  transfer/files/NetMirror/1.0.11/NetMirror-1.0.11-Direct-DeviceEventEmitter-Fix.tipa" | sha256sum -c -

      - name: Add NetMirror v11 to NS Transfer feed
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          p=Path("transfer/index.json")
          j=json.loads(p.read_text())
          files=[x for x in j.get("files",[]) if x.get("id")!="netmirror-1.0.11-direct-deviceeventemitter-fix"]
          files.insert(0,{
            "id":"netmirror-1.0.11-direct-deviceeventemitter-fix",
            "name":"NetMirror 1.0.11 — Direct Android Network Events",
            "fileName":"NetMirror-1.0.11-Direct-DeviceEventEmitter-Fix.tipa",
            "type":"tipa",
            "platform":"TrollStore / iOS 15.1+",
            "version":"1.0.11",
            "url":"https://nextjailbreak.com/transfer/files/NetMirror/1.0.11/NetMirror-1.0.11-Direct-DeviceEventEmitter-Fix.tipa",
            "sha256":"be2e68d5c17b7cc49096709fbd8c085d757db037ffb8519a2f2b35ff01d9f0d0",
            "sizeBytes":6413174,
            "notes":"Startup-network compatibility build. Native bootstrap transport already returned HTTP 200/311 bytes; this version emits didReceiveNetworkResponse, didReceiveNetworkData, and didCompleteNetworkResponse directly through the React bridge's global RCTDeviceEventEmitter, matching the recovered Android RCTNetworking/XHR contract. It also normalizes response headers and records EMIT response/data/complete diagnostics. StatusBar, ImageLoader, BlobManager/Networking, AndroidProgressBar, brightness compatibility, and Hermes fatal diagnostics remain enabled. Original Hermes bundle is unchanged."
          })
          j["files"]=files
          j["updatedAt"]=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          p.write_text(json.dumps(j,indent=2)+"\n")
          PY

      - name: Commit NS Transfer package
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transfer/files/NetMirror/1.0.11/NetMirror-1.0.11-Direct-DeviceEventEmitter-Fix.tipa transfer/index.json
          if git diff --cached --quiet; then
            echo "No publish changes"
          else
            git commit -m "Publish NetMirror 1.0.11 to NS Transfer [skip ci]"
            git push origin HEAD:main
          fi
