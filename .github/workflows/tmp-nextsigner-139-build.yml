name: Temporary Next Signer 1.3.9 Build

on:
  push:
    paths:
      - '.github/triggers/nextsigner-139-build.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout Next Signer 1.3.9 feature
        uses: actions/checkout@v4
        with:
          ref: feature/nextsigner-1.3.9-manual-sign-flow
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: NextSigner
        run: xcodegen generate
      - name: Build Next Signer 1.3.9
        working-directory: NextSigner
        run: |
          set -euo pipefail
          xcodebuild \
            -project NextSigner.xcodeproj \
            -scheme NextSigner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/NextSignerDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package IPA and TIPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NextSignerDerived/Build/Products/Release-iphoneos/Next Signer.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/pkg/Payload" "$RUNNER_TEMP/out"
          cp -R "$APP" "$RUNNER_TEMP/pkg/Payload/"
          (cd "$RUNNER_TEMP/pkg" && zip -qry "$RUNNER_TEMP/out/NextSigner-1.3.9.ipa" Payload)
          cp "$RUNNER_TEMP/out/NextSigner-1.3.9.ipa" "$RUNNER_TEMP/out/NextSigner-1.3.9.tipa"
          shasum -a 256 "$RUNNER_TEMP/out/NextSigner-1.3.9.ipa" "$RUNNER_TEMP/out/NextSigner-1.3.9.tipa"
          ls -lh "$RUNNER_TEMP/out"
      - name: Upload verified builds
        uses: actions/upload-artifact@v4
        with:
          name: NextSigner-1.3.9-verified
          path: |
            ${{ runner.temp }}/out/NextSigner-1.3.9.ipa
            ${{ runner.temp }}/out/NextSigner-1.3.9.tipa
          if-no-files-found: error
