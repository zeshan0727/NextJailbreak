name: Build Next App IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NextAppApp/**'
      - '!NextAppApp/build-output/**'
      - '.github/workflows/build-nextapp-ipa.yml'

permissions:
  contents: write

concurrency:
  group: build-nextapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate glossy Next App icon
        working-directory: NextAppApp
        run: swift generate_app_icon.swift NextApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        working-directory: NextAppApp
        run: xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: NextAppApp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output
          xcodebuild \
            -project NextApp.xcodeproj \
            -scheme NextApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-output/xcodebuild.log
          echo "SUCCESS - Next App 1.0.1" > build-output/build-status.txt

      - name: Package IPA
        working-directory: NextAppApp
        run: |
          set -euo pipefail
          rm -rf Payload NextApp-1.0.1.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NextApp.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextApp-1.0.1.ipa
          cp NextApp-1.0.1.ipa build-output/NextApp-1.0.1.ipa
          shasum -a 256 build-output/NextApp-1.0.1.ipa > build-output/NextApp-1.0.1.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextApp-1.0.1-IPA
          path: |
            NextAppApp/NextApp-1.0.1.ipa
            NextAppApp/build-output/NextApp-1.0.1.sha256
          if-no-files-found: error

      - name: Publish to NS Transfer safely
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          cp NextAppApp/build-output/NextApp-1.0.1.ipa /tmp/NextApp-1.0.1.ipa
          cp NextAppApp/build-output/NextApp-1.0.1.sha256 /tmp/NextApp-1.0.1.sha256

          for ATTEMPT in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            DEST_DIR='transfer/files/NextApp/1.0.1'
            DEST_FILE='NextApp-1.0.1.ipa'
            mkdir -p "$DEST_DIR"
            cp /tmp/NextApp-1.0.1.ipa "$DEST_DIR/$DEST_FILE"

            SHA256=$(shasum -a 256 "$DEST_DIR/$DEST_FILE" | awk '{print $1}')
            SIZE=$(stat -f%z "$DEST_DIR/$DEST_FILE")
            export SHA256 SIZE

            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          p=Path('transfer/index.json')
          data=json.loads(p.read_text())
          remove_ids={
              'nexttweaks-1.0.0-glossy-live-tweaks',
              'nextapp-1.0.0-live-install-catalog',
              'nextapp-1.0.1-live-install-catalog'
          }
          files=[x for x in data.get('files',[]) if x.get('id') not in remove_ids]

          item={
              'id':'nextapp-1.0.1-live-install-catalog',
              'name':'Next App 1.0.1 — OTA + Performance Fix',
              'fileName':'NextApp-1.0.1.ipa',
              'type':'ipa',
              'platform':'TrollStore / iOS 16+',
              'version':'1.0.1 (2)',
              'url':'https://nextjailbreak.com/transfer/files/NextApp/1.0.1/NextApp-1.0.1.ipa',
              'sha256':os.environ['SHA256'],
              'sizeBytes':int(os.environ['SIZE']),
              'notes':'Fixes the Install button by issuing the same exact itms-services OTA manifest request format used on nextjailbreak.com/install. Also improves scrolling performance by removing expensive per-card blur/material rendering and heavy shadows, disabling unnecessary list animations, and avoiding full-list redraws unless apps.json actually changes.'
          }

          data['files']=[item]+files
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY

            python3 -m json.tool transfer/index.json >/dev/null

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$DEST_DIR/$DEST_FILE" transfer/index.json
            git commit -m "Publish Next App 1.0.1 OTA performance fix" || true

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race on attempt $ATTEMPT; retrying against latest main."
          done

          echo "Unable to publish after 3 attempts."
          exit 1
