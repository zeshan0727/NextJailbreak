name: Aspire Apple Profile Automation Preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aspire-apple-profile-preflight.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ASC_KEY_P8_B64: ${{ secrets.NEXTLEDGER_ASC_KEY_P8_BASE64 }}
      ASC_KEY_ID: ${{ secrets.NEXTLEDGER_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.NEXTLEDGER_ASC_ISSUER_ID }}
    steps:
      - name: Verify whether Apple provisioning API credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_P8_B64" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::notice::No complete App Store Connect API credentials are configured in the repository. An explicit iCloud Ad Hoc provisioning profile must be supplied."
            exit 0
          fi
          python3 -m pip install -q --break-system-packages pyjwt cryptography requests
          python3 - <<'PY'
          import os,base64,time,requests,jwt
          try:
              key=base64.b64decode(os.environ["ASC_KEY_P8_B64"]).decode("utf-8")
              token=jwt.encode({"iss":os.environ["ASC_ISSUER_ID"],"iat":int(time.time()),"exp":int(time.time())+300,"aud":"appstoreconnect-v1"},
                               key,algorithm="ES256",headers={"kid":os.environ["ASC_KEY_ID"],"typ":"JWT"})
              resp=requests.get("https://api.appstoreconnect.apple.com/v1/bundleIds",
                  params={"filter[identifier]":"com.nextsolution.aspire","limit":10},
                  headers={"Authorization":"Bearer "+token},timeout=25)
              print("Apple provisioning API HTTP status:",resp.status_code)
              if resp.ok:
                  arr=resp.json().get("data",[])
                  print("Exact Aspire App ID found:",len(arr)==1)
                  if arr:
                      cap=requests.get(f"https://api.appstoreconnect.apple.com/v1/bundleIds/{arr[0]['id']}/bundleIdCapabilities",
                          headers={"Authorization":"Bearer "+token},timeout=25)
                      print("Capabilities API HTTP status:",cap.status_code)
                      if cap.ok:
                          print("iCloud capability enabled:",any(x.get("attributes",{}).get("capabilityType")=="ICLOUD" for x in cap.json().get("data",[])))
          except Exception as e:
              print("Apple profile API preflight unavailable:",type(e).__name__)
          PY
