name: Test Next Accountant Staging Import API

# PAUSED 2026-10-27: Windows ACCOUNTANTS is the active development path.
# No automatic web deployment/build. Keep for manual resumption only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Setup temporary local D1 and R2
        working-directory: cloudflare/next-accountant-api
        run: |
          set -e
          cat > wrangler.test.toml <<'EOF'
          name = "next-accountant-api-staging-test"
          main = "worker.staging.js"
          compatibility_date = "2026-10-26"
          [vars]
          MIGRATION_ENV = "staging"
          [[d1_databases]]
          binding = "DB"
          database_name = "next-accountant-staging-test"
          database_id = "00000000-0000-0000-0000-000000000001"
          [[r2_buckets]]
          binding = "FILES"
          bucket_name = "next-accountant-staging-test-files"
          EOF
          printf 'OWNER_TOKEN=synthetic-fixture-only\n' > .dev.vars
          wrangler d1 execute next-accountant-staging-test --local --config=wrangler.test.toml --file=schema.sql --yes
          wrangler dev --local --config=wrangler.test.toml --port 8787 > /tmp/next-accountant-test-worker.log 2>&1 &
          echo $! > /tmp/next-accountant-test-worker.pid
          for x in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/next-accountant-test-worker.log
          exit 1
      - name: Validate private web app scripts and draft form syntax
        working-directory: cloudflare/next-accountant-api
        run: |
          node --check worker.staging.js
          node --check web-readonly.js
          node --check voucher-drafts.js
          node --check financial-fingerprint.js
          node --check financial-breakdown.js
          node --check tb-snapshot.js
          node --check report-archive.js
          node --check manager-ledger.js
          node --input-type=module -e "import('./web-view.js').then(({webAsset}) => { new Function(webAsset('/web/app.js').body); new Function(webAsset('/web/drafts.js').body); new Function(webAsset('/web/reports.js').body); if (!webAsset('/web').body.includes('STAGING')) throw Error('Missing staging disclosure'); console.log('PASS: private web frontend scripts compile') })"
      - name: Run synthetic migration contract tests
        working-directory: cloudflare/next-accountant-api
        run: python3 test_staging.py
      - name: Test private staging web sessions and read-only accounting
        working-directory: cloudflare/next-accountant-api
        run: python3 test_web.py
      - name: Worker logs if failed
        if: failure()
        run: cat /tmp/next-accountant-test-worker.log || true
