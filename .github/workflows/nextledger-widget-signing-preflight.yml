name: Next Ledger Build 110 - Verify Apple Provisioning API Access
on:
  push:
    branches: [feature/nextledger-1.3.84-build110-home-screen-widgets]
    paths:
      - ".github/workflows/nextledger-widget-signing-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KEY_ID: ${{ secrets.NEXTLEDGER_ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.NEXTLEDGER_ASC_ISSUER_ID }}
      P8_B64: ${{ secrets.NEXTLEDGER_ASC_KEY_P8_BASE64 }}
      WIDGET_PROFILE_B64: ${{ secrets.NEXTLEDGER_WIDGET_MOBILEPROVISION_BASE64 }}
    steps:
      - name: Check widget profile and App Store Connect API credentials without exposing contents
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$WIDGET_PROFILE_B64" ]]; then
            echo "NEXTLEDGER_WIDGET_MOBILEPROVISION_BASE64: present"
          else
            echo "NEXTLEDGER_WIDGET_MOBILEPROVISION_BASE64: missing"
          fi
          for var in KEY_ID ISSUER_ID P8_B64; do
            if [[ -n "${!var}" ]]; then
              echo "$var: present"
            else
              echo "$var: missing"
            fi
          done
          if [[ -z "$KEY_ID" || -z "$ISSUER_ID" || -z "$P8_B64" ]]; then
            echo "Apple Developer API provisioning cannot run without an existing API integration."
            exit 0
          fi
          python3 -m pip install --quiet PyJWT cryptography
          python3 - <<'PY'
          import base64, datetime, os, urllib.request, urllib.error
          import jwt
          key=base64.b64decode(os.environ['P8_B64'])
          token=jwt.encode(
              {'iss':os.environ['ISSUER_ID'],
               'iat':int(datetime.datetime.now(datetime.timezone.utc).timestamp()),
               'exp':int(datetime.datetime.now(datetime.timezone.utc).timestamp())+600,
               'aud':'appstoreconnect-v1'},
              key, algorithm='ES256',headers={'kid':os.environ['KEY_ID'],'typ':'JWT'})
          url='https://api.appstoreconnect.apple.com/v1/bundleIds?limit=1'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  print('Apple Developer provisioning API GET: HTTP',response.status)
          except urllib.error.HTTPError as error:
              print('Apple Developer provisioning API GET: HTTP',error.code)
              print('Availability:', 'insufficient API permissions' if error.code==403 else 'authorization failed')
          PY
