name: Build Location Spoofer IPA

on:
  push:
    branches:
      - build/location-spoofer-ios16-20261003
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout location-spoofer source
        uses: actions/checkout@v4
        with:
          repository: xweiba/location-spoofer
          ref: v1.0.8
          path: location-spoofer

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        working-directory: location-spoofer
        run: ./build.sh

      - name: Validate IPA
        working-directory: location-spoofer
        run: |
          test -s dist/PaopaoLocationSpoofer-unsigned.ipa
          unzip -l dist/PaopaoLocationSpoofer-unsigned.ipa | grep -E 'Payload/.+\.app/'
          unzip -l dist/PaopaoLocationSpoofer-unsigned.ipa | grep -E 'Payload/.+\.app/Info.plist'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Location-Spoofer-iOS16-unsigned-IPA
          path: location-spoofer/dist/PaopaoLocationSpoofer-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
