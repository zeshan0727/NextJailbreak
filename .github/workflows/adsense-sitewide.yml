name: Ensure Monetag sitewide

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "automation/**/*.py"
      - "automation/site.json"
      - "assets/site-runtime.js"
      - "assets/adsterra.js"
      - ".github/workflows/adsense-sitewide.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monetag-sitewide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ensure-monetag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Monetag on editorial inventory only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          monetag_verification = 'afa6c0ac5c051fa9058f934da7f2c324'
          monetag_meta = f'<meta name="monetag" content="{monetag_verification}">'
          monetag_loader = '  <script defer src="/assets/adsterra.js?v=20260910-1" data-ns-monetag-loader="1"></script>'
          runtime_script = '  <script defer src="/assets/site-runtime.js" data-ns-site-runtime="1"></script>'

          monetag_meta_re = re.compile(r'\s*<meta\s+name=["\']monetag["\']\s+content=["\'][^"\']*["\']\s*/?>\s*', re.I)
          adsense_meta_re = re.compile(r'\s*<meta\s+name=["\']google-adsense-account["\']\s+content=["\'][^"\']*["\']\s*/?>\s*', re.I)
          adsense_script_re = re.compile(r'\s*<script\b[^>]*pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js[^>]*>\s*</script>\s*', re.I | re.S)
          legacy_loader_re = re.compile(r'\s*<script[^>]+src=["\']/assets/adsterra\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*', re.I)
          runtime_re = re.compile(r'\s*<script[^>]+src=["\']/assets/site-runtime\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*', re.I)
          noindex_re = re.compile(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex', re.I)

          blocked_prefixes = (
              'depictions/', 'applications/', 'DailyLedger/', 'DailyTweaks/',
              'Diagnostics/', 'ModuleGlassPreview/', 'NextPDF/', 'NextPost/',
              'license/', 'install/', 'support/', 'payment/', 'request/'
          )
          blocked_exact = {
              'about.html', 'about/index.html', 'contact.html', 'contact/index.html',
              'privacy.html', 'privacy/index.html', 'terms.html', 'terms/index.html',
              'repo.html', 'repo/index.html', 'videos.html', 'videos/index.html',
              'next-ledger-support.html', 'article1.html'
          }

          changed = []
          for path in sorted(Path('.').rglob('*.html')):
              rel = path.as_posix().lstrip('./')
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              updated = monetag_meta_re.sub('\n', text)
              updated = adsense_meta_re.sub('\n', updated)
              updated = adsense_script_re.sub('\n', updated)
              updated = legacy_loader_re.sub('\n', updated)
              updated = runtime_re.sub('\n', updated)

              blocked = rel in blocked_exact or rel.startswith(blocked_prefixes) or bool(noindex_re.search(text))
              if not blocked:
                  updated, count = re.subn(r'(?i)</head\s*>', f'  {monetag_meta}\n</head>', updated, count=1)
                  if not count:
                      raise SystemExit(f'Missing </head> in eligible HTML page: {rel}')
                  scripts = monetag_loader + '\n' + runtime_script
                  updated, body_count = re.subn(r'(?i)</body\s*>', scripts + '\n</body>', updated, count=1)
                  if not body_count:
                      raise SystemExit(f'Missing </body> in eligible HTML page: {rel}')

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(rel)

          for privacy_path in (Path('privacy.html'), Path('privacy/index.html')):
              if not privacy_path.exists():
                  continue
              text = privacy_path.read_text(encoding='utf-8')
              updated = text.replace('Third-party services such as Google AdSense and YouTube may process information according to their own privacy policies.', 'Third-party services such as Monetag and YouTube may process information according to their own privacy policies.')
              updated = updated.replace('Google AdSense and its advertising partners may use cookies, device identifiers, or similar technologies to deliver, measure, and personalize advertisements. They may process information such as device and browser details, approximate location, and interactions with ads according to their own policies.', 'Monetag and its advertising partners may use cookies, device identifiers, or similar technologies to deliver, measure, and personalize advertisements. They may process information such as device and browser details, approximate location, and interactions with ads according to their own policies.')
              if updated != text:
                  privacy_path.write_text(updated, encoding='utf-8')
                  changed.append(privacy_path.as_posix())

          print('Updated files:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Monetag placement is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Restore Monetag on editorial content pages"
          git pull --rebase origin main
          git push
