name: Publish NetMirror 1.0.10 To NS Transfer

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-netmirror-1.0.10.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild TIPA from transfer chunks
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p transfer/files/NetMirror/1.0.10
          cat transfer/builds/NetMirror-1.0.10-chunks/part*.txt | base64 -d > transfer/files/NetMirror/1.0.10/NetMirror-1.0.10-Android-Network-Events-Fix.tipa
          test "$(stat -c%s transfer/files/NetMirror/1.0.10/NetMirror-1.0.10-Android-Network-Events-Fix.tipa)" = "6413911"
          echo "6388988885652e032ceb92679772f41f800c09f77e5fb1bd7bd2033976ca03c8  transfer/files/NetMirror/1.0.10/NetMirror-1.0.10-Android-Network-Events-Fix.tipa" | sha256sum -c -

      - name: Add NetMirror v10 to NS Transfer feed
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          p=Path("transfer/index.json")
          j=json.loads(p.read_text())
          files=[x for x in j.get("files",[]) if x.get("id")!="netmirror-1.0.10-android-network-events-fix"]
          files.insert(0,{
            "id":"netmirror-1.0.10-android-network-events-fix",
            "name":"NetMirror 1.0.10 — Android Network Events Fix",
            "fileName":"NetMirror-1.0.10-Android-Network-Events-Fix.tipa",
            "type":"tipa",
            "platform":"TrollStore / iOS 15.1+",
            "version":"1.0.10",
            "url":"https://nextjailbreak.com/transfer/files/NetMirror/1.0.10/NetMirror-1.0.10-Android-Network-Events-Fix.tipa",
            "sha256":"6388988885652e032ceb92679772f41f800c09f77e5fb1bd7bd2033976ca03c8",
            "sizeBytes":6413911,
            "notes":"Fixes the startup hang after 1.0.9 by making the custom Android-compatible Networking module emit through React Native's global DeviceEventEmitter path even when RCTEventEmitter's own listener count is zero. This allows didReceiveNetworkResponse, didReceiveNetworkData, and didCompleteNetworkResponse to reach the recovered Android XHR/Axios code. Keeps all previous StatusBar, ImageLoader, BlobManager, AndroidProgressBar, brightness, and runtime diagnostic fixes; original Hermes bundle remains unchanged."
          })
          j["files"]=files
          j["updatedAt"]=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          p.write_text(json.dumps(j,indent=2)+"\n")
          PY

      - name: Commit NS Transfer package
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transfer/files/NetMirror/1.0.10/NetMirror-1.0.10-Android-Network-Events-Fix.tipa transfer/index.json
          if git diff --cached --quiet; then
            echo "No publish changes"
          else
            git commit -m "Publish NetMirror 1.0.10 to NS Transfer [skip ci]"
            git push origin HEAD:main
          fi
