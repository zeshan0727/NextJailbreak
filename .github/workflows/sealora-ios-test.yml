name: Sealora 1.0.10 publisher AdMob and UMP consent build
on:
  push:
    branches: [sealora-ios-test]
    paths:
      - '.github/workflows/sealora-ios-test.yml'
      - 'SealoraBuild/READY'
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract Sealora Xcode sources
        run: |
          mkdir -p "$RUNNER_TEMP/SealoraProject"
          python3 - <<'PY'
          import base64, pathlib, lzma, tarfile, io, hashlib, os
          paths=sorted(pathlib.Path('SealoraBuild/parts').glob('part*.b64'))
          if len(paths)!=8: raise SystemExit(f'Expected 8 source pieces; found {len(paths)}')
          encoded=''.join(p.read_text().strip() for p in paths)
          body=base64.b64decode(encoded,validate=True)
          digest=hashlib.sha256(body).hexdigest()
          expected='2a51eca73bce2673240555762b69fae87eedf84fffc32d50462ee573973a85c3'
          if digest!=expected: raise SystemExit('Source archive checksum mismatch: '+digest)
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(body)), mode='r:') as archive:
              archive.extractall(pathlib.Path(os.environ['RUNNER_TEMP'])/'SealoraProject')
          PY
      - name: Apply Sealora 1.0.1 Files import repair
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, re, subprocess
          encoded = pathlib.Path('SealoraBuild/patch101.b64').read_text().strip()
          archive = base64.b64decode(encoded, validate=True)
          expected = 'd37de2d17ed7047947c4a148eff1b0f6e61f9bd76f838259598398f3810dec1e'
          if hashlib.sha256(archive).hexdigest() != expected:
              raise SystemExit('Hotfix checksum mismatch')
          patch = lzma.decompress(archive)
          # The compact CI source archive deliberately omits README and project.yml.
          chunks = re.split(rb'(?=^--- a/)', patch, flags=re.MULTILINE)
          patch = b''.join(c for c in chunks if not c.startswith((b'--- a/README.md', b'--- a/project.yml')))
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'SealoraProject'
          result = subprocess.run(['patch','-t','-p1'], input=patch,
                                  cwd=root, capture_output=True)
          print(result.stdout.decode())
          if result.returncode:
              raise SystemExit(result.stderr.decode())
          # The compact bootstrap includes a fixed Xcode project: embed the new
          # document picker inside an already registered Swift source file.
          helper = root/'Sealora/Core/FilesImportPicker.swift'
          app = root/'Sealora/Features/AppsView.swift'
          old = app.read_text().replace('import SwiftUI\nimport UniformTypeIdentifiers\n', '', 1)
          app.write_text(helper.read_text() + '\n' + old)
          helper.unlink()
          PY
      - name: Fix numeric app bundle identifiers and profile warning (1.0.2)
        run: |
          python3 .github/scripts/sealora-102-bundleid-fix.py "$RUNNER_TEMP/SealoraProject"
          cd "$RUNNER_TEMP/SealoraProject"
          grep -F 'XCTAssertTrue(BundleIDs.isValid("com.nextsolution.3105"))' Tests/SealoraTests.swift
          grep -F 'private var validationMessage: String?' Sealora/Features/SigningSheet.swift
          grep -F '<string>1.0.2</string>' Sealora/Info.plist
      - name: Add Sealora 1.0.3 studio credits, first-launch website, and UDID profile flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,lzma,tarfile,os
          base=Path(os.environ['RUNNER_TEMP'])/'SealoraProject'
          encoded=Path('SealoraBuild/patch103.b64').read_text().strip()
          compressed=base64.b64decode(encoded,validate=True)
          expected='ccad08724c1f431eaf2964e5b9205bd257ecec417dad13a05b1288617ec3335a'
          assert hashlib.sha256(compressed).hexdigest()==expected,'Sealora patch 1.0.3 checksum mismatch'
          archive=tarfile.open(fileobj=io.BytesIO(lzma.decompress(compressed)),mode='r:')
          safe={'Sealora/Features/SettingsView.swift','Sealora/SealoraApp.swift','Sealora/Info.plist','project.yml'}
          assert set(archive.getnames())==safe, 'Unexpected files in Sealora update'
          for member in archive:
              destination=base/member.name
              destination.write_bytes(archive.extractfile(member).read())
          import plistlib
          info=plistlib.loads((base/'Sealora/Info.plist').read_bytes())
          assert info['CFBundleShortVersionString']=='1.0.3'
          assert info['CFBundleVersion']=='4'
          assert any('sealora' in v.get('CFBundleURLSchemes',[]) for v in info['CFBundleURLTypes'])
          print('Applied verified Sealora 1.0.3 source update')
          PY
          swiftc -frontend -parse "$RUNNER_TEMP/SealoraProject/Sealora/SealoraApp.swift" "$RUNNER_TEMP/SealoraProject/Sealora/Features/SettingsView.swift"
      - name: Remove UDID section and signing requirement (Sealora 1.0.4, source compatibility fix)
        run: |
          python3 .github/scripts/sealora-104-remove-udid.py "$RUNNER_TEMP/SealoraProject"
          cd "$RUNNER_TEMP/SealoraProject"
          swiftc -frontend -parse $(find Sealora Tests -name '*.swift' -type f)
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p=plistlib.loads(Path('Sealora/Info.plist').read_bytes())
          assert p['CFBundleShortVersionString']=='1.0.4'
          assert p['CFBundleVersion']=='5'
          assert not p.get('CFBundleURLTypes')
          source='\n'.join(q.read_text() for q in Path('Sealora').rglob('*.swift'))
          assert 'UDIDEnrollment' not in source
          assert 'Registered test device' not in source
          assert 'deviceUDID' not in source
          assert 'SigningService.perform(choice)' in source
          assert 'profile.containsDeveloperCertificate(for: identity)' in source
          print('Sealora 1.0.4 checks OK')
          PY
      - name: Fix full bundle signature verification and preserve diagnostics (Sealora 1.0.6)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,os,plistlib,subprocess
          src=Path('SealoraBuild/patch105.b64').read_text().strip()
          compressed=base64.b64decode(src,validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '3bf622787d130f82aa3a9f4c9f015ddca1279ec98a6799e60b203336094d355b', 'Signing verifier patch integrity mismatch'
          patchText=lzma.decompress(compressed).decode()
          tailStart=patchText.index('@@ -143,3 +167,93 @@')
          testStart=patchText.index('--- a/Tests/SealoraTests.swift',tailStart)
          extra=patchText[tailStart:testStart]
          suffix=''.join(line[1:]+'\n' for line in extra.splitlines() if line.startswith('+') and not line.startswith('+++'))
          root=Path(os.environ['RUNNER_TEMP'])/'SealoraProject'
          # The compact CI bootstrap is not byte-identical to the distributed
          # Xcode ZIP. Replace the function by its declaration, not its line number.
          start=patchText.index('@@ -115,27 +116,50 @@')
          body=patchText[start:tailStart].splitlines()[1:]
          result=''.join(line[1:]+'\n' for line in body if line.startswith((' ','+')) and not line.startswith('+++'))
          newFunc=result[result.index('    static func verifyOutput('):result.index('\n}\n\nprivate enum UIImageData')]
          target=root/'Sealora/Core/ArchiveInspector.swift'
          current=target.read_text()
          oldStart=current.index('    static func verifyOutput(')
          oldEnd=current.index('\n}\n\nprivate enum UIImageData',oldStart)
          assert current.count('    static func verifyOutput(')==1
          current=current[:oldStart]+newFunc+current[oldEnd:]
          assert current.count('import CryptoKit')==0
          current=current.replace('import Foundation\n','import Foundation\nimport CryptoKit\n',1)
          target.write_text(current+suffix)
          # Apply unit-test fixture checks as a standalone patch.
          proc=subprocess.run(['patch','-t','-p1'],cwd=root,
                              input=patchText[testStart:].encode(),capture_output=True)
          print(proc.stdout.decode())
          if proc.returncode:
              raise SystemExit(proc.stderr.decode())
          info=root/'Sealora/Info.plist'
          config=plistlib.loads(info.read_bytes())
          assert config['CFBundleShortVersionString']=='1.0.4',config
          assert str(config['CFBundleVersion'])=='5',config
          config['CFBundleShortVersionString']='1.0.6'
          config['CFBundleVersion']='7'
          info.write_bytes(plistlib.dumps(config,fmt=plistlib.FMT_XML,sort_keys=False))
          project=root/'project.yml'
          if project.exists():
              content=project.read_text()
              content=content.replace('CFBundleShortVersionString: 1.0.4','CFBundleShortVersionString: 1.0.6')
              content=content.replace('CFBundleVersion: "5"','CFBundleVersion: "7"')
              project.write_text(content)
          sources=(root/'Sealora/Core/ArchiveInspector.swift').read_text()
          assert 'SignatureSpecialSlotValidator.verify(' in sources
          assert 'verifyCodeResourcesRecursively(forBundleAt: app)' in sources
          assert 'check.codeDirectories.allSatisfy' in sources
          assert 'infoPlist: infoData' in sources and 'codeResources: resourcesData' in sources
          app=root/'Sealora/SealoraApp.swift'
          view=app.read_text()
          old='            Button("OK", role: .cancel) { library.alertText = nil }'
          new='            Button("Copy Details") {\n                UIPasteboard.general.string = library.alertText\n                library.alertText = nil\n            }\n' + old
          assert view.count(old)==2, 'Expected two signing error alert presentations'
          app.write_text(view.replace(old,new))
          assert config['CFBundleShortVersionString']=='1.0.6'
          assert config['CFBundleVersion']=='7'
          print('Sealora 1.0.6: all external and embedded signature slots checked and Copy Details retained')
          PY
          cd "$RUNNER_TEMP/SealoraProject"
          swiftc -frontend -parse Sealora/Core/ArchiveInspector.swift Tests/SealoraTests.swift
      - name: Add signing completed screen and iOS installer handoff (Sealora 1.0.7)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,io,lzma,base64,hashlib,tarfile,plistlib
          root=Path(os.environ['RUNNER_TEMP'])/'SealoraProject'
          src=Path('SealoraBuild/patch107.b64')
          compressed=base64.b64decode(src.read_text().strip(),validate=True)
          expected='a47f44a3da229dfae348b8d101f5bfb15114f5e61ab3d1232d24e5ecbe700348'
          assert hashlib.sha256(compressed).hexdigest()==expected,'Unexpected 1.0.7 patch checksum'
          payload=lzma.decompress(compressed)
          allowed={
              'Sealora/Core/LibraryStore.swift','Sealora/SealoraApp.swift',
              'Sealora/Features/SignedView.swift','Sealora/Info.plist','project.yml'
          }
          with tarfile.open(fileobj=io.BytesIO(payload),mode='r:') as t:
              assert set(t.getnames())==allowed, 'Unexpected patch archive paths'
              for m in t:
                  assert m.isfile() and not m.issym(), 'Unexpected archive item'
                  target=root/m.name
                  assert target.exists(), 'Source missing: '+m.name
                  target.write_bytes(t.extractfile(m).read())
          info=plistlib.loads((root/'Sealora/Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] in ('$(PRODUCT_BUNDLE_IDENTIFIER)', 'com.nextsolution.sealora')
          assert info['CFBundleShortVersionString']=='1.0.7'
          assert info['CFBundleVersion']=='8'
          app=(root/'Sealora/SealoraApp.swift').read_text()
          store=(root/'Sealora/Core/LibraryStore.swift').read_text()
          view=(root/'Sealora/Features/SignedView.swift').read_text()
          assert '.sheet(item: $library.completedSigning, onDismiss: { selection = 1 })' in app
          assert 'completedSigning = signed' in store and 'try save()' in store
          assert 'IPAInstallerShareSheet(fileURL: library.signedURL(item))' in view
          assert 'Text("Signing Complete")' in view
          assert 'Button("Cancel") { onFinish() }' in view
          assert 'Label("Install", systemImage:' in view
          print('1.0.7 success, saved output and installer handoff source verification passed')
          PY
          cd "$RUNNER_TEMP/SealoraProject"
          swiftc -frontend -parse Sealora/SealoraApp.swift Sealora/Features/SignedView.swift Sealora/Core/LibraryStore.swift
      - name: Integrate native OTA install flow (Sealora 1.0.8)
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, lzma, os, plistlib, tarfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'SealoraProject'
          raw=base64.b64decode(''.join(Path('SealoraBuild/patch108.b64').read_text().splitlines()),validate=True)
          expected='e6d0c2d92df2e05732543932deb2b20887f77883d4648369f405d11b499f1abe'
          assert hashlib.sha256(raw).hexdigest()==expected, 'Sealora OTA source archive checksum mismatch'
          allowed={
              'Sealora/Core/DirectInstallCoordinator.swift',
              'Sealora/Core/DirectInstallServer.swift',
              'Sealora/Features/SignedView.swift',
              'Sealora/Info.plist',
              'project.yml',
          }
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(raw)),mode='r:') as archive:
              assert set(archive.getnames())==allowed, 'Unexpected install source files'
              for member in archive:
                  assert member.isfile() and not member.issym(), 'Non-file OTA patch'
                  destination=root/member.name
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  destination.write_bytes(archive.extractfile(member).read())
          info=plistlib.loads((root/'Sealora/Info.plist').read_bytes())
          assert info['CFBundleShortVersionString']=='1.0.8' and info['CFBundleVersion']=='9'
          assert 'audio' in info['UIBackgroundModes'], 'Local install transfer would suspend'
          view=(root/'Sealora/Features/SignedView.swift').read_text()
          assert 'installer.begin(item: item, url: library.signedURL(item))' in view
          assert 'IPAInstallerShareSheet' not in view, 'Install is still a share action'
          assert 'DirectInstallStatusView' in view
          coordinator=(root/'Sealora/Core/DirectInstallCoordinator.swift').read_text()
          assert 'https://ipa.s0n1c.ca/genPlist' in coordinator
          assert 'https://api.palera.in/genPlist' in coordinator
          assert 'validManifest(data, matching:' in coordinator
          assert 'self.phase = .delivered' in coordinator
          server=(root/'Sealora/Core/DirectInstallServer.swift').read_text()
          assert '127.0.0.1' in server and 'Accept-Ranges: bytes' in server
          print('Sealora 1.0.8 direct install source and privacy checks passed')
          PY
          cd "$RUNNER_TEMP/SealoraProject"
          # The CI bootstrap is a reduced, pre-generated Xcode project and
          # intentionally excludes generate_xcodeproj.py. Embed the two new
          # independent source units in an existing registered Swift file.
          python3 - <<'PY'
          from pathlib import Path
          import re
          folder=Path('Sealora')
          target=folder/'Features/SignedView.swift'
          inputs=[
              folder/'Core/DirectInstallServer.swift',
              folder/'Core/DirectInstallCoordinator.swift',
              target,
          ]
          chunks=[]
          for path in inputs:
              body=path.read_text()
              body=re.sub(r'^import (Foundation|UIKit|SwiftUI|UniformTypeIdentifiers|AVFoundation|Darwin)\n','',body,flags=re.MULTILINE)
              chunks.append(body)
          header='import Foundation\nimport UIKit\nimport SwiftUI\nimport AVFoundation\nimport Darwin\nimport UniformTypeIdentifiers\n'
          target.write_text(header+'\n'.join(chunks))
          for path in inputs[:2]: path.unlink()
          assert 'final class DirectInstallServer' in target.read_text()
          assert 'final class DirectInstallCoordinator' in target.read_text()
          print('Compiled original OTA sources into the registered Swift target')
          PY
          swiftc -frontend -parse $(find Sealora Tests -name '*.swift' -type f)
      - name: Add anchored test banner ads and regenerate Xcode project (Sealora 1.0.9)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,tarfile,lzma,io,os,plistlib
          root=Path(os.environ['RUNNER_TEMP'])/'SealoraProject'
          raw=base64.b64decode(Path('SealoraBuild/patch109.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(raw).hexdigest() == '7ab645c44bf16f112ba0d9eac61666b633873c594ce810db5b03116ebb5c61d4'
          expected={
            'Sealora/SealoraApp.swift',
            'Sealora/Features/SettingsView.swift',
            'Sealora/Features/BannerAdsView.swift',
            'Sealora/Info.plist',
            'project.yml',
            'scripts/generate_xcodeproj.py',
          }
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(raw)),mode='r:') as t:
              assert set(t.getnames())==expected, 'Invalid patch file manifest'
              for member in t:
                  assert member.isfile() and not member.issym()
                  f=root/member.name
                  f.parent.mkdir(parents=True,exist_ok=True)
                  f.write_bytes(t.extractfile(member).read())
          info=plistlib.loads((root/'Sealora/Info.plist').read_bytes())
          assert info['CFBundleShortVersionString']=='1.0.9'
          assert str(info['CFBundleVersion'])=='10'
          assert info['GADApplicationIdentifier']=='ca-app-pub-3940256099942544~1458002511'
          banner=(root/'Sealora/Features/BannerAdsView.swift').read_text()
          assert 'ca-app-pub-3940256099942544/2435281174' in banner
          assert 'GoogleMobileAds' in banner and 'BannerView(adSize: AdSizeBanner)' in banner
          assert 'SealoraBannerInset' in (root/'Sealora/SealoraApp.swift').read_text()
          assert 'DirectInstallCoordinator' in (root/'Sealora/Features/SignedView.swift').read_text()
          print('Sealora 1.0.9 source overlay verified')
          PY
          cd "$RUNNER_TEMP/SealoraProject"
          # The CI bootstrap flattened the 1.0.8 installer sources into SignedView.
          # Regenerating from current files avoids stale build references.
          python3 scripts/generate_xcodeproj.py
          grep -q 'GoogleMobileAds in Frameworks' Sealora.xcodeproj/project.pbxproj
          grep -q 'BannerAdsView.swift in Sources' Sealora.xcodeproj/project.pbxproj
          swiftc -frontend -parse $(find Sealora Tests -name '*.swift' -type f)
      - name: Configure Sealora publisher AdMob and privacy consent (1.0.10)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,tarfile,lzma,io,os,plistlib
          root=Path(os.environ['RUNNER_TEMP'])/'SealoraProject'
          raw=base64.b64decode(Path('SealoraBuild/patch110.b64').read_text().strip(),validate=True)
          expected='c8ffdb2f8c48d9d71ca3e9575a0ceda9e3c4dc58b49e307ff58ba22f2f0c994d'
          assert hashlib.sha256(raw).hexdigest()==expected, 'Unexpected 1.0.10 source overlay digest'
          allowed={'Sealora/SealoraApp.swift','Sealora/Features/BannerAdsView.swift',
                   'Sealora/Features/SettingsView.swift','Sealora/Info.plist','project.yml'}
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(raw)),mode='r:') as t:
              assert set(t.getnames())==allowed, 'Unexpected AdMob overlay files'
              for m in t:
                  assert m.isfile() and not m.issym()
                  target=root/m.name
                  assert target.exists(), 'Base file missing: '+m.name
                  target.write_bytes(t.extractfile(m).read())
          info=plistlib.loads((root/'Sealora/Info.plist').read_bytes())
          assert info['GADApplicationIdentifier']=='ca-app-pub-4770123899731214~1230048425'
          assert info['CFBundleShortVersionString']=='1.0.10' and info['CFBundleVersion']=='11'
          banner=(root/'Sealora/Features/BannerAdsView.swift').read_text()
          assert 'ca-app-pub-4770123899731214/5001772479' in banner
          assert 'ConsentInformation.shared.canRequestAds' in banner
          assert 'UserMessagingPlatform' in banner
          assert 'ca-app-pub-3940256099942544/2435281174' in banner
          project=(root/'project.yml').read_text()
          assert 'GoogleUserMessagingPlatform' in project
          print('Verified 1.0.10 publisher IDs, test ad safety and UMP consent gate')
          PY
          cd "$RUNNER_TEMP/SealoraProject"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/generate_xcodeproj.py')
          s=p.read_text()
          products="['RorkSign','ZIPFoundation','GoogleMobileAds']"
          assert s.count(products)==3, 'Unexpected Xcode package lists'
          s=s.replace(products,"['RorkSign','ZIPFoundation','GoogleMobileAds','GoogleUserMessagingPlatform']")
          existing="('https://github.com/googleads/swift-package-manager-google-mobile-ads.git','13.0.0','GoogleMobileAds')]:"
          assert s.count(existing)==1, 'Google package reference not found'
          s=s.replace(existing,
            "('https://github.com/googleads/swift-package-manager-google-mobile-ads.git','13.0.0','GoogleMobileAds'),\n"
            "    ('https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git','3.1.0','GoogleUserMessagingPlatform')]:")
          old_ref='ref("XCRemoteSwiftPackageReference:GoogleMobileAds","GoogleMobileAds")}, );'
          new_ref='ref("XCRemoteSwiftPackageReference:GoogleMobileAds","GoogleMobileAds")}, {ref("XCRemoteSwiftPackageReference:GoogleUserMessagingPlatform","GoogleUserMessagingPlatform")}, );'
          assert s.count(old_ref)==1, 'Xcode packageReferences not found'
          s=s.replace(old_ref,new_ref)
          p.write_text(s)
          project=Path('project.yml')
          content=project.read_text()
          assert 'product: UserMessagingPlatform' in content
          project.write_text(content.replace('product: UserMessagingPlatform','product: GoogleUserMessagingPlatform'))
          PY
          python3 scripts/generate_xcodeproj.py
          grep -q 'GoogleUserMessagingPlatform in Frameworks' Sealora.xcodeproj/project.pbxproj
          swiftc -frontend -parse $(find Sealora Tests -name '*.swift' -type f)
      - name: Generate branded app icon
        run: |
          cd "$RUNNER_TEMP/SealoraProject"
          python3 scripts/generate_build_icon.py
      - name: Compile actual iOS app (device Release)
        run: |
          cd "$RUNNER_TEMP/SealoraProject"
          bash scripts/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Sealora-1.0.10-unsigned-IPA
          path: ${{ runner.temp }}/SealoraProject/dist/Sealora-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
