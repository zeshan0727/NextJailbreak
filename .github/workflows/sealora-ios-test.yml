name: Sealora iOS unsigned test build
on:
  push:
    branches: [sealora-ios-test]
    paths:
      - '.github/workflows/sealora-ios-test.yml'
      - 'SealoraBuild/READY'
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract Sealora Xcode sources
        run: |
          mkdir -p "$RUNNER_TEMP/SealoraProject"
          python3 - <<'PY'
          import base64, pathlib, lzma, tarfile, io, hashlib, os
          paths=sorted(pathlib.Path('SealoraBuild/parts').glob('part*.b64'))
          if len(paths)!=8: raise SystemExit(f'Expected 8 source pieces; found {len(paths)}')
          encoded=''.join(p.read_text().strip() for p in paths)
          body=base64.b64decode(encoded,validate=True)
          digest=hashlib.sha256(body).hexdigest()
          expected='2a51eca73bce2673240555762b69fae87eedf84fffc32d50462ee573973a85c3'
          if digest!=expected: raise SystemExit('Source archive checksum mismatch: '+digest)
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(body)), mode='r:') as archive:
              archive.extractall(pathlib.Path(os.environ['RUNNER_TEMP'])/'SealoraProject')
          PY
      - name: Generate branded app icon
        run: |
          cd "$RUNNER_TEMP/SealoraProject"
          python3 scripts/generate_build_icon.py
      - name: Compile actual iOS app (device Release)
        run: |
          cd "$RUNNER_TEMP/SealoraProject"
          bash scripts/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Sealora-unsigned-test-IPA
          path: ${{ runner.temp }}/SealoraProject/dist/Sealora-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
