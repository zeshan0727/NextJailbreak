name: Notify Island 1.0.18 public promotion
on:
  push:
    branches: [agent/notify-island-1.0.5-candidate]
    paths:
      - 'source/NotifyIsland105Candidate/**'
      - '.github/workflows/notify-island-105-candidate.yml'
permissions:
  contents: write
concurrency:
  group: notify-island-105
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y dpkg zstd
      - name: Promote approved device-tested package
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:transfer/files/NotifyIsland/1.0.18/NotifyIsland_1.0.18_CompactSwipe_RootHide.deb > "$RUNNER_TEMP/approved.deb"
          git show origin/main:icons/notify-island.png > "$RUNNER_TEMP/icon.png"
          python3 source/NotifyIsland105Candidate/promote-public.py "$RUNNER_TEMP/approved.deb" "$RUNNER_TEMP/icon.png" build-release
      - name: Publish public Sileo repository and website
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE/source/NotifyIsland105Candidate"
          for attempt in 1 2 3; do
            git fetch origin main
            W="$RUNNER_TEMP/ni-public-$attempt"
            git worktree add --detach "$W" origin/main
            python3 "$SOURCE/publish-public.py" "$W" "$GITHUB_WORKSPACE/build-release" "$SOURCE"
            git -C "$W" config user.name "Next Jailbreak Build Bot"
            git -C "$W" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$W" add debfiles/NotifyIsland_1.0.18_RootHide.deb Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release icons/notify-island.png depictions/notify-island.html depictions/notify-island.json repo/index.html
            if git -C "$W" diff --cached --quiet; then exit 0; fi
            git -C "$W" commit -m "Publish user-approved Notify Island 1.0.18 public release"
            if git -C "$W" push origin HEAD:main; then exit 0; fi
          done
          exit 1
