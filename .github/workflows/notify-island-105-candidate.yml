name: Notify Island 1.0.12 Full Cover Plus build
on:
  push:
    branches: [agent/notify-island-1.0.5-candidate]
    paths:
      - 'source/NotifyIsland105Candidate/**'
      - '.github/workflows/notify-island-105-candidate.yml'
permissions:
  contents: write
concurrency:
  group: notify-island-105
  cancel-in-progress: true
jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install dpkg ldid xz
      - name: Prepare and lint sources
        run: |
          set -euo pipefail
          P=source/NotifyIsland105Candidate
          python3 "$P/compile-fix.py"
          python3 "$P/layout-date.py"
          python3 "$P/prepare-v450.py"
          python3 "$P/prepare-v105.py"
          python3 "$P/prepare-v106.py"
          python3 "$P/prepare-v107.py"
          python3 "$P/prepare-v108.py"
          python3 "$P/prepare-v109.py"
          python3 "$P/prepare-v110.py"
          python3 "$P/prepare-v111.py"
          python3 "$P/prepare-v112.py"
          python3 -m py_compile "$P/package-test.py" "$P/publish-test.py"
          for f in "$P"/prefs/Resources/*.plist "$P"/NextAuraNotificationIsland.plist; do plutil -lint "$f"; done
          grep -q '1.0.12 Full Cover Plus loaded' "$P/NotificationIsland.xm"
      - name: Compile RootHide candidate with iOS 16.5 Preferences SDK
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/source/NotifyIsland105Candidate"
          git init "$RUNNER_TEMP/theos-rh"
          git -C "$RUNNER_TEMP/theos-rh" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-rh" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" submodule update --init --recursive --depth 1
          export THEOS="$RUNNER_TEMP/theos-rh" THEOS_PACKAGE_SCHEME=roothide
          mkdir -p build-candidate "$THEOS/sdks"
          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"
          if ! test -f "$SDK/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd"; then
            curl -fL --retry 3 https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o "$RUNNER_TEMP/ni-sdk.tar.xz"
            tar -xJf "$RUNNER_TEMP/ni-sdk.tar.xz" -C "$THEOS/sdks"
          fi
          test -f "$SDK/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd"
          make -C "$P" clean all FINALPACKAGE=1 2>&1 | tee build-candidate/runtime.log
          D="$(find "$P/.theos/obj" -type f -name NextAuraNotificationIsland.dylib -print | while IFS= read -r f; do if lipo -archs "$f" | grep -qw arm64e && lipo -archs "$f" | grep -qw arm64; then echo "$f"; fi; done | head -1)"
          test -n "$D"
          cp "$D" build-candidate/NextAuraNotificationIsland.dylib
          make -C "$P/prefs" clean all FINALPACKAGE=1 2>&1 | tee build-candidate/preferences.log
          D="$(find "$P/prefs/.theos/obj" -type f -name NotifyIslandPrefs -print | while IFS= read -r f; do if lipo -archs "$f" | grep -qw arm64e && lipo -archs "$f" | grep -qw arm64; then echo "$f"; fi; done | head -1)"
          test -n "$D"
          cp "$D" build-candidate/NotifyIslandPrefs
          cp "$P/NotificationIsland.xm" build-candidate/
          cp -R "$P/prefs/Resources" build-candidate/
      - name: Assemble and verify isolated RootHide DEB
        run: |
          set -euo pipefail
          python3 source/NotifyIsland105Candidate/package-test.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build-candidate" "$RUNNER_TEMP"
          cat build-candidate/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NotifyIsland-112-FullCoverPlus-RootHide
          path: build-candidate/
      - name: Publish verified device-test build to NS Transfer
        run: |
          set -euo pipefail
          DEB="$GITHUB_WORKSPACE/build-candidate/NotifyIsland_1.0.12_FullCoverPlus_RootHide.deb"
          test -s "$DEB"
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/ni-transfer" origin/main
          python3 "$GITHUB_WORKSPACE/source/NotifyIsland105Candidate/publish-test.py" "$RUNNER_TEMP/ni-transfer" "$DEB"
          cd "$RUNNER_TEMP/ni-transfer"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json transfer/files/NotifyIsland/1.0.12/NotifyIsland_1.0.12_FullCoverPlus_RootHide.deb
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Notify Island 1.0.12 Full Cover Plus RootHide to NS Transfer'
          git push origin HEAD:main
