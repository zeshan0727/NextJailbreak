name: Temporary Publish Next Signer 1.4.1 to Transfer

on:
  push:
    branches:
      - feature/nextsigner-1.4.0-local-signed-apps
    paths:
      - 'NextSigner/publish-trigger-141.txt'

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-nextsigner-transfer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: '1.4.1'
      ARTIFACT_ID: '10317240296'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main for Transfer metadata
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified Next Signer artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/nextsigner-artifact.zip"
          mkdir -p "$RUNNER_TEMP/nextsigner-artifact"
          unzip -q "$RUNNER_TEMP/nextsigner-artifact.zip" -d "$RUNNER_TEMP/nextsigner-artifact"
          TIPA="$(find "$RUNNER_TEMP/nextsigner-artifact" -type f -name "NextSigner-${VERSION}.tipa" | head -n1)"
          IPA="$(find "$RUNNER_TEMP/nextsigner-artifact" -type f -name "NextSigner-${VERSION}.ipa" | head -n1)"
          test -n "$TIPA" && test -s "$TIPA" || { echo "NextSigner-${VERSION}.tipa not found"; exit 1; }
          test -n "$IPA" && test -s "$IPA" || { echo "NextSigner-${VERSION}.ipa not found"; exit 1; }
          cp "$TIPA" "$RUNNER_TEMP/NextSigner-${VERSION}.tipa"
          cp "$IPA" "$RUNNER_TEMP/NextSigner-${VERSION}.ipa"
          unzip -t "$RUNNER_TEMP/NextSigner-${VERSION}.tipa" >/dev/null
          unzip -t "$RUNNER_TEMP/NextSigner-${VERSION}.ipa" >/dev/null
          SHA256=$(sha256sum "$RUNNER_TEMP/NextSigner-${VERSION}.tipa" | awk '{print $1}')
          SIZE_BYTES=$(stat -c '%s' "$RUNNER_TEMP/NextSigner-${VERSION}.tipa")
          echo "NEXTSIGNER_SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "NEXTSIGNER_SIZE_BYTES=$SIZE_BYTES" >> "$GITHUB_ENV"

      - name: Publish GitHub release fallback
        shell: bash
        run: |
          set -euo pipefail
          TAG="nextsigner-${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$RUNNER_TEMP/NextSigner-${VERSION}.tipa" \
              "$RUNNER_TEMP/NextSigner-${VERSION}.ipa" \
              --clobber
          else
            gh release create "$TAG" \
              "$RUNNER_TEMP/NextSigner-${VERSION}.tipa" \
              "$RUNNER_TEMP/NextSigner-${VERSION}.ipa" \
              --target feature/nextsigner-1.4.0-local-signed-apps \
              --title "Next Signer ${VERSION}" \
              --notes "Fixes Signed Apps save failure after successful local signing."
          fi
          PUBLIC_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/NextSigner-${VERSION}.tipa"
          curl --fail --silent --show-error --location --head --retry 5 --retry-delay 2 "$PUBLIC_URL" >/dev/null
          echo "NEXTSIGNER_PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"

      - name: Update Transfer manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          version = os.environ['VERSION']
          index_path = Path('transfer/index.json')
          data = json.loads(index_path.read_text())
          files = [item for item in data.get('files', []) if not str(item.get('id', '')).startswith('nextsigner-')]
          entry = {
              'id': f'nextsigner-{version}',
              'name': f'Next Signer {version}',
              'fileName': f'NextSigner-{version}.tipa',
              'type': 'tipa',
              'platform': 'TrollStore / iOS 16+',
              'version': version,
              'url': os.environ['NEXTSIGNER_PUBLIC_URL'],
              'sha256': os.environ['NEXTSIGNER_SHA256'],
              'sizeBytes': int(os.environ['NEXTSIGNER_SIZE_BYTES']),
              'storage': 'GitHub Release fallback',
              'notes': 'Fixes Signed Apps save failure after successful local signing. Keeps on-device signing, Signed Apps, Install, Publish, Share and Delete.'
          }
          data['files'] = [entry] + files
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          index_path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          python3 -m json.tool transfer/index.json >/dev/null

      - name: Commit Transfer metadata to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json
          if git diff --cached --quiet; then
            echo 'No Transfer metadata changes to commit'
          else
            git commit -m "Publish Next Signer ${VERSION} to NS Transfer"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
