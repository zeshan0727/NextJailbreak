name: Generate clean website URLs

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '**/index.html'
      - 'feed.xml'
      - 'sitemap.xml'
      - 'automation/clean_urls.py'
      - 'automation/optimize_social_card.py'
      - 'assets/brand/next-jailbreak-social-card.png'
      - 'automation/legacy_route_policy.py'
      - '.github/workflows/generate-clean-urls.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: generate-clean-website-urls
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate one indexable clean route per page
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 automation/optimize_social_card.py
          python3 -m automation.legacy_route_policy prepare --repository-root .
          python3 automation/clean_urls.py
          python3 -m automation.legacy_route_policy finalize --repository-root .

      - name: Commit generated routes
        id: commit
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Clean URLs are already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Generate clean public website URLs"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages from generated routes
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages/builds"
