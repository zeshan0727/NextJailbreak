name: Deploy Sealora One-Time UDID Service
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-sealora-udid.yml'
      - 'cloudflare/sealora-udid/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sealora-udid
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Cloudflare deployment access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
      - name: Install Worker dependencies and Wrangler
        working-directory: cloudflare/sealora-udid
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund wrangler@latest
          node --check worker.js
      - name: Resolve temporary session storage
        working-directory: cloudflare/sealora-udid
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler kv namespace list > "$RUNNER_TEMP/sealora-kv-list.json"
          ID="$(python3 - <<'PY'
          import json,os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/sealora-kv-list.json'))
          for ns in data:
              if ns.get('title') in ('sealora-udid-SESSIONS','sealora-udid-sessions'):
                  print(ns['id'])
                  break
          PY
          )"
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create SESSIONS
            npx wrangler kv namespace list > "$RUNNER_TEMP/sealora-kv-list.json"
            ID="$(python3 - <<'PY'
          import json,os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/sealora-kv-list.json'))
          for ns in data:
              if ns.get('title') in ('sealora-udid-SESSIONS','sealora-udid-sessions'):
                  print(ns['id'])
                  break
          PY
            )"
          fi
          test -n "$ID" || { echo "::error::Unable to locate KV namespace"; exit 1; }
          cat > wrangler.deploy.toml <<EOT
          name = "sealora-udid"
          main = "worker.js"
          compatibility_date = "2026-11-10"
          workers_dev = false

          routes = [
            { pattern = "udid.nextjailbreak.com", custom_domain = true }
          ]

          [[kv_namespaces]]
          binding = "SESSIONS"
          id = "$ID"
          EOT
      - name: Deploy consent-based UDID profile service
        working-directory: cloudflare/sealora-udid
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.deploy.toml
      - name: Verify the HTTPS endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-delay 4 --max-time 15 https://udid.nextjailbreak.com/health | grep -q '"service":"Sealora UDID"'
          echo "Verified Sealora HTTPS UDID profile service." >> "$GITHUB_STEP_SUMMARY"
