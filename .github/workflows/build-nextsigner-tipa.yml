name: Build Next Signer TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nextsigner-1.4.2-ota-install
    paths:
      - 'NextSigner/**'
      - '.github/workflows/build-nextsigner-tipa.yml'

permissions:
  contents: write

concurrency:
  group: nextsigner-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXTSIGNER_VERSION: '1.4.2'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Apple OTA install UI patch
        run: |
          set -euo pipefail
          python3 NextSigner/patch_142_ota_ui.py
          if ! git diff --quiet -- NextSigner/NextSigner/NextSignerLocalViews.swift; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add NextSigner/NextSigner/NextSignerLocalViews.swift
            git commit -m 'Use Apple OTA install from Signed Apps'
            git push origin HEAD:feature/nextsigner-1.4.2-ota-install
          fi

      - name: Verify 1.4.2 OTA source
        run: |
          set -euo pipefail
          grep -q 'MARKETING_VERSION: "1.4.2"' NextSigner/project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "25"' NextSigner/project.yml
          grep -q 'local.install(app, using: store)' NextSigner/NextSigner/NextSignerLocalViews.swift
          grep -q 'itms-services://?action=download-manifest' NextSigner/NextSigner/LocalSigningController.swift
          if grep -q 'apple-magnifier://install' NextSigner/NextSigner/NextSignerLocalViews.swift; then
            echo 'Signed Apps still uses the Magnifier/TrollStore URL scheme' >&2
            exit 1
          fi

      - name: Prepare patched Zsign sources
        run: |
          set -euo pipefail
          rm -rf NextSigner/Vendor/Zsign-Package
          git clone --depth 1 --branch package https://github.com/claration/Zsign-Package.git NextSigner/Vendor/Zsign-Package
          python3 NextSigner/patch_zsign_local.py

      - name: Generate Next Signer app icon
        run: python3 NextSigner/generate_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: NextSigner
        run: xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: NextSigner
        run: |
          set -euo pipefail
          xcodebuild \
            -project NextSigner.xcodeproj \
            -scheme NextSigner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/NextSignerDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify packaged app icon
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/NextSignerDerived/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP_PATH" || { echo 'Built .app not found'; exit 1; }
          test -f "$APP_PATH/Assets.car" || { echo 'Compiled asset catalog missing'; exit 1; }

      - name: Package IPA and TIPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/NextSignerDerived/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP_PATH" || { echo 'Built .app not found'; exit 1; }
          rm -rf "$RUNNER_TEMP/package"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/NextSigner.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.ipa" Payload
          cp "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.ipa" "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.tipa"
          unzip -t "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.tipa" >/dev/null
          shasum -a 256 "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.ipa" "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.tipa"

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextSigner-1.4.2-Test
          path: |
            ${{ runner.temp }}/NextSigner-1.4.2.tipa
            ${{ runner.temp }}/NextSigner-1.4.2.ipa
          if-no-files-found: error
          retention-days: 30
