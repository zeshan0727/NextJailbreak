name: Publish NetMirror 1.0.20 to NS Transfer

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-netmirror-1.0.20.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HANDOFF_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-5580-8211-8e15-6263453e888a/raw?se=2026-10-06T09%3A21%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=af1b58ae-f7cf-5e2f-995d-2f020af66cd1&skoid=37f774a3-b6f2-4e56-9fdd-339e5d6e97f8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T06%3A03%3A46Z&ske=2026-10-07T06%3A03%3A46Z&sks=b&skv=2026-02-06&sig=PwTtzTj%2BepqnorhmYNYhIVvLtrUrvg3kVz639OVzFtc%3D"
      EXPECTED_TIPA_SHA256: "23159fc7f9c7eb75b3d75c7dc110c47420685e0a55e4e4a05948131e7aeea16a"
      EXPECTED_HERMES_SHA256: "42f96376c8971aee304f6806471dbee0b7f94e3de5f329f6365e83088aea2ca6"
      EXPECTED_HERMES_SIZE: "1215512"
      DEST_DIR: "transfer/files/NetMirror/1.0.20"
      DEST_NAME: "NetMirror-1.0.20-Android-WebView-Support-Gate-Bypass.tipa"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated private build handoff
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 "$HANDOFF_URL" -o /tmp/netmirror-v20.zip
          rm -rf /tmp/netmirror-v20 /tmp/netmirror-payload
          mkdir -p /tmp/netmirror-v20 /tmp/netmirror-payload
          unzip -q /tmp/netmirror-v20.zip -d /tmp/netmirror-v20
          SRC="$(find /tmp/netmirror-v20 -maxdepth 1 -type f -name '*.tipa' | head -n1)"
          test -n "$SRC"
          test "$(sha256sum "$SRC" | awk '{print $1}')" = "$EXPECTED_TIPA_SHA256"

          unzip -q "$SRC" -d /tmp/netmirror-payload
          BUNDLE="$(find /tmp/netmirror-payload -path '*/Payload/*.app/main.jsbundle' | head -n1)"
          test -n "$BUNDLE"
          test "$(stat -c '%s' "$BUNDLE")" = "$EXPECTED_HERMES_SIZE"
          test "$(sha256sum "$BUNDLE" | awk '{print $1}')" = "$EXPECTED_HERMES_SHA256"

          mkdir -p "$DEST_DIR"
          cp "$SRC" "$DEST_DIR/$DEST_NAME"

      - name: Update NS Transfer feed
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path("transfer/index.json")
          data=json.loads(p.read_text())
          entry={
            "id":"netmirror-1.0.20-support-gate-bypass",
            "name":"NetMirror 1.0.20 — Support Gate Bypass",
            "fileName":"NetMirror-1.0.20-Android-WebView-Support-Gate-Bypass.tipa",
            "type":"tipa",
            "platform":"TrollStore / iOS 15.1+",
            "version":"1.0.20",
            "url":"https://nextjailbreak.com/transfer/files/NetMirror/1.0.20/NetMirror-1.0.20-Android-WebView-Support-Gate-Bypass.tipa",
            "sha256":"23159fc7f9c7eb75b3d75c7dc110c47420685e0a55e4e4a05948131e7aeea16a",
            "sizeBytes":6418808,
            "notes":"Bypasses the initial NetMirror 'We Need Support / Click Here / Open 1 ADS per Day' screen on net52.cc/mobile/home at the iOS WebView layer. The bypass removes the support gate and associated blur/interaction lock and keeps a MutationObserver active if the page recreates the gate. Retains the direct WebView event bridge, popup handling and hard reload compatibility from prior builds. Original recovered Hermes bundle remains unchanged."
          }
          data["files"]=[x for x in data.get("files",[]) if x.get("id")!=entry["id"]]
          data["files"].insert(0,entry)
          data["updatedAt"]=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          p.write_text(json.dumps(data,indent=2,ensure_ascii=True)+"\n")
          PY

      - name: Commit publication and remove one-shot handoff
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-netmirror-1.0.20.yml
          git add "$DEST_DIR/$DEST_NAME" transfer/index.json
          git commit -m "Publish NetMirror 1.0.20 to NS Transfer [skip ci]"
          git push origin HEAD:main
