name: Next Auto Sign - Post Build Relay
on:
  workflow_run:
    workflows: ["Build Next Post TIPA"]
    types: [completed]
permissions:
  contents: write
  actions: write
jobs:
  validate-trigger:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      ARTIFACT_DIRECTORY: ${{ github.workspace }}/unsigned
      EXPECTED_BUNDLE_ID: com.nextsolution.nextpost
    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Fetch successful build artifact
        uses: actions/download-artifact@v4
        with:
          name: NextPost-1.0.17-Professional-X-Posts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ github.workspace }}/unsigned
      - name: Verify unsigned IPA metadata
        run: python3 .github/scripts/auto-sign-ios.py inspect

      - name: Submit verified IPA to existing Next Signer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view nextsigner-inbox >/dev/null 2>&1; then
            gh release create nextsigner-inbox --draft \
              --title 'Next Signer Inbox' \
              --notes 'Unsigned app staging for the encrypted-secret signing workflow'
          fi
          ASSET="auto-nextpost-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ipa"
          cp "$RUNNER_TEMP/auto-sign-input.ipa" "$RUNNER_TEMP/$ASSET"
          gh release upload nextsigner-inbox "$RUNNER_TEMP/$ASSET"
          gh workflow run nextsigner-sign-publish.yml --ref main \
            -f "staging_asset=$ASSET" \
            -f "requested_name=$APP_NAME" \
            -f "requested_bundle_id=$REQUESTED_BUNDLE_ID"
          {
            echo '## Next Post automatic signing requested'
            echo "Original bundle ID: $REQUESTED_BUNDLE_ID"
            echo "Version: $APP_VERSION ($APP_BUILD)"
            echo 'Signing: see Next Signer - Sign and Publish workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
