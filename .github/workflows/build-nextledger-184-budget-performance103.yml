name: Next Ledger Build 104 Original Expense Categories

on:
  push:
    branches: [feature/nextledger-1.3.84-build104-original-expense-categories]
    paths:
      - ".github/workflows/build-nextledger-184-budget-performance103.yml"
      - "DailyLedger/Services/BudgetPerformanceEngine.swift"
      - "DailyLedger/Views/BudgetPerformanceReportView.swift"
      - "Tests/NextLedgerBudgetPerformance/main.swift"
      - "project.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextledger-184-budget-performance103
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout full verified original Next Ledger 1.3.84 source
        uses: actions/checkout@v4
        with:
          ref: feature/nextledger-1.3.84-build104-original-expense-categories

      - name: Validate full original features and iCloud documents declarations
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'title: "Import JSON Backup"' DailyLedger/Views/SettingsView.swift
          grep -Fq 'SettingsGroupedDetailPage(title: "Backup & Sync")' DailyLedger/Views/SettingsView.swift
          grep -Fq 'Label("iCloud Backup", systemImage: "icloud")' DailyLedger/Views/SettingsView.swift
          grep -Fq 'Label("Backup Activity", systemImage: "clock.arrow.circlepath")' DailyLedger/Views/SettingsView.swift
          grep -Fq 'Label("Export & Restore", systemImage: "externaldrive")' DailyLedger/Views/SettingsView.swift
          grep -Fq '.listRowSeparator(.visible)' DailyLedger/Views/SettingsView.swift
          grep -Fq 'Group {' DailyLedger/Views/LedgerRestoreImportControl.swift
          if grep -Fq 'SettingsSectionPage(title: "Backup & Sync")' DailyLedger/Views/SettingsView.swift; then
            echo 'Backup page must not use nested merged-row SettingsSectionPage layout' >&2
            exit 1
          fi
          grep -Fq 'private var daemonHeartbeatRecent: Bool' DailyLedger/Views/SMSImportConsoleView.swift
          # Backup & Sync is the sole Settings JSON import location.
          test "$(grep -c 'LedgerRestoreImportControl(' DailyLedger/Views/SettingsView.swift)" -eq 1
          grep -Fq 'MARKETING_VERSION: "1.3.84"' project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "104"' project.yml
          grep -Fq 'path: DailyLedger/DailyLedger.entitlements' project.yml
          grep -Fq 'com.apple.developer.icloud-services' DailyLedger/DailyLedger.entitlements
          grep -Fq 'CloudDocuments' DailyLedger/DailyLedger.entitlements
          grep -Fq 'iCloud.com.nextsolution.dailyledger' DailyLedger/DailyLedger.entitlements
          grep -Fq 'NSUbiquitousContainers' DailyLedger/Info.plist
          grep -Fq 'backupOnAppOpen()' DailyLedger/DailyLedgerApp.swift
          grep -Fq 'LedgerBackupExportPicker' DailyLedger/Views/SettingsView.swift
          grep -Fq 'LedgerRestoreImportControl' DailyLedger/Views/SettingsView.swift
          grep -Fq 'forOpeningContentTypes: [.item]' DailyLedger/Views/LedgerBackupFilePicker.swift
          grep -Fq 'Import JSON Backup' DailyLedger/Views/SettingsView.swift
          grep -Fq '.fileImporter(' DailyLedger/Views/LedgerRestoreImportControl.swift
          grep -Fq 'onFileImporterResult(result)' DailyLedger/Views/LedgerRestoreImportControl.swift
          grep -Fq 'Merge Verified Backup' DailyLedger/Views/LedgerRestoreImportControl.swift
          grep -Fq 'Find JSON in App Imports Folder' DailyLedger/Views/LedgerRestoreImportControl.swift
          grep -Fq 'startAccessingSecurityScopedResource()' DailyLedger/Views/LedgerRestoreImportControl.swift
          grep -Fq 'let data = try Data(contentsOf: url)' DailyLedger/Views/LedgerRestoreImportControl.swift
          grep -Fq 'DispatchQueue.main.asyncAfter(deadline: .now() + 12)' DailyLedger/Views/LedgerRestoreImportControl.swift
          if grep -Fq 'NSFileCoordinator()' DailyLedger/Views/LedgerRestoreImportControl.swift; then
            echo 'Blocking NSFileCoordinator is still used for JSON restore; aborting build' >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print UIFileSharingEnabled' DailyLedger/Info.plist | grep -Fq true
          /usr/libexec/PlistBuddy -c 'Print LSSupportsOpeningDocumentsInPlace' DailyLedger/Info.plist | grep -Fq true
          grep -Fq 'DispatchQueue.global(qos: .userInitiated).async' DailyLedger/Views/LedgerRestoreImportControl.swift
          grep -Fq 'iCloudContainerUnavailable' DailyLedger/Services/BackupSyncService.swift
          grep -Fq 'verifiedBackupData()' DailyLedger/Views/SettingsView.swift
          grep -Fq 'refreshCloudDiagnostics()' DailyLedger/Views/SettingsView.swift
          ! grep -Fq '.preferredColorScheme(.light)' DailyLedger/Views/FixedBudgetDashboardView.swift
          grep -Fq 'maxBackupFiles = 10' DailyLedger/Services/BackupSyncService.swift
          grep -Fq 'Fetch Latest 15 SMS' DailyLedger/Views/SMSImportConsoleView.swift
          grep -Fq 'Loan Summary Comparison' DailyLedger/Views/ReportsView.swift
          # Build 100: remove only requested visible sections/shortcuts.
          ! grep -Fq 'Section("Accounting Registers")' DailyLedger/Views/ReportsView.swift
          ! grep -Fq 'Section("ERP Accounting")' DailyLedger/Views/ReportsView.swift
          ! grep -Fq 'Section("Statements & Aging")' DailyLedger/Views/ReportsView.swift
          grep -Fq 'Section("Planning & Comparison")' DailyLedger/Views/ReportsView.swift
          grep -Fq 'Text("Choose a report")' DailyLedger/Views/ReportsView.swift
          grep -Fq 'struct FixedBudgetDashboardView: View' DailyLedger/Views/FixedBudgetDashboardView.swift
          grep -Fq 'Text("Monthly Budget")' DailyLedger/Views/FixedBudgetDashboardView.swift
          ! grep -Fq 'SettingsSectionPage(title: "Import & Export")' DailyLedger/Views/SettingsView.swift
          ! grep -Fq 'title: "Fixed Monthly Budget"' DailyLedger/Views/SettingsView.swift
          ! grep -Fq 'title: "Budgets"' DailyLedger/Views/SettingsView.swift
          grep -Fq 'title: "Auto-Categorize Transactions"' DailyLedger/Views/SettingsView.swift
          grep -Fq 'title: "Review Uncategorized"' DailyLedger/Views/SettingsView.swift
          grep -Fq 'SettingsGroupedDetailPage(title: "Backup & Sync")' DailyLedger/Views/SettingsView.swift

          grep -Fq 'TabOrderSettingsView' DailyLedger/Views/SettingsView.swift
          plutil -lint DailyLedger/DailyLedger.entitlements DailyLedger/Info.plist

      - name: Run safe cross-device sync regression tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc DailyLedger/Services/SafeDeviceMerge.swift Tests/NextLedgerDeviceSync/main.swift -o /tmp/nextledger-device-sync-test
          /tmp/nextledger-device-sync-test
          grep -Fq 'NSMetadataQueryUbiquitousDocumentsScope' DailyLedger/Services/DeviceSyncService.swift
          grep -Fq 'device-' DailyLedger/Services/DeviceSyncService.swift
          grep -Fq 'lastPublishedData != fingerprint' DailyLedger/Services/DeviceSyncService.swift
          grep -Fq 'DeviceSyncService.shared.ledgerDidSave()' DailyLedger/Services/LedgerDiskStore.swift
          grep -Fq 'DeviceSyncService.shared.start(store: store)' DailyLedger/DailyLedgerApp.swift
          grep -Fq 'Sync Across Devices' DailyLedger/Views/SettingsView.swift

      - name: Run monthly budget regression test
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc DailyLedger/Models/MonthlyFixedBudget.swift Tests/NextLedgerBudget/main.swift -o /tmp/nextledger-184-budget-test
          /tmp/nextledger-184-budget-test

      - name: Test Budget Performance math and historic backup compatibility
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc DailyLedger/Models/MonthlyFixedBudget.swift DailyLedger/Services/BudgetPerformanceEngine.swift Tests/NextLedgerBudgetPerformance/main.swift -o /tmp/nextledger-performance-104
          /tmp/nextledger-performance-104
          grep -Fq 'BudgetPerformanceReportView()' DailyLedger/Views/ReportsView.swift
          grep -Fq 'Budget Performance · Actual vs Plan' DailyLedger/Views/ReportsView.swift
          grep -Fq 'spendAssignments' DailyLedger/Models/MonthlyFixedBudget.swift
          grep -Fq 'Categories without a planned allocation are outside budget' DailyLedger/Services/BudgetPerformanceEngine.swift
          grep -Fq 'Outside Budget' DailyLedger/Views/BudgetPerformanceReportView.swift
          grep -Fq 'Remaining percentage' DailyLedger/Views/BudgetPerformanceReportView.swift
          grep -Fq 'Fixed Expenses — Paid vs Planned' DailyLedger/Views/BudgetPerformanceReportView.swift
          grep -Fq 'includesInSpending' DailyLedger/Services/BudgetPerformanceEngine.swift
          grep -Fq 'Unassigned Expenses — Assign to Budget' DailyLedger/Views/BudgetPerformanceReportView.swift
          grep -Fq 'amount(fixed.amount)' DailyLedger/Views/BudgetPerformanceReportView.swift
          grep -Fq 'otherRecordedCategories' DailyLedger/Services/BudgetPerformanceEngine.swift
          grep -Fq 'category: transaction.category' DailyLedger/Views/BudgetPerformanceReportView.swift
          grep -Fq 'Other Planned Expenses — Original Categories' DailyLedger/Views/BudgetPerformanceReportView.swift
          grep -Fq 'fixedMatchHint' DailyLedger/Services/BudgetPerformanceEngine.swift

      - name: Generate full Xcode project
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          grep -q 'DailyLedger.entitlements' DailyLedger.xcodeproj/project.pbxproj
          # XcodeGen writes the entitlement file; verify actual generated values.
          grep -Fq 'CloudDocuments' DailyLedger/DailyLedger.entitlements
          grep -Fq 'com.apple.developer.ubiquity-container-identifiers' DailyLedger/DailyLedger.entitlements
          grep -Fq 'iCloud.com.nextsolution.dailyledger' DailyLedger/DailyLedger.entitlements
          /usr/libexec/PlistBuddy -c 'Print com.apple.developer.icloud-services:0' DailyLedger/DailyLedger.entitlements | grep -Fq 'CloudDocuments'

      - name: Build unsigned device IPA for personal Ad Hoc certificate signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project DailyLedger.xcodeproj -scheme DailyLedger \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/nextledger-184-icloud \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/nextledger-184-build.log

      - name: Check IPA and copy iCloud entitlements for external signing
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find /tmp/nextledger-184-icloud/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = 'com.nextsolution.dailyledger'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" = '1.3.84'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" = '104'
          test "$(/usr/libexec/PlistBuddy -c 'Print NSUbiquitousContainers:iCloud.com.nextsolution.dailyledger:NSUbiquitousContainerIsDocumentScopePublic' "$APP/Info.plist")" = 'true'
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")"
          test "$(stat -f %z "$BIN")" -gt 12000000
          strings "$BIN" > /tmp/nextledger183-binary-strings.txt
          for REQUIRED in "Fetch Latest 15 SMS" "SMS Import Console" "Loan Summary Comparison" "Monthly Fixed Expenses" "Apply Budget Plan"; do
            grep -Fq "$REQUIRED" /tmp/nextledger183-binary-strings.txt
          done
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.84-Build104-OriginalCategories-UNSIGNED.ipa
          unzip -t NextLedger-1.3.84-Build104-OriginalCategories-UNSIGNED.ipa >/dev/null
          cp DailyLedger/DailyLedger.entitlements NextLedger-1.3.84-Build104-iCloud.entitlements
          shasum -a 256 NextLedger-1.3.84-Build104-OriginalCategories-UNSIGNED.ipa > NextLedger-1.3.84-Build104-OriginalCategories-UNSIGNED.sha256
          ls -lh NextLedger-1.3.84-Build104-OriginalCategories-UNSIGNED.ipa
          echo "NOTE: This IPA is unsigned. It MUST be signed with an Apple certificate and valid iCloud-enabled Ad Hoc provisioning profile."

      - name: Upload unsigned signing-ready IPA, entitlements and checksum
        uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.84-Build104-OriginalCategories-UNSIGNED
          path: |
            NextLedger-1.3.84-Build104-OriginalCategories-UNSIGNED.ipa
            NextLedger-1.3.84-Build104-iCloud.entitlements
            NextLedger-1.3.84-Build104-OriginalCategories-UNSIGNED.sha256
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish verified Build 104 to NS Transfer
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Checkout NS Transfer index from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified artifact from this successful build
        uses: actions/download-artifact@v4
        with:
          name: NextLedger-1.3.84-Build104-OriginalCategories-UNSIGNED
          path: build104

      - name: Validate unsigned IPA, checksum, bundle version and iCloud container
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" || { echo "NS Transfer R2 credentials unavailable"; exit 1; }
          python3 - <<'PY'
          import hashlib, pathlib, plistlib, zipfile
          d=pathlib.Path('build104')
          ipa=d/'NextLedger-1.3.84-Build104-OriginalCategories-UNSIGNED.ipa'
          checksum=d/'NextLedger-1.3.84-Build104-OriginalCategories-UNSIGNED.sha256'
          assert ipa.is_file() and checksum.is_file()
          sha=hashlib.sha256(ipa.read_bytes()).hexdigest()
          assert sha==checksum.read_text().split()[0].lower()
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None
              names=[n for n in z.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist') and n.count('/')==2]
              assert len(names)==1
              info=plistlib.loads(z.read(names[0]))
              assert info['CFBundleIdentifier']=='com.nextsolution.dailyledger'
              assert info['CFBundleShortVersionString']=='1.3.84'
              assert info['CFBundleVersion']=='104'
              assert 'iCloud.com.nextsolution.dailyledger' in info.get('NSUbiquitousContainers',{})
          print('Verified Next Ledger Build 104 IPA',sha)
          PY
          IPA="build104/NextLedger-1.3.84-Build104-OriginalCategories-UNSIGNED.ipa"
          echo "FILE_SHA=$(sha256sum "$IPA" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "FILE_SIZE=$(stat -c %s "$IPA")" >> "$GITHUB_ENV"

      - name: Upload to Cloudflare R2 and verify public link
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet --break-system-packages awscli
          export PATH="$HOME/.local/bin:$PATH"
          KEY="apps/ipa/NextLedger/1.3.84/build-104/run-$GITHUB_RUN_ID/NextLedger-1.3.84-Build104-OriginalCategories-UNSIGNED.ipa"
          URL="https://files.nextsolution.cc/$KEY"
          aws s3 cp "build104/NextLedger-1.3.84-Build104-OriginalCategories-UNSIGNED.ipa" "s3://next-signer-apps/$KEY" --endpoint-url "https://4fe920e259870b0366118a17cc5727e5.r2.cloudflarestorage.com" --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable" --only-show-errors
          curl --fail --silent --show-error --location --head --retry 6 --retry-all-errors "$URL" >/dev/null
          echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"

      - name: Register Build 104 in NS Transfer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('transfer/index.json')
          doc=json.loads(p.read_text())
          entry={
            'id':'nextledger-1.3.84-build104-unsigned-ipa',
            'name':'Next Ledger 1.3.84 Build 104 — Original Expense Categories (unsigned)',
            'fileName':'NextLedger-1.3.84-Build104-OriginalCategories-UNSIGNED.ipa',
            'type':'ipa','platform':'iOS 16+ — sign with Next Signer',
            'version':'1.3.84 (103)','url':os.environ['PUBLIC_URL'],
            'sha256':os.environ['FILE_SHA'],'sizeBytes':int(os.environ['FILE_SIZE']),
            'storage':'Cloudflare R2',
            'notes':'Original transaction categories retained (Uber as Taxi), automatic Other planned expense allocation, per-category totals, and safe transfer classification. Unsigned; sign with iCloud-enabled profile.'
          }
          doc['files']=[entry]+[x for x in doc.get('files',[]) if x.get('id')!=entry['id']]
          doc['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(doc,indent=2,ensure_ascii=False)+'\n')
          PY
          python3 -m json.tool transfer/index.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json
          if ! git diff --cached --quiet; then
            git commit -m "Register Next Ledger Build 104 in NS Transfer"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
