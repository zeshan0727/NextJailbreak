name: Site-wide article SEO hardening

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-sitewide-hardening.yml"

permissions:
  contents: write

concurrency:
  group: nextjailbreak-seo-hardening
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Repair existing SEO and harden future publishers
        run: |
          python3 -m automation.seo_hardening
          python3 automation/sync_editorial_indexes.py

      - name: Rebuild RSS from repaired publication metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from automation.publisher import _render_feed
          site = json.loads(Path('automation/site.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('automation/published-articles.json').read_text(encoding='utf-8'))
          Path('feed.xml').write_text(_render_feed(audit['entries'], site), encoding='utf-8')
          PY

      - name: Validate SEO invariants
        run: |
          python3 -m py_compile automation/seo_utils.py automation/seo_hardening.py automation/publisher.py automation/draft_pipeline.py automation/ios_repo_news.py automation/dopamine_cluster.py
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from xml.etree import ElementTree

          root = Path('.')
          audit = json.loads((root/'automation/published-articles.json').read_text(encoding='utf-8'))
          sitemap = ElementTree.fromstring((root/'sitemap.xml').read_text(encoding='utf-8'))
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs = [n.text.strip() for n in sitemap.findall('s:url/s:loc', ns) if n.text]
          if len(locs) != len(set(locs)):
              raise SystemExit('Duplicate sitemap URLs remain')

          checked = 0
          for entry in audit.get('entries', []):
              if not isinstance(entry, dict) or not entry.get('href'):
                  continue
              href = str(entry['href']).lstrip('/')
              page = root / href
              if href.endswith('/'):
                  page = page / 'index.html'
              if not page.exists():
                  continue
              text = page.read_text(encoding='utf-8')
              name = str(entry.get('name') or '').strip()
              version = str(entry.get('version') or '').strip()
              title = re.search(r'<title>(.*?)</title>', text, re.I|re.S)
              desc = re.search(r'<meta\s+name=["\']description["\']\s+content=["\']([^"\']+)', text, re.I)
              if not title or not desc:
                  raise SystemExit(f'Missing title/description: {page}')
              if name and name.lower() not in title.group(1).lower():
                  raise SystemExit(f'Exact tweak/product name missing from SEO title: {page}')
              if version and str(entry.get('category', {}).get('id', '')).lower() != 'jailbreak' and version.lower() not in title.group(1).lower():
                  raise SystemExit(f'Version missing from tweak SEO title: {page}')
              if 'NEXTJAILBREAK_SEMANTIC_SEO_START' not in text:
                  raise SystemExit(f'Semantic SEO block missing: {page}')
              canonical = 'https://nextjailbreak.com/' + href
              if canonical not in locs:
                  raise SystemExit(f'Article absent from sitemap: {canonical}')
              checked += 1
          if checked < 20:
              raise SystemExit(f'Unexpectedly low article validation count: {checked}')
          print(f'Validated SEO for {checked} existing article pages; sitemap URLs are unique.')
          PY

      - name: Commit repaired pages and future SEO rules
        run: |
          git config user.name "nextjailbreak-seo[bot]"
          git config user.email "nextjailbreak-seo[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No SEO changes required."
            exit 0
          fi
          git commit -m "SEO: strengthen direct article indexing sitewide"
          git pull --rebase origin main
          git push origin HEAD:main
