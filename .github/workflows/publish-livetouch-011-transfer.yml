name: Publish LiveTouch 0.1.6 RootHide ElleKit Fix to NS Transfer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-livetouch-011-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ID: '10394330617'
      DEST_DIR: transfer/files/LiveTouch/0.1.6
      DEST_FILE: LiveTouch-0.1.6-roothide-ellekit-fix.tipa
      APP_SHA: 037e15e8c45d0aa44eb97eb55d93c44752be53412245670ff5c676e555877db3
      APP_SIZE: '78194'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified LiveTouch 0.1.6 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/livetouch016.zip
          rm -rf /tmp/livetouch016
          mkdir -p /tmp/livetouch016
          unzip -q /tmp/livetouch016.zip -d /tmp/livetouch016
          test -f "/tmp/livetouch016/${DEST_FILE}"

      - name: Verify exact RootHide ElleKit TIPA
        shell: bash
        run: |
          set -euo pipefail
          APP="/tmp/livetouch016/${DEST_FILE}"
          test "$(sha256sum "$APP" | awk '{print $1}')" = "$APP_SHA"
          test "$(stat -c%s "$APP")" = "$APP_SIZE"
          unzip -tq "$APP" >/dev/null
          python3 - "$APP" <<'PY'
          import plistlib,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              p=plistlib.loads(z.read('Payload/LiveTouch.app/Info.plist'))
              e=plistlib.loads(z.read('Payload/LiveTouch.app/LiveTouchEngine.plist'))
              assert p['CFBundleIdentifier']=='com.nextjailbreak.livetouch'
              assert p['CFBundleShortVersionString']=='0.1.6'
              assert p['CFBundleVersion']=='7'
              assert p['TSRootBinaries']==['LiveTouchRootHelper']
              assert 'com.apple.springboard' in e['Filter']['Bundles']
              required=(
                  'Payload/LiveTouch.app/LiveTouch',
                  'Payload/LiveTouch.app/LiveTouchRootHelper',
                  'Payload/LiveTouch.app/LiveTouchEngine.dylib',
                  'Payload/LiveTouch.app/LiveTouchEngine.plist',
              )
              for path in required: assert path in z.namelist(), path
              main=z.read('Payload/LiveTouch.app/LiveTouch')
              helper=z.read('Payload/LiveTouch.app/LiveTouchRootHelper')
              engine=z.read('Payload/LiveTouch.app/LiveTouchEngine.dylib')
              assert b'--root-helper' in main
              assert b'/usr/lib/TweakInject' in main
              assert b'RootHide active injection directory:' in main
              assert b'Engine installed for RootHide/ElleKit.' in main
              assert b'RootHide active injection directory:' in helper
              assert b'LiveTouchEngine 0.1.6 loaded into' in engine
              assert b'CSCoverSheetViewController' in engine
              assert b'engine.log' in engine
              assert b'@loader_path/.jbroot/usr/lib/libroothide.dylib' not in main
              assert b'@loader_path/.jbroot/usr/lib/libroothide.dylib' not in helper
          PY

      - name: Publish 0.1.6 and replace older LiveTouch feed entries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEST_DIR"
          cp "/tmp/livetouch016/${DEST_FILE}" "$DEST_DIR/$DEST_FILE"

          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('transfer/index.json')
          data=json.loads(p.read_text())
          data['files']=[x for x in data.get('files',[]) if not str(x.get('id','')).startswith('livetouch-')]
          item={
            'id':'livetouch-0.1.6-roothide-ellekit-fix',
            'name':'LiveTouch 0.1.6 — RootHide ElleKit Fix',
            'fileName':'LiveTouch-0.1.6-roothide-ellekit-fix.tipa',
            'type':'tipa',
            'platform':'TrollStore / RootHide iOS 15+',
            'version':'0.1.6 (7)',
            'url':'https://nextjailbreak.com/transfer/files/LiveTouch/0.1.6/LiveTouch-0.1.6-roothide-ellekit-fix.tipa',
            'sha256':'037e15e8c45d0aa44eb97eb55d93c44752be53412245670ff5c676e555877db3',
            'sizeBytes':78194,
            'notes':'Fixes RootHide wallpaper engine injection after successful apply. LiveTouch now prefers the active ElleKit usr/lib/TweakInject directory instead of the legacy MobileSubstrate directory, removes the stale legacy engine copy, installs a SpringBoard-filtered iOS 16 CoverSheet engine, and writes engine.log when SpringBoard actually loads the dylib. App/helper remain free of the RootHide launch-time libroothide dependency.'
          }
          data['files'].insert(0,item)
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          live=[x for x in data['files'] if str(x.get('id','')).startswith('livetouch-')]
          assert len(live)==1, [x.get('id') for x in live]
          assert live[0]['id']=='livetouch-0.1.6-roothide-ellekit-fix', live[0]
          PY

          python3 -m json.tool transfer/index.json >/dev/null

      - name: Commit NS Transfer publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json "$DEST_DIR/$DEST_FILE"
          git diff --cached --stat
          git commit -m 'Publish LiveTouch 0.1.6 RootHide ElleKit fix to NS Transfer'
          git push origin HEAD:main
