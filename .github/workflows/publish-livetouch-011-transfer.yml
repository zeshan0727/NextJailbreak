name: Publish LiveTouch 0.1.7 Final Cleanup to NS Transfer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-livetouch-011-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ID: '10395305088'
      DEST_DIR: transfer/files/LiveTouch/0.1.7
      DEST_FILE: LiveTouch-0.1.7-final-cleanup.tipa
      APP_SHA: d5b38d821373ec3b6603d9a9288350f4a1bdf51c61642465880c30cd27acc952
      APP_SIZE: '54779'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified LiveTouch 0.1.7 cleanup artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/livetouch017.zip
          rm -rf /tmp/livetouch017
          mkdir -p /tmp/livetouch017
          unzip -q /tmp/livetouch017.zip -d /tmp/livetouch017
          test -f "/tmp/livetouch017/${DEST_FILE}"

      - name: Verify exact final cleanup TIPA
        shell: bash
        run: |
          set -euo pipefail
          APP="/tmp/livetouch017/${DEST_FILE}"
          test "$(sha256sum "$APP" | awk '{print $1}')" = "$APP_SHA"
          test "$(stat -c%s "$APP")" = "$APP_SIZE"
          unzip -tq "$APP" >/dev/null
          python3 - "$APP" <<'PY'
          import plistlib,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              p=plistlib.loads(z.read('Payload/LiveTouch.app/Info.plist'))
              assert p['CFBundleIdentifier']=='com.nextjailbreak.livetouch'
              assert p['CFBundleDisplayName']=='LiveTouch Cleanup'
              assert p['CFBundleShortVersionString']=='0.1.7'
              assert p['CFBundleVersion']=='8'
              assert p['TSRootBinaries']==['LiveTouchRootHelper']
              names=set(z.namelist())
              assert 'Payload/LiveTouch.app/LiveTouch' in names
              assert 'Payload/LiveTouch.app/LiveTouchRootHelper' in names
              assert 'Payload/LiveTouch.app/LiveTouchEngine.dylib' not in names
              assert 'Payload/LiveTouch.app/LiveTouchEngine.plist' not in names
              main=z.read('Payload/LiveTouch.app/LiveTouch')
              assert b'Uninstall LiveTouch Files' in main
              assert b'LiveTouch uninstall cleanup complete.' in main
              assert b'/usr/lib/TweakInject' in main
              assert b'/Library/MobileSubstrate/DynamicLibraries' in main
              assert b'/var/mobile/Library/LiveTouchWallpaper' in main
              assert b'com.nextjailbreak.livetouch.plist' in main
              assert b'@loader_path/.jbroot/usr/lib/libroothide.dylib' not in main
          PY

      - name: Publish 0.1.7 cleanup and replace older LiveTouch feed entries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEST_DIR"
          cp "/tmp/livetouch017/${DEST_FILE}" "$DEST_DIR/$DEST_FILE"

          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('transfer/index.json')
          data=json.loads(p.read_text())
          data['files']=[x for x in data.get('files',[]) if not str(x.get('id','')).startswith('livetouch-')]
          item={
            'id':'livetouch-0.1.7-final-cleanup',
            'name':'LiveTouch 0.1.7 — Final Cleanup',
            'fileName':'LiveTouch-0.1.7-final-cleanup.tipa',
            'type':'tipa',
            'platform':'TrollStore / RootHide iOS 15+',
            'version':'0.1.7 (8)',
            'url':'https://nextjailbreak.com/transfer/files/LiveTouch/0.1.7/LiveTouch-0.1.7-final-cleanup.tipa',
            'sha256':'d5b38d821373ec3b6603d9a9288350f4a1bdf51c61642465880c30cd27acc952',
            'sizeBytes':54779,
            'notes':'Final cleanup-only build. Adds Uninstall LiveTouch Files and Respring to Finish Cleanup. Removes LiveTouchEngine dylib/plist from RootHide ElleKit and legacy tweak paths, deletes saved wallpaper data, preferences and engine log. This TIPA intentionally contains no LiveTouchEngine payload and cannot reinstall the wallpaper engine. After cleanup and one respring, delete LiveTouch from TrollStore.'
          }
          data['files'].insert(0,item)
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          live=[x for x in data['files'] if str(x.get('id','')).startswith('livetouch-')]
          assert len(live)==1, [x.get('id') for x in live]
          assert live[0]['id']=='livetouch-0.1.7-final-cleanup', live[0]
          PY

          python3 -m json.tool transfer/index.json >/dev/null

      - name: Commit NS Transfer publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json "$DEST_DIR/$DEST_FILE"
          git diff --cached --stat
          git commit -m 'Publish LiveTouch 0.1.7 final cleanup to NS Transfer'
          git push origin HEAD:main
