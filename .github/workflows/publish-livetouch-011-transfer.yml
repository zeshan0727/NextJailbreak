name: Publish LiveTouch 0.1.4 RootHide Native to NS Transfer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-livetouch-011-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ID: '10389489961'
      DEST_DIR: transfer/files/LiveTouch/0.1.4
      DEST_FILE: LiveTouch-0.1.4-roothide-test.tipa
      APP_SHA: 788eec95d7fba78e97edceb5385193ba8c818583633d377cdeec0c641e294022
      APP_SIZE: '67220'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified LiveTouch 0.1.4 RootHide artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/livetouch014.zip
          rm -rf /tmp/livetouch014
          mkdir -p /tmp/livetouch014
          unzip -q /tmp/livetouch014.zip -d /tmp/livetouch014
          test -f "/tmp/livetouch014/${DEST_FILE}"

      - name: Verify exact RootHide-native TIPA
        shell: bash
        run: |
          set -euo pipefail
          APP="/tmp/livetouch014/${DEST_FILE}"
          test "$(sha256sum "$APP" | awk '{print $1}')" = "$APP_SHA"
          test "$(stat -c%s "$APP")" = "$APP_SIZE"
          unzip -tq "$APP" >/dev/null
          python3 - "$APP" <<'PY'
          import plistlib,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              p=plistlib.loads(z.read('Payload/LiveTouch.app/Info.plist'))
              assert p['CFBundleIdentifier']=='com.nextjailbreak.livetouch'
              assert p['CFBundleShortVersionString']=='0.1.4'
              assert p['CFBundleVersion']=='5'
              assert p['TSRootBinaries']==['LiveTouchRootHelper']
              required=(
                  'Payload/LiveTouch.app/LiveTouch',
                  'Payload/LiveTouch.app/LiveTouchRootHelper',
                  'Payload/LiveTouch.app/LiveTouchEngine.dylib',
                  'Payload/LiveTouch.app/LiveTouchEngine.plist',
              )
              for path in required: assert path in z.namelist(), path
              main=z.read('Payload/LiveTouch.app/LiveTouch')
              helper=z.read('Payload/LiveTouch.app/LiveTouchRootHelper')
              assert b'--root-helper' in main
              assert b'RootHide jbroot:' in main
              assert b'RootHide tweak directory:' in main
              assert b'Engine installed for RootHide.' in main
              assert b'RootHide tweak directory:' in helper
          PY

      - name: Publish 0.1.4 and replace older LiveTouch feed entries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEST_DIR"
          cp "/tmp/livetouch014/${DEST_FILE}" "$DEST_DIR/$DEST_FILE"

          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('transfer/index.json')
          data=json.loads(p.read_text())
          old={
            'livetouch-0.1-test',
            'livetouch-0.1.1-root-helper-fix',
            'livetouch-0.1.2-embedded-helper-fix',
            'livetouch-0.1.3-rootless-path-fix',
            'livetouch-0.1.4-roothide-native'
          }
          data['files']=[x for x in data.get('files',[]) if x.get('id') not in old]
          item={
            'id':'livetouch-0.1.4-roothide-native',
            'name':'LiveTouch 0.1.4 — RootHide Native',
            'fileName':'LiveTouch-0.1.4-roothide-test.tipa',
            'type':'tipa',
            'platform':'TrollStore / RootHide iOS 15+',
            'version':'0.1.4 (5)',
            'url':'https://nextjailbreak.com/transfer/files/LiveTouch/0.1.4/LiveTouch-0.1.4-roothide-test.tipa',
            'sha256':'788eec95d7fba78e97edceb5385193ba8c818583633d377cdeec0c641e294022',
            'sizeBytes':67220,
            'notes':'RootHide-native test build. Compiled with the RootHide Theos scheme and uses the official jbroot() API to resolve the randomized jailbreak root instead of /var/jb or the read-only system /Library path. Includes embedded root-helper mode, RootHide-native fallback helper, and RootHide-built SpringBoard engine. Fixes the read-only /Library/MobileSubstrate/DynamicLibraries error seen on the previous build.'
          }
          data['files'].insert(0,item)
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY

          python3 -m json.tool transfer/index.json >/dev/null
          grep -Fq 'livetouch-0.1.4-roothide-native' transfer/index.json
          if grep -Eq '"id": "livetouch-0\.1(\.1|\.2|\.3)?' transfer/index.json; then
            echo 'An older LiveTouch feed entry is still present'
            exit 1
          fi

      - name: Commit NS Transfer publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json "$DEST_DIR/$DEST_FILE"
          git diff --cached --stat
          git commit -m 'Publish LiveTouch 0.1.4 RootHide native to NS Transfer'
          git push origin HEAD:main
