name: Publish LiveTouch 0.1.2 Embedded Helper Fix to NS Transfer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-livetouch-011-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ID: '10389531814'
      DEST_DIR: transfer/files/LiveTouch/0.1.2
      DEST_FILE: LiveTouch-0.1.2-test.tipa
      APP_SHA: 791c92369fb35d6b1a716102644f2871afb2f6ca327176df262b393668b9e5f5
      APP_SIZE: '65604'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified LiveTouch 0.1.2 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/livetouch012.zip
          rm -rf /tmp/livetouch012
          mkdir -p /tmp/livetouch012
          unzip -q /tmp/livetouch012.zip -d /tmp/livetouch012
          test -f "/tmp/livetouch012/${DEST_FILE}"

      - name: Verify exact TIPA and embedded root helper
        shell: bash
        run: |
          set -euo pipefail
          APP="/tmp/livetouch012/${DEST_FILE}"
          test "$(sha256sum "$APP" | awk '{print $1}')" = "$APP_SHA"
          test "$(stat -c%s "$APP")" = "$APP_SIZE"
          unzip -tq "$APP" >/dev/null
          python3 - "$APP" <<'PY'
          import plistlib,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              info='Payload/LiveTouch.app/Info.plist'
              p=plistlib.loads(z.read(info))
              assert p['CFBundleIdentifier']=='com.nextjailbreak.livetouch'
              assert p['CFBundleShortVersionString']=='0.1.2'
              assert p['CFBundleVersion']=='3'
              assert p['TSRootBinaries']==['LiveTouchRootHelper']
              required=(
                  'Payload/LiveTouch.app/LiveTouch',
                  'Payload/LiveTouch.app/LiveTouchRootHelper',
                  'Payload/LiveTouch.app/LiveTouchEngine.dylib',
                  'Payload/LiveTouch.app/LiveTouchEngine.plist',
              )
              for path in required: assert path in z.namelist(), path
              main=z.read('Payload/LiveTouch.app/LiveTouch')
              assert b'--root-helper' in main
              assert b'Embedded root helper' in main
              assert b'persona=%d uid=%d gid=%d' in main
          PY

      - name: Publish 0.1.2 and replace older LiveTouch entries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEST_DIR"
          cp "/tmp/livetouch012/${DEST_FILE}" "$DEST_DIR/$DEST_FILE"

          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('transfer/index.json')
          data=json.loads(p.read_text())
          old={'livetouch-0.1-test','livetouch-0.1.1-root-helper-fix','livetouch-0.1.2-embedded-helper-fix'}
          data['files']=[x for x in data.get('files',[]) if x.get('id') not in old]
          item={
            'id':'livetouch-0.1.2-embedded-helper-fix',
            'name':'LiveTouch 0.1.2 — Embedded Root Helper Fix',
            'fileName':'LiveTouch-0.1.2-test.tipa',
            'type':'tipa',
            'platform':'TrollStore / Jailbroken iOS 14+ (Dopamine Rootless first)',
            'version':'0.1.2 (3)',
            'url':'https://nextjailbreak.com/transfer/files/LiveTouch/0.1.2/LiveTouch-0.1.2-test.tipa',
            'sha256':'791c92369fb35d6b1a716102644f2871afb2f6ca327176df262b393668b9e5f5',
            'sizeBytes':65604,
            'notes':'Persistent POSIX spawn 202 fix test. Root operations now launch the already-trusted LiveTouch main executable in hidden --root-helper mode with persona 99 and a NULL child environment, matching TrollStore spawnRoot behavior more closely. The separate root helper remains only as fallback/diagnostic. If spawning still fails, this build reports strerror plus persona/UID/GID setup results and both embedded/legacy helper diagnostics.'
          }
          data['files'].insert(0,item)
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY

          python3 -m json.tool transfer/index.json >/dev/null
          grep -Fq 'livetouch-0.1.2-embedded-helper-fix' transfer/index.json
          if grep -Fq '"id": "livetouch-0.1.1-root-helper-fix"' transfer/index.json; then
            echo 'Old LiveTouch 0.1.1 feed entry still present'
            exit 1
          fi

      - name: Commit NS Transfer publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json "$DEST_DIR/$DEST_FILE"
          git diff --cached --stat
          git commit -m 'Publish LiveTouch 0.1.2 embedded root helper fix to NS Transfer'
          git push origin HEAD:main
