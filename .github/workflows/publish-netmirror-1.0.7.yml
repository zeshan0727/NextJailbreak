name: Publish NetMirror 1.0.7 To NS Transfer

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-netmirror-1.0.7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild TIPA from transfer chunks
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p transfer/files/NetMirror/1.0.7
          cat transfer/builds/NetMirror-1.0.7-chunks/part*.txt | base64 -d > transfer/files/NetMirror/1.0.7/NetMirror-1.0.7-Hermes-Fatal-Stack-Capture.tipa
          test "$(stat -c%s transfer/files/NetMirror/1.0.7/NetMirror-1.0.7-Hermes-Fatal-Stack-Capture.tipa)" = "6405946"
          echo "a0354ce866973a4c96f97b9d0227a0de179a8df4b18051c5fdf4e4c0b51df4b7  transfer/files/NetMirror/1.0.7/NetMirror-1.0.7-Hermes-Fatal-Stack-Capture.tipa" | sha256sum -c -

      - name: Add NetMirror v7 to NS Transfer feed
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          p=Path("transfer/index.json")
          j=json.loads(p.read_text())
          files=[x for x in j.get("files",[]) if x.get("id")!="netmirror-1.0.7-hermes-fatal-stack-capture"]
          files.insert(0,{
            "id":"netmirror-1.0.7-hermes-fatal-stack-capture",
            "name":"NetMirror 1.0.7 — Hermes Fatal Stack Capture",
            "fileName":"NetMirror-1.0.7-Hermes-Fatal-Stack-Capture.tipa",
            "type":"tipa",
            "platform":"TrollStore / iOS 15.1+",
            "version":"1.0.7",
            "url":"https://nextjailbreak.com/transfer/files/NetMirror/1.0.7/NetMirror-1.0.7-Hermes-Fatal-Stack-Capture.tipa",
            "sha256":"a0354ce866973a4c96f97b9d0227a0de179a8df4b18051c5fdf4e4c0b51df4b7",
            "sizeBytes":6405946,
            "notes":"Diagnostic-only follow-up to 1.0.6. Removes the competing generic RCTSetLogFunction/fatal popup so one authoritative fatal handler can expose RCTJSStackTraceKey, Hermes rawStack, JS frame method/file/line/column data, and NSError userInfo for the remaining startup TypeError. Existing ImageLoader, Android Networking/BlobManager, AndroidProgressBar, and brightness compatibility are retained; the original Hermes bundle is unchanged."
          })
          j["files"]=files
          j["updatedAt"]=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          p.write_text(json.dumps(j,indent=2)+"\n")
          PY

      - name: Commit NS Transfer package
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transfer/files/NetMirror/1.0.7/NetMirror-1.0.7-Hermes-Fatal-Stack-Capture.tipa transfer/index.json
          if git diff --cached --quiet; then
            echo "No publish changes"
          else
            git commit -m "Publish NetMirror 1.0.7 to NS Transfer [skip ci]"
            git push origin HEAD:main
          fi
