name: Build Next Cast iOS

on:
  workflow_dispatch:
  push:
    branches:
      - agent/next-cast-1.4.2-ios16-dyld-androidtv
    paths:
      - "NextCast/**"
      - ".github/workflows/nextcast-build.yml"

permissions:
  contents: read

# Never waste multiple macOS runners compiling superseded edits.
concurrency:
  group: nextcast-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build and package TrollStore TIPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen and icon generation dependency
        run: |
          brew install xcodegen cocoapods
          python3 -m venv .iconvenv
          .iconvenv/bin/pip install --disable-pip-version-check pillow

      - name: Generate 1024 px Next Cast app icon
        run: .iconvenv/bin/python NextCast/tools/create_icon.py

      - name: Generate project and resolve official Google Cast SDK
        working-directory: NextCast
        run: |
          xcodegen generate
          pod install --repo-update
          xcodebuild -resolvePackageDependencies -workspace NextCast.xcworkspace -scheme NextCast

      - name: Build iOS 16 device application
        working-directory: NextCast
        run: |
          set -o pipefail
          xcodebuild -workspace NextCast.xcworkspace -scheme NextCast \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee nextcast-build.log

      # Fail the workflow before packaging if any framework still depends on
      # the unavailable Swift CoreMedia overlay on the user's iOS 16 device.
      - name: Verify iOS 16 dynamic library compatibility
        run: |
          set -euo pipefail
          APP="NextCast/build/Build/Products/Release-iphoneos/NextCast.app"
          test -d "$APP"
          test -s "$APP/NextCast"
          echo "Auditing app Mach-O binary and embedded dynamic frameworks"
          FOUND_MISSING=0
          while IFS= read -r -d '' BINARY; do
            case "$(file -b "$BINARY")" in
              *Mach-O*)
                if otool -L "$BINARY" | grep -F "libswiftCoreMedia.dylib"; then
                  echo "::error::Unsupported libswiftCoreMedia dependency in $BINARY"
                  FOUND_MISSING=1
                fi
                ;;
            esac
          done < <(find "$APP" -type f -print0)
          if [ "$FOUND_MISSING" -ne 0 ]; then
            exit 1
          fi
          echo "No references to the missing Swift CoreMedia runtime"
          du -sh "$APP"

      - name: Produce ad-hoc signed TrollStore package
        run: |
          APP="NextCast/build/Build/Products/Release-iphoneos/NextCast.app"
          test -d "$APP"
          test -s "$APP/NextCast"
          mkdir -p dist/Payload
          ditto "$APP" dist/Payload/NextCast.app
          codesign --force --deep --sign - --timestamp=none dist/Payload/NextCast.app
          (cd dist && zip -qry "../NextCast-1.4.2.tipa" Payload)
          cp NextCast-1.4.2.tipa NextCast-1.4.2.ipa
          ls -lh NextCast-1.4.2.tipa NextCast-1.4.2.ipa

      - name: Upload TIPA and build log
        uses: actions/upload-artifact@v4
        with:
          name: NextCast-iOS16-V1-4-2-IPA-TIPA
          path: |
            NextCast-1.4.2.tipa
            NextCast-1.4.2.ipa
            NextCast/nextcast-build.log
          if-no-files-found: error
          retention-days: 30
