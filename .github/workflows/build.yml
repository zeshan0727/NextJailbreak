name: Build iOS App
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild -project SimpleCounter.xcodeproj -scheme SimpleCounter -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA and TIPA
        run: |
          set -euo pipefail
          mkdir -p out/Payload
          ditto "DerivedData/Build/Products/Release-iphoneos/SimpleCounter.app" "out/Payload/SimpleCounter.app"
          (cd out && zip -qry SimpleCounter.ipa Payload)
          cp "out/SimpleCounter.ipa" "out/SimpleCounter.tipa"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleCounter-${{ github.run_number }}
          path: |
            out/*.ipa
            out/*.tipa
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "out/SimpleCounter.ipa" "out/SimpleCounter.tipa" \
            --title "SimpleCounter build ${{ github.run_number }}" \
            --notes "Unsigned output. Requires compatible installation/signing." --target "$GITHUB_SHA"
