name: Build iOS App
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild -project SimpleBrowser.xcodeproj -scheme SimpleBrowser -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Ad-hoc sign for TrollStore
        run: |
          set -euo pipefail
          codesign --force --sign - --timestamp=none "DerivedData/Build/Products/Release-iphoneos/SimpleBrowser.app"
          codesign --verify --verbose=2 "DerivedData/Build/Products/Release-iphoneos/SimpleBrowser.app"
      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p out/Payload
          ditto "DerivedData/Build/Products/Release-iphoneos/SimpleBrowser.app" "out/Payload/SimpleBrowser.app"
          (cd out && zip -qry SimpleBrowser.ipa Payload)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleBrowser-${{ github.run_number }}
          path: |
            out/*.ipa
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "SimpleBrowser-build-${{ github.run_number }}-${{ github.run_attempt }}" "out/SimpleBrowser.ipa" \
            --title "SimpleBrowser build ${{ github.run_number }}" \
            --notes "Ad-hoc signed IPA for compatible TrollStore installation." --target "$GITHUB_SHA"
