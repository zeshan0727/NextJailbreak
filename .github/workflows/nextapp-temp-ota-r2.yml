name: Next App Library Temp 7 Days - Instant HTTPS OTA Fallback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nextapp-temp-ota-r2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ACCOUNT_ID: 4fe920e259870b0366118a17cc5727e5
      R2_BUCKET: next-signer-apps
      R2_PREFIX: apps/ipa/com-nextsolution-njapps/offline-temp-20261105
      FILE_BASE: https://files.nextsolution.cc/apps/ipa/com-nextsolution-njapps/offline-temp-20261105

    steps:
      - name: Checkout verified signed app metadata
        uses: actions/checkout@v4

      - name: Validate signed IPA metadata before installer publishing
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Cloudflare R2 secrets missing"; exit 1; }
          python3 - <<'PY'
          import json, pathlib, plistlib
          appdata=json.loads(pathlib.Path('install/apps.json').read_text())
          app=next(a for a in appdata['apps'] if a.get('id')=='com-nextsolution-njapps-offline-temp')
          assert app['bundleId']=='com.nextsolution.njapps'
          assert app['version']=='1.0.3' and app['build']=='4'
          assert app['available'] is True
          assert app['downloadURL'].endswith('/next-app-library-temp-7-days-1.0.3-4.ipa')
          manifest=plistlib.loads(pathlib.Path('install/com-nextsolution-njapps-offline-temp.plist').read_bytes())
          item=manifest['items'][0]
          assert item['metadata']['bundle-identifier']==app['bundleId']
          assert next(x['url'] for x in item['assets'] if x['kind']=='software-package')==app['downloadURL']
          print('PASS: OTA manifest matches signed offline app record')
          PY
          curl --fail --silent --show-error --location --head --retry 4 --retry-delay 3 \
            "$FILE_BASE/next-app-library-temp-7-days-1.0.3-4.ipa" > /dev/null

      - name: Generate standalone R2 HTTPS OTA installer page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import html,urllib.parse
          base='https://files.nextsolution.cc/apps/ipa/com-nextsolution-njapps/offline-temp-20261105'
          manifest=f'{base}/manifest.plist'
          install='itms-services://?action=download-manifest&url='+urllib.parse.quote(manifest,safe='')
          content=f'''<!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="noindex,nofollow">
          <title>Next App Library Temp 7 Days - Direct Install</title>
          <style>
          body{{margin:0;background:#f4f6fa;color:#101828;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh}}
          main{{width:min(400px,calc(100% - 48px));padding:28px;background:white;border:1px solid #e5e7eb;border-radius:22px;box-shadow:0 16px 50px #10182814;text-align:center}}
          h1{{margin:0 0 10px;font-size:25px}}p{{line-height:1.6;color:#667085}}
          a.button{{display:block;padding:16px 20px;background:#111827;color:white;border-radius:12px;text-decoration:none;font-weight:700;font-size:17px;margin-top:24px}}
          small{{color:#667085;display:block;margin-top:18px;line-height:1.5}}
          </style></head><body><main>
          <h1>Next App Library Temp 7 Days</h1>
          <p>Version 1.0.3 (4) · 7-day offline Ad Hoc test for the registered iPad</p>
          <a class="button" href="{html.escape(install,quote=True)}">Install on iPad</a>
          <small>Profile expires 12 November 2026 at 18:54 Qatar time.<br>
          Uses bundle ID com.nextsolution.njapps; this updates an existing App Library installation rather than adding a second copy.</small>
          </main></body></html>'''
          Path('/tmp/install.html').write_text(content)
          PY

      - name: Upload manifest and standalone installer to R2
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/aws-venv"
          "$RUNNER_TEMP/aws-venv/bin/pip" install -q awscli
          AWS="$RUNNER_TEMP/aws-venv/bin/aws"
          ENDPOINT="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          "$AWS" s3 cp install/com-nextsolution-njapps-offline-temp.plist \
            "s3://$R2_BUCKET/$R2_PREFIX/manifest.plist" \
            --endpoint-url "$ENDPOINT" --content-type application/xml \
            --cache-control "public, max-age=120" --only-show-errors
          "$AWS" s3 cp /tmp/install.html \
            "s3://$R2_BUCKET/$R2_PREFIX/install.html" \
            --endpoint-url "$ENDPOINT" --content-type text/html \
            --cache-control "public, max-age=120" --only-show-errors
          curl --fail --silent --show-error --location --head --retry 7 --retry-delay 3 \
            "$FILE_BASE/manifest.plist" >/dev/null
          curl --fail --silent --show-error --location --head --retry 7 --retry-delay 3 \
            "$FILE_BASE/install.html" >/dev/null
          echo "## Direct Next App Library Temp 7 Days installer published" >> "$GITHUB_STEP_SUMMARY"
          echo "Open: $FILE_BASE/install.html" >> "$GITHUB_STEP_SUMMARY"
