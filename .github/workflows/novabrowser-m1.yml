name: NovaBrowser M1 iOS Build
on:
  push:
    branches:
      - agent/novabrowser-m1-build
    paths:
      - 'NovaBrowser/**'
      - '.github/workflows/novabrowser-m1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout NovaBrowser branch
        uses: actions/checkout@v4
      - name: Verify committed M1 source
        run: |
          test -s NovaBrowser/project.yml
          test -s NovaBrowser/build_tipa.sh
          test -s NovaBrowser/NovaBrowser/App/LaunchDiagnostics.swift
          find NovaBrowser -name '*.swift' | sort
      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow==12.0.0
      - name: Generate reproducible icon assets
        run: python NovaBrowser/scripts/generate_icon.py
      - name: Generate Xcode project
        working-directory: NovaBrowser
        run: xcodegen generate --spec project.yml
      - name: Print Xcode version
        run: xcodebuild -version
      - name: Compile, ad-hoc sign and package TIPA
        working-directory: NovaBrowser
        run: bash build_tipa.sh
      - name: Verify output bundle metadata
        run: |
          test -s NovaBrowser/dist/NovaBrowser.tipa
          unzip -p NovaBrowser/dist/NovaBrowser.tipa Payload/NovaBrowser.app/Info.plist > /tmp/novabrowser-info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /tmp/novabrowser-info.plist | grep -qx '1.0.1'
      - name: Upload repaired TIPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NovaBrowser-1.0.1-startup-fix
          path: |
            NovaBrowser/dist/NovaBrowser.tipa
            NovaBrowser/dist/xcodebuild.log
            NovaBrowser/README.md
          if-no-files-found: warn
