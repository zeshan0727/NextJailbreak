name: Check Next Accountant Partial Staging State
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-next-accountant-partial-staging.yml"
permissions:
  contents: read
jobs:
  readonly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global wrangler@4
      - name: Verify 109 V6 tables and 11913 imported rows, without modifying cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess,sys
          def q(sql):
              proc=subprocess.run(['wrangler','d1','execute','next-accountant-staging','--remote','--yes','--json','--command',sql],capture_output=True,text=True,timeout=100,env=os.environ)
              if proc.returncode:
                  error=(proc.stderr or "").strip()[-900:]
                  error=re.sub(r'"[A-Za-z_][A-Za-z0-9_]*"','"[redacted table]"',error)
                  raise RuntimeError("Read-only query rejected (no data modified): "+error)
              data=json.loads(proc.stdout)
              if isinstance(data,list):
                  return data[0]['results']
              return data['results']
          names=[row['name'] for row in q("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT GLOB '_cf_*' AND name NOT IN ('WebMeta','WebAuditLog','WebFileIndex','WebMigrationRuns')")]
          if not all(re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*',name) for name in names):
              sys.exit('BLOCK: unexpected schema identifier.')
          if len(names)!=109:
              sys.exit('BLOCK: staging table count does not match verified backup.')
          total=0
          for name in names:
              total+=int(q('SELECT COUNT(*) AS n FROM "'+name+'"')[0]['n'])
          indexed=int(q("SELECT COUNT(*) AS n FROM WebFileIndex")[0]['n'])
          print('Verified source tables:',len(names))
          print('Verified imported database rows:',total)
          print('Indexed backup files already in R2:',indexed)
          if total!=11913 or not (0<indexed<909):
              sys.exit('BLOCK: staging is not the expected partial 11,913-row / 909-file migration. Do not resume.')
          print('READ-ONLY CHECK PASS: candidate for guarded file-only recovery; Windows recovery will re-check every table.')
          PY
