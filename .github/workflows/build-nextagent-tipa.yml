      - name: Build v0.7 RootHide daemon arm64
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("projects/NextAgent/daemon/nextagentd.c").read_text()
          source = source.replace('#define NEXTAGENTD_VERSION "0.4.0"', '#define NEXTAGENTD_VERSION "0.7.3"', 1)

          marker = 'static char *action_ping(void) {'
          if marker not in source:
              raise SystemExit("daemon action_ping marker missing")
          includes = '#include "hid_v05.inc"\n#include "system_v07.inc"\n#include "system_v073.inc"\n#include "NABatteryDiagnostics.h"\n#include "NAProcessProtector.h"\n\n'
          source = source.replace(marker, includes + marker, 1)

          route = '    else if (!strcmp(action, "storage")) out = action_storage(&ok_i);\n'
          extra = '''    else if (!strcmp(action, "storage")) out = action_storage(&ok_i);
              else if (!strcmp(action, "hid_status")) out = action_hid_status(&ok_i);
              else if (!strcmp(action, "tap")) out = action_tap_v05(arg, &ok_i, false);
              else if (!strcmp(action, "double_tap")) out = action_tap_v05(arg, &ok_i, true);
              else if (!strcmp(action, "long_press")) out = action_long_press_v05(arg, &ok_i);
              else if (!strcmp(action, "swipe")) out = action_swipe_v05(arg, &ok_i);
              else if (!strcmp(action, "key")) out = action_key_v05(arg, &ok_i);
              else if (!strcmp(action, "paste")) out = action_paste_v05(&ok_i);
              else if (!strcmp(action, "packages")) out = action_packages_v05(&ok_i);
              else if (!strcmp(action, "button")) out = action_button_v07(arg, &ok_i);
              else if (!strcmp(action, "package_install")) out = action_package_install_v07(arg, &ok_i);
              else if (!strcmp(action, "package_remove")) out = action_package_remove_v07(arg, &ok_i);
              else if (!strcmp(action, "ldrestart")) out = action_ldrestart_v07(&ok_i);
              else if (!strcmp(action, "userspace_reboot")) out = action_userspace_reboot_v07(&ok_i);
              else if (!strcmp(action, "service_list")) out = action_service_list_v07(&ok_i);
              else if (!strcmp(action, "service_status")) out = na_launchctl_domain_action("status", arg, false, &ok_i);
              else if (!strcmp(action, "service_start")) out = na_launchctl_domain_action("start", arg, false, &ok_i);
              else if (!strcmp(action, "service_restart")) out = na_launchctl_domain_action("restart", arg, false, &ok_i);
              else if (!strcmp(action, "service_stop")) out = na_launchctl_domain_action("stop", arg, false, &ok_i);
              else if (!strcmp(action, "root_stat")) out = action_root_stat_v07(arg, &ok_i);
              else if (!strcmp(action, "root_search")) out = action_root_search_v07(arg, &ok_i);
              else if (!strcmp(action, "root_mkdir")) out = action_root_mkdir_v07(arg, &ok_i);
              else if (!strcmp(action, "root_copy")) out = na_two_path_action("cp", arg, true, &ok_i);
              else if (!strcmp(action, "root_move")) out = na_two_path_action("mv", arg, false, &ok_i);
              else if (!strcmp(action, "root_delete")) out = action_root_delete_v07(arg, &ok_i);
              else if (!strcmp(action, "root_write_text")) out = action_root_write_v07(arg, &ok_i);
              else if (!strcmp(action, "archive_zip")) out = action_archive_v07(arg, false, &ok_i);
              else if (!strcmp(action, "archive_unzip")) out = action_archive_v07(arg, true, &ok_i);
              else if (!strcmp(action, "battery_properties")) out = NABatteryPropertiesJSON(&ok_i);
              else if (!strcmp(action, "read_battery_plist")) out = NAReadBatteryPlistJSON(arg, &ok_i);
              else if (!strcmp(action, "protect_pid")) out = NAProtectProcessJSON((pid_t)atoi(arg), &ok_i);
