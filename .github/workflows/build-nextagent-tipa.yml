      - name: Apply v0.7.1 reliable tool router and force stop
        working-directory: /tmp/nextagent-src/NextAgent_v0.1.0
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/projects/NextAgent/v0.7.1/V071Router.swift" NextAgent/V071Router.swift

          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          p = Path("NextAgent/NextAgent.swift")
          s = p.read_text()

          # Force the app to create a fresh managed-agent session when the tool schema changes.
          s = s.replace(
              '    @Published var messages: [ChatMessage] = [\n        ChatMessage(role: "assistant", text: "Next Agent 0.4.0 is ready. Background turn continuation, improved response controls, and RootHide-native process/storage diagnostics are enabled.")\n    ]',
              '    @Published var messages: [ChatMessage] = [\n        ChatMessage(role: "assistant", text: "Next Agent 0.7.1 is ready with the reliable grouped tool router, local self-test, and Force Stop control.")\n    ]'
          )

          old_props = '''    private var backgroundTask: UIBackgroundTaskIdentifier = .invalid

              private let tools = DeviceToolRegistry()
              private lazy var client = OpenAIManagedAgentsClient(state: self, tools: tools)
          '''
          new_props = '''    private static let currentToolSchemaVersion = "0.7.1-router1"
              private var backgroundTask: UIBackgroundTaskIdentifier = .invalid
              private var activeTurnTask: Task<String, Error>?
              private var activeTurnID: UUID?

              private let tools = DeviceToolRegistry()
              private lazy var client = OpenAIManagedAgentsClient(state: self, tools: tools)

              init() {
                  let defaults = UserDefaults.standard
                  if defaults.string(forKey: "nextagent.toolSchemaVersion") != Self.currentToolSchemaVersion {
                      sessionId = ""
                      defaults.removeObject(forKey: "nextagent.managedSessionId")
                      defaults.removeObject(forKey: "nextagent.pendingTurn")
                      defaults.removeObject(forKey: "nextagent.pendingBaselineAssistantId")
                      defaults.set(Self.currentToolSchemaVersion, forKey: "nextagent.toolSchemaVersion")
                      status = "Tool engine updated — new session ready"
                  }
              }
          '''
          if old_props not in s:
              raise SystemExit("v0.7.1 AppState property marker missing")
          s = s.replace(old_props, new_props, 1)

          # Replace send() with a tracked/cancellable turn.
          start = s.find('    func send() async {')
          end = s.find('    func handleBecameActive() async {', start)
          if start < 0 or end < 0:
              raise SystemExit("v0.7.1 send block bounds missing")

          send_block = '''    func send() async {
                  let text = input.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !text.isEmpty, !busy else { return }
                  guard CredentialStore.loadAPIKey() != nil else {
                      status = "API key missing"
                      return
                  }

                  input = ""
                  messages.append(ChatMessage(role: "user", text: text))
                  busy = true
                  status = "Agent working…"
                  beginBackgroundTurnIfNeeded()

                  let turnID = UUID()
                  let turnTask = Task<String, Error> { [client] in
                      try await client.runUserMessage(text)
                  }
                  activeTurnID = turnID
                  activeTurnTask = turnTask

                  defer {
                      if activeTurnID == turnID {
                          activeTurnTask = nil
                          activeTurnID = nil
                          busy = false
                          endBackgroundTurn()
                      }
                  }

                  do {
                      let reply = try await turnTask.value
                      guard activeTurnID == turnID else { return }
                      messages.append(ChatMessage(role: "assistant", text: reply))
                      status = "Ready"
                  } catch is CancellationError {
                      if activeTurnID == turnID {
                          status = "Stopped"
                      }
                  } catch {
                      guard activeTurnID == turnID else { return }
                      if backgroundContinuation && client.hasPendingTurn {
                          status = "Turn paused — will resume automatically"
                          backgroundState = "Pending"
                      } else {
                          messages.append(ChatMessage(role: "assistant", text: "Error: \\(error.localizedDescription)"))
                          status = "Failed"
                      }
                  }
              }

              func forceStop() {
                  activeTurnTask?.cancel()
                  activeTurnTask = nil
                  activeTurnID = nil
                  busy = false
                  status = "Force stopped — next command will start a fresh session"
                  backgroundState = "Idle"
                  endBackgroundTurn()

                  sessionId = ""
                  let defaults = UserDefaults.standard
                  defaults.removeObject(forKey: "nextagent.managedSessionId")
                  defaults.removeObject(forKey: "nextagent.pendingTurn")
                  defaults.removeObject(forKey: "nextagent.pendingBaselineAssistantId")

                  messages.append(ChatMessage(role: "assistant", text: "Active task force-stopped. The next command will use a fresh tool session."))
              }

              func runLocalSelfTest() async {
                  guard !busy else { return }
                  busy = true
                  status = "Running local tool self-test…"
                  defer { busy = false }

                  let result = await tools.localSelfTest(allowSensitive: sensitiveActions)
                  recordTool("local_self_test", result)
                  messages.append(ChatMessage(role: "assistant", text: "Local tool self-test (bypasses Astra):\\\\n\\\\n\\(result.output)"))
                  status = result.success ? "Local self-test complete" : "Local self-test found failures"
              }

          '''
          s = s[:start] + send_block + s[end:]

          # Track background-resume calls too so Force Stop can cancel them.
          start = s.find('    func resumePendingTurnIfNeeded() async {')
          end = s.find('    private func beginBackgroundTurnIfNeeded()', start)
          if start < 0 or end < 0:
              raise SystemExit("v0.7.1 resume block bounds missing")

          resume_block = '''    func resumePendingTurnIfNeeded() async {
                  guard backgroundContinuation, !busy, client.hasPendingTurn, !sessionId.isEmpty else { return }
                  busy = true
                  status = "Resuming background turn…"
                  beginBackgroundTurnIfNeeded()

                  let turnID = UUID()
                  let turnTask = Task<String, Error> { [client] in
                      try await client.resumePendingTurn()
                  }
                  activeTurnID = turnID
                  activeTurnTask = turnTask

                  defer {
                      if activeTurnID == turnID {
                          activeTurnTask = nil
                          activeTurnID = nil
                          busy = false
                          endBackgroundTurn()
                      }
                  }

                  do {
                      let reply = try await turnTask.value
                      guard activeTurnID == turnID else { return }
                      messages.append(ChatMessage(role: "assistant", text: reply))
                      status = "Ready"
                  } catch is CancellationError {
                      if activeTurnID == turnID { status = "Stopped" }
                  } catch {
                      if activeTurnID == turnID { status = "Background turn pending" }
                  }
              }

          '''
          s = s[:start] + resume_block + s[end:]

          # Use the compact production router rather than exposing 80 individual function schemas.
          old_schema = '    static var toolSchemas: [[String: Any]] { baseToolSchemas + V05ToolSchemas.extra + V07ToolSchemas.extra }'
          if old_schema not in s:
              raise SystemExit("v0.7.1 toolSchemas marker missing")
          s = s.replace(old_schema, '    static var toolSchemas: [[String: Any]] { V071ToolSchemas.grouped }', 1)

          old_default = '''        default:
                      if let v07 = await executeV07(name, arguments: arguments, allowSensitive: allowSensitive) {
                          return v07
                      }
                      if let v05 = await executeV05(name, arguments: arguments, allowSensitive: allowSensitive) {
                          return v05
                      }
                      return ToolResult(success: false, output: "Unknown tool: \\(name)")'''
          new_default = '''        default:
                      if let router = await executeV071(name, arguments: arguments, allowSensitive: allowSensitive) {
                          return router
                      }
                      if let v07 = await executeV07(name, arguments: arguments, allowSensitive: allowSensitive) {
                          return v07
                      }
                      if let v05 = await executeV05(name, arguments: arguments, allowSensitive: allowSensitive) {
                          return v05
                      }
                      return ToolResult(success: false, output: "Unknown tool: \\(name)")'''
          if old_default not in s:
              raise SystemExit("v0.7.1 default executor marker missing")
          s = s.replace(old_default, new_default, 1)

          # Replace the model-facing instructions so Astra uses the grouped router names that are actually exposed.
          a = s.find('    static let agentInstructions = """')
          b = s.find('    """', a + len('    static let agentInstructions = """'))
          if a < 0 or b < 0:
              raise SystemExit("agentInstructions block not found")
          b += len('    """')
          instructions = '''    static let agentInstructions = """
              You are Next Agent, controlling the user's own jailbroken iPhone through explicit local phone tools.

              The exposed tools are grouped routers:
              - phone_status: device/root/jailbreak/process/network/storage/battery/HID/package diagnostics and self_test.
              - phone_apps: list/open apps, open by display name, open sequences, and URLs.
              - phone_screen: capture/OCR/describe/find visible text/tap visible text/wait for text.
              - phone_input: tap, double tap, long press, swipe, type text, keyboard keys, hardware-style buttons, Home/Back, Control Center, Notification Center, wake and lock.
              - phone_files: root-visible list/read/info/search plus guarded create/write/copy/move/delete/zip/unzip.
              - phone_packages: package list/install/remove.
              - phone_services: launchd list/status/start/stop/restart plus uicache, respring, ldrestart, userspace reboot and process termination.
              - phone_automation: record/save/list/run/delete reusable flows or run immediate local multi-step sequences.
              - phone_clipboard: get/set clipboard text.
              - phone_display: get/set brightness.

              Use tools when the request requires phone interaction. Report only actual tool results and never claim success without a successful result.
              Prefer phone_screen describe/find_text before guessing coordinates. For multi-step UI control, prefer phone_automation action=run_steps so steps execute locally while another app is foregrounded.
              Never request, reveal, type, store or inspect passwords, passcodes, authentication tokens, private keys, banking/payment credentials, Keychain contents, or private communications.
              Do not tap purchase, payment, send, authentication, delete, package install/remove, root write/delete, service changes, respring/ldrestart/userspace reboot, lock/power, or similarly consequential controls unless the user explicitly authorized that exact action in the current request.
              If Sensitive Actions are disabled, explain that the user can enable them in Next Agent Settings; do not bypass the switch.
              Keep user-visible replies compact and phone-friendly. Avoid wide Markdown tables and fenced code blocks unless explicitly requested.
              """'''
          s = s[:a] + instructions + s[b:]

          s = s.replace('"client_version": "0.7.0"', '"client_version": "0.7.1"')

          # Cancellation should be honored immediately after creating or posting to a managed session.
          s = s.replace(
              '            let created = try await createSession(initialMessage: message)\n            guard let id = created["id"] as? String, !id.isEmpty else {',
              '            let created = try await createSession(initialMessage: message)\n            try Task.checkCancellation()\n            guard let id = created["id"] as? String, !id.isEmpty else {',
              1
          )
          s = s.replace(
              '            try await sendUserMessage(sessionId: state.sessionId, text: message)\n        }',
              '            try await sendUserMessage(sessionId: state.sessionId, text: message)\n            try Task.checkCancellation()\n        }',
              1
          )

          p.write_text(s)

          project = Path("project.yml")
          y = project.read_text().replace("MARKETING_VERSION: 0.7.0", "MARKETING_VERSION: 0.7.1").replace("CURRENT_PROJECT_VERSION: 8", "CURRENT_PROJECT_VERSION: 9")
          project.write_text(y)

          plist_path = Path("NextAgent/Info.plist")
          d = plistlib.loads(plist_path.read_bytes())
          d["CFBundleShortVersionString"] = "0.7.3"
          d["CFBundleVersion"] = "11"
          plist_path.write_bytes(plistlib.dumps(d))

          assert "V071ToolSchemas.grouped" in p.read_text()
          assert "func forceStop()" in p.read_text()
          assert "func runLocalSelfTest()" in p.read_text()
          assert "MARKETING_VERSION: 0.7.1" in project.read_text()
          PY

          grep -q 'V071ToolSchemas.grouped' NextAgent/NextAgent.swift
          grep -q 'func forceStop()' NextAgent/NextAgent.swift
          grep -q 'func runLocalSelfTest()' NextAgent/NextAgent.swift
          grep -q 'MARKETING_VERSION: 0.7.1' project.yml

      - name: Apply v0.7.2 jailbreak-native background pin
        working-directory: /tmp/nextagent-src/NextAgent_v0.1.0
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/projects/NextAgent/v0.7.2/NABackgroundAssertion.h" NextAgent/NABackgroundAssertion.h
          cp "$GITHUB_WORKSPACE/projects/NextAgent/v0.7.2/NABackgroundAssertion.m" NextAgent/NABackgroundAssertion.m
          cp "$GITHUB_WORKSPACE/projects/NextAgent/v0.7.2/NextAgent-Bridging-Header.h" NextAgent/NextAgent-Bridging-Header.h

          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          p = Path("NextAgent/NextAgent.swift")
          s = p.read_text()

          s = s.replace(
              'Next Agent 0.7.1 is ready with the reliable grouped tool router, local self-test, and Force Stop control.',
              'Next Agent 0.7.2 is ready with jailbreak-native background pinning for multi-app automation.'
          )

          s = s.replace(
              'private static let currentToolSchemaVersion = "0.7.1-router1"',
              'private static let currentToolSchemaVersion = "0.7.2-bgpin1"'
          )

          start = s.find('    private func beginBackgroundTurnIfNeeded() {')
          end = s.find('    func checkRootHelper()', start)
          if start < 0 or end < 0:
              raise SystemExit("v0.7.2 background block bounds missing")

          replacement = '''    private func beginBackgroundTurnIfNeeded() {
                  guard backgroundContinuation else { return }

                  let pinned = NABackgroundAssertionController.shared().start()
                  let extended = BackgroundKeepAlive.shared.start()

                  if pinned {
                      backgroundState = "Pinned background"
                  } else if extended {
                      backgroundState = "Extended background"
                  } else {
                      backgroundState = "Protected"
                  }

                  if backgroundTask == .invalid {
                      backgroundTask = UIApplication.shared.beginBackgroundTask(withName: "NextAgentTurn") { [weak self] in
                          Task { @MainActor in
                              guard let self else { return }

                              // The ordinary UIKit assertion has expired. End only that assertion.
                              // Keep the jailbreak-native BKS assertion and audio fallback alive until
                              // the agent turn actually finishes or the user presses Force Stop.
                              self.endUIKitBackgroundTaskOnly()

                              if NABackgroundAssertionController.shared().isValid {
                                  self.backgroundState = "Pinned background"
                              } else if BackgroundKeepAlive.shared.active {
                                  self.backgroundState = "Extended background"
                              } else {
                                  self.backgroundState = "Background protection lost"
                              }
                          }
                      }
                  }
              }

              private func endUIKitBackgroundTaskOnly() {
                  if backgroundTask != .invalid {
                      UIApplication.shared.endBackgroundTask(backgroundTask)
                      backgroundTask = .invalid
                  }
              }

              private func endBackgroundTurn() {
                  endUIKitBackgroundTaskOnly()
                  BackgroundKeepAlive.shared.stop()
                  NABackgroundAssertionController.shared().stop()
                  if !client.hasPendingTurn {
                      backgroundState = "Idle"
                  }
              }

          '''
          s = s[:start] + replacement + s[end:]

          # Strengthen the model instructions for tasks like:
          # open Notes -> create note -> type story.
          anchor = 'Use tools when the request requires phone interaction. Report only actual tool results and never claim success without a successful result.'
          extra = anchor + '\n              Opening an app is NOT completion when the user asked to do something inside that app. After opening the target app, continue the same turn with phone_screen and phone_input until every requested step is completed or a tool returns a real failure. For example, "open Notes, create a note, and type text" must continue after Notes launches: inspect the Notes screen, locate/create the note, focus the editor, type the requested text, then verify the visible result before reporting success.'
          if anchor not in s:
              raise SystemExit("v0.7.2 agent instruction anchor missing")
          s = s.replace(anchor, extra, 1)

          s = s.replace('"client_version": "0.7.1"', '"client_version": "0.7.2"')

          # Include the native process-assertion result in direct self-test output.
          old = '''              func runLocalSelfTest() async {
                  guard !busy else { return }
                  busy = true
                  status = "Running local tool self-test…"
                  defer { busy = false }

                  let result = await tools.localSelfTest(allowSensitive: sensitiveActions)
                  recordTool("local_self_test", result)
                  messages.append(ChatMessage(role: "assistant", text: "Local tool self-test (bypasses Astra):\\n\\n\\(result.output)"))
                  status = result.success ? "Local self-test complete" : "Local self-test found failures"
              }
          '''
          if old in s:
              new = '''              func runLocalSelfTest() async {
                  guard !busy else { return }
                  busy = true
                  status = "Running local tool self-test…"
                  defer { busy = false }

                  let backgroundController = NABackgroundAssertionController.shared()
                  let pinned = backgroundController.start()
                  let backgroundStatus = backgroundController.status
                  backgroundController.stop()

                  let result = await tools.localSelfTest(allowSensitive: sensitiveActions)
                  recordTool("local_self_test", result)
                  messages.append(ChatMessage(
                      role: "assistant",
                      text: "Background pin: \\(pinned ? "PASS" : "FAIL") — \\(backgroundStatus)\\n\\nLocal tool self-test (bypasses Astra):\\n\\n\\(result.output)"
                  ))
                  status = result.success && pinned ? "Local self-test complete" : "Local self-test found failures"
              }
          '''
              s = s.replace(old, new, 1)

          p.write_text(s)

          project = Path("project.yml")
          y = project.read_text()
          y = y.replace("MARKETING_VERSION: 0.7.1", "MARKETING_VERSION: 0.7.2")
          y = y.replace("CURRENT_PROJECT_VERSION: 9", "CURRENT_PROJECT_VERSION: 10")
          if "SWIFT_OBJC_BRIDGING_HEADER" not in y:
              y = y.replace(
                  "        ENABLE_USER_SCRIPT_SANDBOXING: NO\n",
                  "        ENABLE_USER_SCRIPT_SANDBOXING: NO\n        SWIFT_OBJC_BRIDGING_HEADER: NextAgent/NextAgent-Bridging-Header.h\n"
              )
          project.write_text(y)

          plist_path = Path("NextAgent/Info.plist")
          d = plistlib.loads(plist_path.read_bytes())
          d["CFBundleShortVersionString"] = "0.7.3"
          d["CFBundleVersion"] = "11"
          plist_path.write_bytes(plistlib.dumps(d))

          assert "NABackgroundAssertionController" in p.read_text()
          assert "0.7.2-bgpin1" in p.read_text()
          assert "SWIFT_OBJC_BRIDGING_HEADER" in project.read_text()
          PY

          grep -q 'NABackgroundAssertionController' NextAgent/NextAgent.swift
          grep -q 'SWIFT_OBJC_BRIDGING_HEADER' project.yml
          grep -q 'MARKETING_VERSION: 0.7.2' project.yml

