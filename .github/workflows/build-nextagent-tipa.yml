name: Build Next Agent TIPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "projects/NextAgent/source.b64.part-*"
      - "projects/NextAgent/v0.2-managed-agent.patch.part-*"
      - "projects/NextAgent/v0.2.1-credential-persistence.patch"
      - "projects/NextAgent/v0.3-root-daemon.patch"
      - "projects/NextAgent/v0.3.1-app-root-access.patch"
      - "projects/NextAgent/v0.4-background-ui.patch"
      - "projects/NextAgent/v0.4-appswitch-resilience.patch"
      - "projects/NextAgent/daemon/**"
      - ".github/workflows/build-nextagent-tipa.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Restore source baseline
        run: |
          set -euo pipefail
          rm -rf /tmp/nextagent-src /tmp/nextagent.zip
          mkdir -p /tmp/nextagent-src
          cat projects/NextAgent/source.b64.part-* | base64 --decode > /tmp/nextagent.zip
          unzip -q /tmp/nextagent.zip -d /tmp/nextagent-src
          test -f /tmp/nextagent-src/NextAgent_v0.1.0/project.yml

      - name: Apply prior updates
        working-directory: /tmp/nextagent-src/NextAgent_v0.1.0
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NextAgent/NextAgent.swift")
          s = p.read_text()
          old = """        var uts = utsname(); uname(&uts)
                  let machine = withUnsafePointer(to: &uts.machine) { p in
                      p.withMemoryRebound(to: CChar.self, capacity: MemoryLayout.size(ofValue: uts.machine)) { String(cString: $0) }
                  }
          """
          new = """        var uts = utsname(); uname(&uts)
                  let machineCapacity = MemoryLayout.size(ofValue: uts.machine)
                  let machine = withUnsafePointer(to: &uts.machine) { p in
                      p.withMemoryRebound(to: CChar.self, capacity: machineCapacity) { String(cString: $0) }
                  }
          """
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          cat "$GITHUB_WORKSPACE"/projects/NextAgent/v0.2-managed-agent.patch.part-* > /tmp/nextagent-v02.patch
          patch -p0 < /tmp/nextagent-v02.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path("project.yml")
          s=p.read_text().replace("MARKETING_VERSION: 0.1.0","MARKETING_VERSION: 0.2.0").replace("CURRENT_PROJECT_VERSION: 1","CURRENT_PROJECT_VERSION: 2")
          p.write_text(s)
          PY
          patch -p0 < "$GITHUB_WORKSPACE/projects/NextAgent/v0.2.1-credential-persistence.patch"
          patch -p0 --fuzz=3 < "$GITHUB_WORKSPACE/projects/NextAgent/v0.3-root-daemon.patch"
          python3 - <<'PY'
          from pathlib import Path

          p = Path("NextAgent/NextAgent.swift")
          s = p.read_text()
          s = s.replace(
              "Next Agent 0.3.0 is ready with your GPT-6 Astra managed agent and optional root helper daemon.",
              "Next Agent 0.3.1 is ready with your GPT-6 Astra managed agent and RootHide root helper."
          )
          s = s.replace(
              '    private static let tokenPath = "/var/mobile/Library/NextAgent/daemon.token"\n',
              '    private static let tokenPaths = [\n'
              '        "/var/mobile/Library/NextAgent/daemon.token",\n'
              '        "/private/var/mobile/Library/NextAgent/daemon.token"\n'
              '    ]\n'
          )
          old = '''        guard let rawToken = try? String(contentsOfFile: tokenPath, encoding: .utf8) else {
                      return ToolResult(success: false, output: "Root helper token is unavailable. Install the matching NextAgentDaemon 0.3.0 package and ensure nextagentd is loaded.")
                  }
          '''
          new = '''        let tokenLoad = loadToken()
                  guard let rawToken = tokenLoad.token else {
                      return ToolResult(success: false, output: "Root helper token is unavailable. " + tokenLoad.detail)
                  }
          '''
          if old not in s:
              raise SystemExit("expected old token loader block not found")
          s = s.replace(old, new, 1)
          marker = '''        return ToolResult(success: parts[0] == "OK", output: output)
              }

              private static func writeAll(fd: Int32, data: Data) -> Bool {
          '''
          insert = '''        return ToolResult(success: parts[0] == "OK", output: output)
              }

              private static func loadToken() -> (token: String?, detail: String) {
                  var diagnostics: [String] = []
                  for path in tokenPaths {
                      errno = 0
                      let fd = Darwin.open(path, O_RDONLY)
                      if fd < 0 {
                          diagnostics.append("\\(path): open failed errno=\\(errno) (\\(String(cString: strerror(errno))))")
                          continue
                      }

                      var buffer = [UInt8](repeating: 0, count: 128)
                      errno = 0
                      let n = Darwin.read(fd, &buffer, buffer.count - 1)
                      let readErrno = errno
                      Darwin.close(fd)

                      if n <= 0 {
                          diagnostics.append("\\(path): read failed errno=\\(readErrno) (\\(String(cString: strerror(readErrno))))")
                          continue
                      }
                      let data = Data(buffer.prefix(Int(n)))
                      guard let text = String(data: data, encoding: .utf8) else {
                          diagnostics.append("\\(path): token was not UTF-8")
                          continue
                      }
                      let token = text.trimmingCharacters(in: .whitespacesAndNewlines)
                      if token.count == 64 {
                          return (token, "read from \\(path)")
                      }
                      diagnostics.append("\\(path): unexpected token length \\(token.count)")
                  }
                  return (nil, diagnostics.joined(separator: " | "))
              }

              private static func writeAll(fd: Int32, data: Data) -> Bool {
          '''
          if marker not in s:
              raise SystemExit("root daemon client insertion marker not found")
          s = s.replace(marker, insert, 1)
          p.write_text(s)

          ent = Path("NextAgent/NextAgent.entitlements")
          ent.write_text("""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
              <key>com.apple.private.security.no-container</key>
              <true/>
              <key>com.apple.private.security.container-required</key>
              <false/>
              <key>com.apple.private.security.storage.AppBundles</key>
              <true/>
              <key>com.apple.private.security.storage.AppDataContainers</key>
              <true/>
              <key>com.apple.private.security.storage.MobileDocuments</key>
              <true/>
          </dict>
          </plist>
          """)

          proj = Path("project.yml")
          y = proj.read_text().replace("MARKETING_VERSION: 0.3.0", "MARKETING_VERSION: 0.3.1").replace("CURRENT_PROJECT_VERSION: 4", "CURRENT_PROJECT_VERSION: 5")
          proj.write_text(y)
          PY
          grep -q 'MARKETING_VERSION: 0.3.1' project.yml
          patch -p0 --fuzz=3 < "$GITHUB_WORKSPACE/projects/NextAgent/v0.4-background-ui.patch"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NextAgent/NextAgent.swift")
          s = p.read_text()

          old = '''        } catch {
                      messages.append(ChatMessage(role: "assistant", text: "Error: \\(error.localizedDescription)"))
                      status = "Failed"
                  }
              }

              func resumePendingTurnIfNeeded() async {
          '''
          new = '''        } catch {
                      if backgroundContinuation && client.hasPendingTurn {
                          status = "Turn paused — will resume automatically"
                          backgroundState = "Pending"
                      } else {
                          messages.append(ChatMessage(role: "assistant", text: "Error: \\(error.localizedDescription)"))
                          status = "Failed"
                      }
                  }
              }

              func handleBecameActive() async {
                  guard backgroundContinuation else { return }
                  for _ in 0..<20 {
                      if !client.hasPendingTurn { backgroundState = "Idle"; return }
                      if !busy { await resumePendingTurnIfNeeded(); return }
                      try? await Task.sleep(nanoseconds: 500_000_000)
                  }
              }

              func resumePendingTurnIfNeeded() async {
          '''
          if old not in s:
              raise SystemExit("v0.4 send/resume marker not found")
          s = s.replace(old, new, 1)

          old = '''    private let base = URL(string: "https://api.openai.com/v1/agents/")!
              private let savedAgentId = "agent_a8bca3810e67406a8076559d2ba2e10f1379810a596e4d3082"

              init(state: AppState, tools: DeviceToolRegistry) {
          '''
          new = '''    private let base = URL(string: "https://api.openai.com/v1/agents/")!
              private let savedAgentId = "agent_a8bca3810e67406a8076559d2ba2e10f1379810a596e4d3082"
              private lazy var urlSession: URLSession = {
                  let config = URLSessionConfiguration.default
                  config.waitsForConnectivity = true
                  config.timeoutIntervalForRequest = 120
                  config.timeoutIntervalForResource = 300
                  return URLSession(configuration: config)
              }()

              init(state: AppState, tools: DeviceToolRegistry) {
          '''
          if old not in s:
              raise SystemExit("v0.4 client marker not found")
          s = s.replace(old, new, 1)

          start = s.find('        let (data, response) = try await URLSession.shared.data(for: req)')
          if start < 0:
              raise SystemExit("v0.4 requestData start marker not found")
          end_marker = '        return data'
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit("v0.4 requestData end marker not found")
          end += len(end_marker)
          new = '''        var lastError: Error?
              for attempt in 0..<4 {
                  do {
                      let (data, response) = try await urlSession.data(for: req)
                      guard let http = response as? HTTPURLResponse else { throw NSError(domain: "NextAgent", code: 0) }
                      guard (200..<300).contains(http.statusCode) else {
                          let text = String(data: data, encoding: .utf8) ?? "HTTP \\(http.statusCode)"
                          throw NSError(domain: "NextAgent", code: http.statusCode, userInfo: [NSLocalizedDescriptionKey: text])
                      }
                      return data
                  } catch let e as URLError where [.networkConnectionLost, .timedOut, .notConnectedToInternet, .cannotConnectToHost, .cannotFindHost, .dnsLookupFailed].contains(e.code) {
                      lastError = e
                      if attempt < 3 {
                          try? await Task.sleep(nanoseconds: UInt64(500_000_000 * (attempt + 1)))
                          continue
                      }
                  } catch {
                      throw error
                  }
              }
              throw lastError ?? URLError(.networkConnectionLost)'''
          s = s[:start] + new + s[end:]

          s = s.replace(
              '    For user-visible answers in this iPhone app, use short headings and bullets. Avoid Markdown tables and fenced code blocks unless the user explicitly asks for them because the phone display is narrow.\n',
              '    When the user asks to open two or more apps, always use open_apps_sequence once with the complete bundle-ID list instead of repeated open_app calls. This prevents foreground app switching from interrupting the managed-agent turn.\n    For user-visible answers in this iPhone app, use short headings and bullets. Avoid Markdown tables and fenced code blocks unless the user explicitly asks for them because the phone display is narrow.\n',
              1
          )

          old = '        tool("open_app", "Open an installed app by bundle identifier using LaunchServices when available.", ["bundle_id": str("Bundle identifier")], required: ["bundle_id"]),\n'
          new = '        tool("open_app", "Open one installed app by bundle identifier using LaunchServices when available.", ["bundle_id": str("Bundle identifier")], required: ["bundle_id"]),\n        tool("open_apps_sequence", "Open multiple installed apps in one background-safe sequence. Always use this for requests involving two or more apps.", ["bundle_ids": ["type": "array", "items": ["type": "string"], "minItems": 2, "maxItems": 10, "description": "Bundle identifiers in opening order"], "delay_seconds": num("Delay between launches, 0.5 to 5 seconds")], required: ["bundle_ids"]),\n'
          if old not in s:
              raise SystemExit("v0.4 open_app schema marker not found")
          s = s.replace(old, new, 1)

          old = '        case "open_app": return openApp(arguments)\n'
          new = '        case "open_app": return openApp(arguments)\n        case "open_apps_sequence": return await openAppsSequence(arguments)\n'
          s = s.replace(old, new, 1)

          marker = '''    private func openURL(_ args: [String: Any]) -> ToolResult {
          '''
          insert = '''    @MainActor
              private func openAppsSequence(_ args: [String: Any]) async -> ToolResult {
                  guard let bundleIDs = args["bundle_ids"] as? [String], bundleIDs.count >= 2, bundleIDs.count <= 10 else { return badArgs() }
                  let delay = max(0.5, min(5.0, (args["delay_seconds"] as? NSNumber)?.doubleValue ?? 1.5))
                  var opened: [String] = []
                  var failures: [String] = []
                  for (index, bid) in bundleIDs.enumerated() {
                      let result = openApp(["bundle_id": bid])
                      if result.success { opened.append(bid) } else { failures.append("\\(bid): \\(result.output)") }
                      if index < bundleIDs.count - 1 {
                          try? await Task.sleep(nanoseconds: UInt64(delay * 1_000_000_000))
                      }
                  }
                  let payload: [String: Any] = ["requested": bundleIDs, "opened": opened, "failures": failures, "delay_seconds": delay]
                  return jsonResult(payload, success: failures.isEmpty)
              }

              private func openURL(_ args: [String: Any]) -> ToolResult {
          '''
          if marker not in s:
              raise SystemExit("v0.4 openURL marker not found")
          s = s.replace(marker, insert, 1)

          old = '''            if phase == .active {
                          Task { await state.resumePendingTurnIfNeeded() }
                      }
          '''
          new = '''            if phase == .active {
                          Task { await state.handleBecameActive() }
                      } else if phase == .background && state.busy {
                          state.backgroundState = "Background"
                      }
          '''
          if old not in s:
              raise SystemExit("v0.4 scene phase marker not found")
          s = s.replace(old, new, 1)

          s = s.replace(
              '                    Text("Background continuation protects an active turn when you switch apps and automatically resumes a durable managed-agent session when Next Agent becomes active again. iOS can still suspend the UI process after its background execution window.")',
              '                    Text("Background continuation protects active turns during app switching, retries transient network interruptions, and automatically resumes the durable managed-agent session when Next Agent becomes active again. Multi-app requests use one local sequence so the first launch does not break the remaining actions.")',
              1
          )

          p.write_text(s)
          PY
          grep -q 'MARKETING_VERSION: 0.4.0' project.yml
          grep -q 'open_apps_sequence' NextAgent/NextAgent.swift
          grep -q 'RootDaemonClient' NextAgent/NextAgent.swift
          grep -q 'gpt-6-astra' NextAgent/NextAgent.swift

      - name: Force and verify TrollStore app entitlements
        working-directory: /tmp/nextagent-src/NextAgent_v0.1.0
        run: |
          set -euo pipefail
          cat > NextAgent/NextAgent.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
              <key>com.apple.private.security.no-container</key>
              <true/>
              <key>com.apple.private.security.container-required</key>
              <false/>
              <key>com.apple.private.security.storage.AppBundles</key>
              <true/>
              <key>com.apple.private.security.storage.AppDataContainers</key>
              <true/>
              <key>com.apple.private.security.storage.MobileDocuments</key>
              <true/>
          </dict>
          </plist>
          EOF
          /usr/bin/plutil -lint NextAgent/NextAgent.entitlements
          grep -q 'platform-application' NextAgent/NextAgent.entitlements
          grep -q 'no-sandbox' NextAgent/NextAgent.entitlements

      - name: Install build tools
        run: brew install xcodegen dpkg ldid-procursus

      - name: Generate app project
        working-directory: /tmp/nextagent-src/NextAgent_v0.1.0
        run: xcodegen generate

      - name: Restore TrollStore entitlements after XcodeGen
        working-directory: /tmp/nextagent-src/NextAgent_v0.1.0
        run: |
          set -euo pipefail
          cat > NextAgent/NextAgent.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
              <key>com.apple.private.security.no-container</key>
              <true/>
              <key>com.apple.private.security.container-required</key>
              <false/>
              <key>com.apple.private.security.storage.AppBundles</key>
              <true/>
              <key>com.apple.private.security.storage.AppDataContainers</key>
              <true/>
              <key>com.apple.private.security.storage.MobileDocuments</key>
              <true/>
          </dict>
          </plist>
          EOF
          /usr/bin/plutil -lint NextAgent/NextAgent.entitlements
          grep -q 'platform-application' NextAgent/NextAgent.entitlements
          grep -q 'no-sandbox' NextAgent/NextAgent.entitlements

      - name: Build unsigned app
        working-directory: /tmp/nextagent-src/NextAgent_v0.1.0
        run: |
          set -o pipefail
          xcodebuild             -project NextAgent.xcodeproj             -scheme NextAgent             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             clean build 2>&1 | tee /tmp/nextagent-xcodebuild-v030.log

      - name: Build root daemon arm64
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang             -arch arm64             -isysroot "$SDK"             -miphoneos-version-min=16.0             -Os -Wall -Wextra             "$GITHUB_WORKSPACE/projects/NextAgent/daemon/nextagentd.c"             -o /tmp/nextagentd
          /usr/bin/codesign --force --sign -             --entitlements "$GITHUB_WORKSPACE/projects/NextAgent/daemon/nextagentd.entitlements"             /tmp/nextagentd
          file /tmp/nextagentd
          /usr/bin/codesign -d --entitlements :- /tmp/nextagentd > /tmp/nextagentd-entitlements.plist 2>&1 || true

      - name: Package TrollStore app
        working-directory: /tmp/nextagent-src/NextAgent_v0.1.0
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Next Agent.app"
          test -d "$APP"
          EXEC="$APP/Next Agent"
          ENT="$PWD/NextAgent/NextAgent.entitlements"
          echo "--- entitlement input ---"
          cat "$ENT"
          echo "--- ldid binary ---"
          command -v ldid
          ldid 2>&1 | head -3 || true
          ldid -r "$EXEC" >/dev/null 2>&1 || true
          ldid -S "$EXEC"
          ldid -M -S"$ENT" "$EXEC"
          ldid -e "$EXEC" > /tmp/nextagent-final-entitlements.plist
          cat /tmp/nextagent-final-entitlements.plist
          grep -q 'platform-application' /tmp/nextagent-final-entitlements.plist
          grep -q 'com.apple.private.security.no-sandbox' /tmp/nextagent-final-entitlements.plist
          grep -q 'com.apple.private.security.no-container' /tmp/nextagent-final-entitlements.plist
          rm -rf package
          mkdir -p package/Payload
          cp -R "$APP" package/Payload/
          mkdir -p "$GITHUB_WORKSPACE/projects/NextAgent/build-output"
          (cd package && /usr/bin/zip -qry "$GITHUB_WORKSPACE/projects/NextAgent/build-output/NextAgent-0.4.0.tipa" Payload)
          shasum -a 256 "$GITHUB_WORKSPACE/projects/NextAgent/build-output/NextAgent-0.4.0.tipa" | awk '{print $1}' > "$GITHUB_WORKSPACE/projects/NextAgent/build-output/NextAgent-0.4.0.sha256"
          cp /tmp/nextagent-xcodebuild-v030.log "$GITHUB_WORKSPACE/projects/NextAgent/build-output/xcodebuild-v0.4.0.log"
          cp /tmp/nextagent-final-entitlements.plist "$GITHUB_WORKSPACE/projects/NextAgent/build-output/app-entitlements-v0.4.0.plist"
          unzip -t "$GITHUB_WORKSPACE/projects/NextAgent/build-output/NextAgent-0.4.0.tipa"

      - name: Package rootless daemon DEB
        run: |
          set -euo pipefail
          P=/tmp/pkg-rootless
          rm -rf "$P"
          mkdir -p "$P/DEBIAN" "$P/var/jb/usr/local/libexec" "$P/var/jb/Library/LaunchDaemons"
          cp /tmp/nextagentd "$P/var/jb/usr/local/libexec/nextagentd"
          cp projects/NextAgent/daemon/uk.zeshanbarvi.nextagentd.rootless.plist "$P/var/jb/Library/LaunchDaemons/uk.zeshanbarvi.nextagentd.plist"
          chmod 0755 "$P/var/jb/usr/local/libexec/nextagentd"
          cat > "$P/DEBIAN/control" <<'EOF'
          Package: uk.zeshanbarvi.nextagentd
          Name: Next Agent Root Helper
          Version: 0.3.0
          Architecture: iphoneos-arm64
          Section: Utilities
          Priority: optional
          Maintainer: Next Jailbreak
          Author: Next Jailbreak
          Description: Privileged root helper for Next Agent 0.3.0 (rootless /var/jb jailbreaks).
          EOF
          cat > "$P/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          BIN=/var/jb/usr/local/libexec/nextagentd
          PLIST=/var/jb/Library/LaunchDaemons/uk.zeshanbarvi.nextagentd.plist
          chmod 755 "$BIN" || true
          chown root:wheel "$BIN" "$PLIST" 2>/dev/null || true
          mkdir -p /var/mobile/Library/NextAgent
          chown mobile:mobile /var/mobile/Library/NextAgent 2>/dev/null || true
          chmod 700 /var/mobile/Library/NextAgent 2>/dev/null || true
          if command -v ldid >/dev/null 2>&1; then ldid -S "$BIN" >/dev/null 2>&1 || true; fi
          launchctl bootout system/uk.zeshanbarvi.nextagentd >/dev/null 2>&1 || true
          launchctl bootstrap system "$PLIST" >/dev/null 2>&1 || launchctl load "$PLIST" >/dev/null 2>&1 || true
          exit 0
          EOF
          cat > "$P/DEBIAN/prerm" <<'EOF'
          #!/bin/sh
          launchctl bootout system/uk.zeshanbarvi.nextagentd >/dev/null 2>&1 || true
          launchctl unload /var/jb/Library/LaunchDaemons/uk.zeshanbarvi.nextagentd.plist >/dev/null 2>&1 || true
          exit 0
          EOF
          chmod 0755 "$P/DEBIAN/postinst" "$P/DEBIAN/prerm"
          dpkg-deb --root-owner-group --build "$P" "$GITHUB_WORKSPACE/projects/NextAgent/build-output/NextAgentDaemon-0.3.0-rootless.deb"
          shasum -a 256 "$GITHUB_WORKSPACE/projects/NextAgent/build-output/NextAgentDaemon-0.3.0-rootless.deb" | awk '{print $1}' > "$GITHUB_WORKSPACE/projects/NextAgent/build-output/NextAgentDaemon-0.3.0-rootless.sha256"

      - name: Package RootHide daemon DEB
        run: |
          set -euo pipefail
          P=/tmp/pkg-roothide
          rm -rf "$P"
          mkdir -p "$P/DEBIAN" "$P/usr/local/libexec" "$P/Library/LaunchDaemons"
          cp /tmp/nextagentd "$P/usr/local/libexec/nextagentd"
          cp projects/NextAgent/daemon/uk.zeshanbarvi.nextagentd.roothide.plist "$P/Library/LaunchDaemons/uk.zeshanbarvi.nextagentd.plist"
          mkdir -p "$P/usr/local/share/nextagent"
          cp projects/NextAgent/daemon/nextagentd.entitlements "$P/usr/local/share/nextagent/nextagentd.entitlements"
          chmod 0755 "$P/usr/local/libexec/nextagentd"
          cat > "$P/DEBIAN/control" <<'EOF'
          Package: uk.zeshanbarvi.nextagentd.roothide
          Name: Next Agent Root Helper (RootHide)
          Version: 0.4.0
          Architecture: iphoneos-arm64e
          Section: Utilities
          Priority: optional
          Maintainer: Next Jailbreak
          Author: Next Jailbreak
          Description: Privileged root helper for Next Agent 0.4.0, packaged for RootHide randomized jbroot.
          EOF
          cat > "$P/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          BIN=/usr/local/libexec/nextagentd
          PLIST=/Library/LaunchDaemons/uk.zeshanbarvi.nextagentd.plist
          ENT=/usr/local/share/nextagent/nextagentd.entitlements
          REALDIR=/rootfs/var/mobile/Library/NextAgent
          chmod 755 "$BIN" || true
          chown root:wheel "$BIN" "$PLIST" "$ENT" 2>/dev/null || true
          mkdir -p "$REALDIR" 2>/dev/null || true
          chown mobile:mobile "$REALDIR" 2>/dev/null || true
          chmod 700 "$REALDIR" 2>/dev/null || true

          if command -v ldid >/dev/null 2>&1; then
            ldid -S"$ENT" "$BIN" >/dev/null 2>&1 || true
          fi
          launchctl bootout system/uk.zeshanbarvi.nextagentd >/dev/null 2>&1 || true
          launchctl bootstrap system "$PLIST" >"$REALDIR/bootstrap.log" 2>&1 || launchctl load "$PLIST" >>"$REALDIR/bootstrap.log" 2>&1 || true
          launchctl kickstart -k system/uk.zeshanbarvi.nextagentd >>"$REALDIR/bootstrap.log" 2>&1 || true
          launchctl print system/uk.zeshanbarvi.nextagentd >"$REALDIR/launchctl.txt" 2>&1 || true
          chown mobile:mobile "$REALDIR/bootstrap.log" "$REALDIR/launchctl.txt" 2>/dev/null || true
          exit 0
          EOF
          cat > "$P/DEBIAN/prerm" <<'EOF'
          #!/bin/sh
          launchctl bootout system/uk.zeshanbarvi.nextagentd >/dev/null 2>&1 || true
          launchctl unload /Library/LaunchDaemons/uk.zeshanbarvi.nextagentd.plist >/dev/null 2>&1 || true
          exit 0
          EOF
          chmod 0755 "$P/DEBIAN/postinst" "$P/DEBIAN/prerm"
          dpkg-deb --root-owner-group --build "$P" "$GITHUB_WORKSPACE/projects/NextAgent/build-output/NextAgentDaemon-0.4.0-roothide.deb"
          shasum -a 256 "$GITHUB_WORKSPACE/projects/NextAgent/build-output/NextAgentDaemon-0.4.0-roothide.deb" | awk '{print $1}' > "$GITHUB_WORKSPACE/projects/NextAgent/build-output/NextAgentDaemon-0.4.0-roothide.sha256"

