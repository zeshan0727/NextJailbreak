name: Temporary Location Spoofer WiFi-IP Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: xweiba/location-spoofer
          ref: v1.0.8
          path: location-spoofer

      - name: Patch Wi-Fi proxy listener and auto-profile
        working-directory: location-spoofer
        run: |
          cp ../host/LocationSpooferBuild/patch_proxy.py ./patch_proxy.py
          python3 ./patch_proxy.py
          rm ./patch_proxy.py

      - name: Checkout build patch
        uses: actions/checkout@v4
        with:
          path: host
          sparse-checkout: |
            LocationSpooferBuild/patch_proxy.py
          sparse-checkout-cone-mode: false

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        working-directory: location-spoofer
        run: ./build.sh

      - name: Validate IPA
        working-directory: location-spoofer
        run: |
          set -euo pipefail
          test -s dist/PaopaoLocationSpoofer-unsigned.ipa
          unzip -t dist/PaopaoLocationSpoofer-unsigned.ipa >/dev/null
          unzip -l dist/PaopaoLocationSpoofer-unsigned.ipa | grep -E 'Payload/.+\.app/Info.plist'

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: Location-Spoofer-1.0.8-WiFiIP-unsigned
          path: location-spoofer/dist/PaopaoLocationSpoofer-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
