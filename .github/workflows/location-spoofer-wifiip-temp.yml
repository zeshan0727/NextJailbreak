name: Temporary Location Spoofer WiFi-IP Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: xweiba/location-spoofer
          ref: v1.0.8
          path: location-spoofer

      - name: Patch proxy listener for Wi-Fi interface
        working-directory: location-spoofer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Core/proxy.go")
          s = p.read_text()
          old = 'net.Listen("tcp", fmt.Sprintf("127.0.0.1:%d", proxyPort))'
          new = 'net.Listen("tcp", fmt.Sprintf("0.0.0.0:%d", proxyPort))'
          if old not in s:
              raise SystemExit("proxy listener pattern not found")
          s = s.replace(old, new, 1)
          s = s.replace('logEvent("proxy started on 127.0.0.1:8888")',
                        'logEvent("proxy started on 0.0.0.0:8888 (Wi-Fi interface enabled)")', 1)
          p.write_text(s)

          p = Path("App/FirstSetupView.swift")
          s = p.read_text()
          old = 'Text("在当前 Wi-Fi 的详情页，将「HTTP 代理」设为「手动」：服务器填 127.0.0.1，端口 8888。配置后点击下方「完成」。检测会自动判断是 Wi-Fi 代理还是证书信任有问题。")'
          new = 'Text("在当前 Wi-Fi 的详情页，将「HTTP 代理」设为「手动」：服务器填写本机的 Wi-Fi IPv4 地址（例如 192.168.1.20），端口 8888。不要填写 127.0.0.1。配置后点击下方「完成」。")'
          if old not in s:
              raise SystemExit("setup instruction pattern not found")
          s = s.replace(old, new, 1)
          old2 = 'Button { UIPasteboard.general.string = "127.0.0.1:8888" } label: {'
          new2 = 'Button { UIPasteboard.general.string = ":8888" } label: {'
          if old2 in s:
              s = s.replace(old2, new2, 1)
          old3 = 'caption: "1 选择手动，2 填写服务器 127.0.0.1，3 填写端口 8888。"'
          new3 = 'caption: "1 选择手动，2 填写本机 Wi-Fi IPv4 地址，3 填写端口 8888。不要使用 127.0.0.1。"'
          if old3 in s:
              s = s.replace(old3, new3, 1)
          p.write_text(s)
          PY

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        working-directory: location-spoofer
        run: ./build.sh

      - name: Validate IPA
        working-directory: location-spoofer
        run: |
          set -euo pipefail
          test -s dist/PaopaoLocationSpoofer-unsigned.ipa
          unzip -t dist/PaopaoLocationSpoofer-unsigned.ipa >/dev/null
          unzip -l dist/PaopaoLocationSpoofer-unsigned.ipa | grep -E 'Payload/.+\.app/Info.plist'

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: Location-Spoofer-1.0.8-WiFiIP-unsigned
          path: location-spoofer/dist/PaopaoLocationSpoofer-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
