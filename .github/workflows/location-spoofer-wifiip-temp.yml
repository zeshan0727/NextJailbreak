name: Temporary Location Spoofer WiFi-IP Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: xweiba/location-spoofer
          ref: v1.0.8
          path: location-spoofer

      - name: Patch Wi-Fi proxy listener and auto-profile
        working-directory: location-spoofer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Core/proxy.go")
          s = p.read_text()
          s = s.replace('net.Listen("tcp", fmt.Sprintf("127.0.0.1:%d", proxyPort))', 'net.Listen("tcp", fmt.Sprintf("0.0.0.0:%d", proxyPort))', 1)
          marker = 'func generateProxyMobileConfig() string {'
          helper = """
func localWiFiIPv4() string {
\tinterfaces, err := net.Interfaces()
\tif err != nil { return "127.0.0.1" }
\tfor _, iface := range interfaces {
\t\tif iface.Flags&net.FlagUp == 0 || iface.Flags&net.FlagLoopback != 0 { continue }
\t\taddrs, err := iface.Addrs()
\t\tif err != nil { continue }
\t\tfor _, addr := range addrs {
\t\t\tvar ip net.IP
\t\t\tswitch v := addr.(type) {
\t\t\tcase *net.IPNet: ip = v.IP
\t\t\tcase *net.IPAddr: ip = v.IP
\t\t\t}
\t\t\tif ip == nil { continue }
\t\t\tip = ip.To4()
\t\t\tif ip == nil || ip.IsLoopback() { continue }
\t\t\treturn ip.String()
\t\t}
\t}
\treturn "127.0.0.1"
}
"""
          if 'func localWiFiIPv4() string {' not in s:
              s = s.replace(marker, helper + marker, 1)
          s = s.replace(marker, marker + '\n\tproxyHost := localWiFiIPv4()', 1)
          old = '<string>127.0.0.1</string>\n\t\t\t\t\t<key>ProxyServerPort</key>'
          new = '<string>` + proxyHost + `</string>\n\t\t\t\t\t<key>ProxyServerPort</key>'
          if old not in s: raise SystemExit('proxy profile host pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        working-directory: location-spoofer
        run: ./build.sh

      - name: Validate IPA
        working-directory: location-spoofer
        run: |
          set -euo pipefail
          test -s dist/PaopaoLocationSpoofer-unsigned.ipa
          unzip -t dist/PaopaoLocationSpoofer-unsigned.ipa >/dev/null
          unzip -l dist/PaopaoLocationSpoofer-unsigned.ipa | grep -E 'Payload/.+\.app/Info.plist'

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: Location-Spoofer-1.0.8-WiFiIP-unsigned
          path: location-spoofer/dist/PaopaoLocationSpoofer-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
