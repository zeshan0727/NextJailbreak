name: Temporary Next Signer 1.4.0 Build

on:
  push:
    branches:
      - feature/nextsigner-1.4.0-local-signed-apps
    paths:
      - 'NextSigner/build-trigger-140b.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/nextsigner-1.4.0-local-signed-apps
      - name: Prepare Zsign
        run: |
          set -euo pipefail
          rm -rf NextSigner/Vendor/Zsign-Package
          git clone --depth 1 --branch package https://github.com/claration/Zsign-Package.git NextSigner/Vendor/Zsign-Package
          python3 NextSigner/patch_zsign_local.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: NextSigner
        run: xcodegen generate
      - name: Build
        working-directory: NextSigner
        run: |
          set -euo pipefail
          xcodebuild -project NextSigner.xcodeproj -scheme NextSigner -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/NextSignerDerived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA and TIPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/NextSignerDerived/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/package/Payload" "$RUNNER_TEMP/out"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/NextSigner.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/out/NextSigner-1.4.0.ipa" Payload
          cp "$RUNNER_TEMP/out/NextSigner-1.4.0.ipa" "$RUNNER_TEMP/out/NextSigner-1.4.0.tipa"
          unzip -t "$RUNNER_TEMP/out/NextSigner-1.4.0.ipa" >/dev/null
          shasum -a 256 "$RUNNER_TEMP/out/NextSigner-1.4.0.ipa" "$RUNNER_TEMP/out/NextSigner-1.4.0.tipa"
      - name: Upload verified builds
        uses: actions/upload-artifact@v4
        with:
          name: NextSigner-1.4.0-verified
          path: |
            ${{ runner.temp }}/out/NextSigner-1.4.0.ipa
            ${{ runner.temp }}/out/NextSigner-1.4.0.tipa
          if-no-files-found: error
          retention-days: 30
