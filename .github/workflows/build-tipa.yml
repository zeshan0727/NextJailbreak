name: Build TIPA Qatar Marketplace

on:
  workflow_dispatch:
  push:
    paths:
      - 'TIPA/**'
      - '.github/workflows/build-tipa.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon
        working-directory: TIPA
        run: swift generate_app_icon.swift TIPA/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        working-directory: TIPA
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: TIPA
        run: |
          set -euo pipefail
          xcodebuild \
            -project TIPA.xcodeproj \
            -scheme TIPA \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Package TrollStore TIPA
        working-directory: TIPA
        run: |
          set -euo pipefail
          rm -rf Payload TIPA.tipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TIPA.app Payload/
          /usr/bin/zip -qry TIPA.tipa Payload
          shasum -a 256 TIPA.tipa > TIPA.tipa.sha256
          /usr/bin/file Payload/TIPA.app/TIPA
          /usr/bin/plutil -p Payload/TIPA.app/Info.plist

      - name: Publish TIPA to NS Transfer
        working-directory: TIPA
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/TIPA/TIPA.tipa"
          APP="$GITHUB_WORKSPACE/TIPA/Payload/TIPA.app"
          test -s "$SRC"
          test -d "$APP"

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          SHA256=$(shasum -a 256 "$SRC" | awk '{print $1}')

          cp "$SRC" "/tmp/TIPA-$VERSION.tipa"

          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B tipa-transfer-publish origin/main

          DEST_DIR="transfer/files/TIPA/$VERSION"
          DEST="$DEST_DIR/TIPA-$VERSION.tipa"
          mkdir -p "$DEST_DIR"
          cp "/tmp/TIPA-$VERSION.tipa" "$DEST"
          printf '%s  %s\n' "$SHA256" "TIPA-$VERSION.tipa" > "$DEST_DIR/TIPA-$VERSION.sha256"

          export TIPA_VERSION="$VERSION"
          export TIPA_BUILD="$BUILD"
          export TIPA_SHA256="$SHA256"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          root = Path(os.environ["GITHUB_WORKSPACE"])
          version = os.environ["TIPA_VERSION"]
          build = os.environ["TIPA_BUILD"]
          sha = os.environ["TIPA_SHA256"]
          index_path = root / "transfer/index.json"
          tipa_path = root / f"transfer/files/TIPA/{version}/TIPA-{version}.tipa"

          data = json.loads(index_path.read_text())
          files = data.get("files", [])
          files = [
              item for item in files
              if not str(item.get("id", "")).startswith("tipa-qatar-marketplace-current")
          ]

          entry = {
              "id": f"tipa-qatar-marketplace-current-{version}",
              "name": f"TIPA {version} — Qatar Marketplace Search",
              "fileName": f"TIPA-{version}.tipa",
              "type": "tipa",
              "platform": "TrollStore / iOS 16+",
              "version": f"{version} ({build})",
              "url": f"https://nextjailbreak.com/transfer/files/TIPA/{version}/TIPA-{version}.tipa",
              "sha256": sha,
              "sizeBytes": tipa_path.stat().st_size,
              "notes": "Accuracy-first Qatar marketplace search. Uses an on-device WebKit renderer for Brave search results, preserves single-letter model names such as iPhone X / Galaxy S / Z, accepts only individual marketplace ad URL patterns, rejects generic category/home/search pages, and opens the exact ad."
          }

          data["files"] = [entry] + files
          data["updatedAt"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          index_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          PY

          python3 -m json.tool transfer/index.json >/dev/null
          test "$(shasum -a 256 "$DEST" | awk '{print $1}')" = "$SHA256"
          grep -Fq "\"id\": \"tipa-qatar-marketplace-current-$VERSION\"" transfer/index.json

          git add -f "$DEST_DIR" transfer/index.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish TIPA $VERSION to NS Transfer"
          git push origin HEAD:main

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: TIPA-v0.3.2
          path: |
            TIPA/TIPA.tipa
            TIPA/TIPA.tipa.sha256
            TIPA/xcodebuild.log
          if-no-files-found: error
