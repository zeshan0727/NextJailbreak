name: Build TIPA Qatar Marketplace

on:
  workflow_dispatch:
  push:
    paths:
      - 'TIPA/**'
      - '.github/workflows/build-tipa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon
        working-directory: TIPA
        run: swift generate_app_icon.swift TIPA/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        working-directory: TIPA
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: TIPA
        run: |
          set -euo pipefail
          xcodebuild \
            -project TIPA.xcodeproj \
            -scheme TIPA \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Package TrollStore TIPA
        working-directory: TIPA
        run: |
          set -euo pipefail
          rm -rf Payload TIPA.tipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TIPA.app Payload/
          /usr/bin/zip -qry TIPA.tipa Payload
          shasum -a 256 TIPA.tipa > TIPA.tipa.sha256
          /usr/bin/file Payload/TIPA.app/TIPA
          /usr/bin/plutil -p Payload/TIPA.app/Info.plist

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: TIPA-v0.1.0
          path: |
            TIPA/TIPA.tipa
            TIPA/TIPA.tipa.sha256
            TIPA/xcodebuild.log
          if-no-files-found: error
