name: Temporary Next Signer 1.3.9 Patch

on:
  push:
    paths:
      - '.github/triggers/nextsigner-139-patch.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nextsigner-1.3.9-manual-sign-flow
          fetch-depth: 0
      - name: Apply UI patch
        run: python3 NextSigner/patch_manual_flow.py
      - name: Commit patch
        run: |
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add NextSigner/NextSigner/NextSignerRootView.swift
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Use manual sign-first Next Signer UI'
            git push origin HEAD:feature/nextsigner-1.3.9-manual-sign-flow
          fi
