name: Package Next Ledger 1.3.77 TIPA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "DailyLedger/**"
      - "NextLedger.xcodeproj/**"
      - ".github/workflows/build-nextledger-budget-tipa.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build native Next Ledger release for iPhone
        run: |
          xcodebuild \
            -project NextLedger.xcodeproj \
            -scheme NextLedger \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath /tmp/nextledger177 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Verify identity, package TIPA and checksum
        run: |
          APP_PATH="$(find /tmp/nextledger177/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")" = "com.nextsolution.nextledger"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "1.3.77"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP_PATH/Info.plist")" = "86"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.77.tipa
          shasum -a 256 NextLedger-1.3.77.tipa > NextLedger-1.3.77.sha256
      - name: Upload unsigned TrollStore package
        uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.77-TIPA
          path: |
            NextLedger-1.3.77.tipa
            NextLedger-1.3.77.sha256
          if-no-files-found: error
