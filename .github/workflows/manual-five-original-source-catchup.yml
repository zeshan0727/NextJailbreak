name: Manual five-article AI catch-up

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-five-original-source-catchup.yml"

permissions:
  contents: write

concurrency:
  group: nextjailbreak-manual-five-catchup
  cancel-in-progress: true

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check OpenAI API and helpers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "${OPENAI_API_KEY:-}" || { echo "OPENAI_API_KEY missing" >&2; exit 1; }
          python3 -m py_compile automation/fresh_original_source.py automation/quarantine_stale_catchup.py automation/community_comments.py automation/community_comments_rollout.py

      - name: Repair stale batch and prepare fresh policy
        shell: bash
        run: |
          python3 -m automation.quarantine_stale_catchup
          python3 automation/sync_editorial_indexes.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('automation/published-articles.json').read_text(encoding='utf-8'))
          baseline=sorted({str(e.get('href')) for e in audit.get('entries',[]) if isinstance(e,dict) and e.get('href')})
          Path('/tmp/baseline-hrefs.json').write_text(json.dumps(baseline),encoding='utf-8')
          p=Path('automation/ios_repo_news.json')
          cfg=json.loads(p.read_text(encoding='utf-8'))
          cfg.update({
            'enabled':True,'max_per_day':12,'minimum_site_gap_minutes':0,
            'max_candidate_attempts':25,'quality_target':9,
            'require_original_source':True,'require_unique_source_visual':True,
            'skip_if_only_package_metadata':True,'prefer_freshest':True,
            'require_discovery_version_match':True,
          })
          cfg['minimum_source_words']=max(180,int(cfg.get('minimum_source_words',180)))
          cfg['minimum_article_words']=max(900,int(cfg.get('minimum_article_words',900)))
          cfg['minimum_sections']=max(5,int(cfg.get('minimum_sections',5)))
          p.write_text(json.dumps(cfg,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY

      - name: Discover and AI-write five fresh exact-version articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/catchup-logs
          success_count=0
          for attempt in $(seq 1 15); do
            echo "===== Fresh publication attempt $attempt ====="
            set +e
            python3 -m automation.fresh_original_source --repository-root . --run-id "${GITHUB_RUN_ID}-${attempt}" --confirm-live 2>&1 | tee "/tmp/catchup-logs/attempt-${attempt}.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then python3 -m automation.editorial_integrity; fi
            success_count=$(python3 - <<'PY'
          import json
          from pathlib import Path
          baseline=set(json.loads(Path('/tmp/baseline-hrefs.json').read_text(encoding='utf-8')))
          audit=json.loads(Path('automation/published-articles.json').read_text(encoding='utf-8'))
          current={str(e.get('href')) for e in audit.get('entries',[]) if isinstance(e,dict) and e.get('href')}
          print(len(current-baseline))
          PY
            )
            echo "Validated fresh articles: $success_count / 5"
            [ "$success_count" -ge 5 ] && break
          done
          [ "$success_count" -ge 5 ] || { echo "Could not produce five fresh exact-version articles" >&2; exit 4; }

      - name: Synchronize site and social cards
        run: |
          python3 automation/sync_editorial_indexes.py
          python3 -m automation.editorial_integrity
          python3 automation/sync_editorial_indexes.py
          python3 -m automation.community_comments_rollout

      - name: Restore normal discovery configuration
        if: always()
        run: git checkout -- automation/ios_repo_news.json

      - name: Validate five new pages
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          baseline=set(json.loads(Path('/tmp/baseline-hrefs.json').read_text(encoding='utf-8')))
          audit=json.loads(Path('automation/published-articles.json').read_text(encoding='utf-8'))
          rows=[e for e in audit.get('entries',[]) if isinstance(e,dict) and e.get('href') and str(e.get('href')) not in baseline]
          rows.sort(key=lambda e:str(e.get('published_at','')))
          rows=rows[:5]
          if len(rows)!=5: raise SystemExit(f'Expected 5 new entries, found {len(rows)}')
          for e in rows:
              page=Path(str(e['href']))/'index.html' if str(e['href']).endswith('/') else Path(str(e['href']))
              text=page.read_text(encoding='utf-8')
              if re.search(r'https?://(?:www\.)?nextsolution\.cc(?=[:/"\'\s<]|$)',text,re.I): raise SystemExit(f'Old site domain remains: {page}')
              for required in ('https://nextjailbreak.com/','name="twitter:card" content="summary_large_image"','name="twitter:site" content="@nextjailbreak"','property="og:image"','property="og:image:secure_url"','name="twitter:image"'):
                  if required not in text: raise SystemExit(f'Missing {required}: {page}')
          if not re.search(r'HOME_PAGE_SIZE\s*=\s*8\s*;',Path('assets/site-content.js').read_text(encoding='utf-8')): raise SystemExit('Homepage not set to 8 articles')
          Path('/tmp/catchup-new.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False),encoding='utf-8')
          print('\n'.join(f"{i}. {e.get('title')} -> https://nextjailbreak.com/{e.get('href')}" for i,e in enumerate(rows,1)))
          PY

      - name: Commit five fresh articles and repairs
        run: |
          git config user.name "nextjailbreak-ai-publisher[bot]"
          git config user.email "nextjailbreak-ai-publisher[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes" >&2; exit 1; }
          git commit -m "AI catch-up: publish five fresh exact-version articles"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify committed count
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/catchup-new.json').read_text(encoding='utf-8'))
          assert len(rows)==5
          for row in rows:
              p=Path(str(row['href']))/'index.html' if str(row['href']).endswith('/') else Path(str(row['href']))
              assert p.exists(),p
          print('All five fresh article pages verified.')
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-fresh-article-catchup-${{ github.run_number }}
          path: /tmp/catchup-logs/
          if-no-files-found: ignore
          retention-days: 14

