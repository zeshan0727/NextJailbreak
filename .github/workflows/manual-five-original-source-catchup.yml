name: Manual four-article AI catch-up

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-five-original-source-catchup.yml"

permissions:
  contents: write

concurrency:
  group: nextjailbreak-manual-four-catchup
  cancel-in-progress: true

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check OpenAI API and helpers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "${OPENAI_API_KEY:-}" || { echo "OPENAI_API_KEY missing" >&2; exit 1; }
          python3 -m py_compile automation/fresh_original_source.py automation/quarantine_stale_catchup.py automation/community_comments.py automation/community_comments_rollout.py

      - name: Repair stale batch and prepare fresh policy
        shell: bash
        run: |
          python3 -m automation.quarantine_stale_catchup
          python3 automation/sync_editorial_indexes.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('automation/published-articles.json').read_text(encoding='utf-8'))
          baseline=sorted({str(e.get('href')) for e in audit.get('entries',[]) if isinstance(e,dict) and e.get('href')})
          Path('/tmp/baseline-hrefs.json').write_text(json.dumps(baseline),encoding='utf-8')
          p=Path('automation/ios_repo_news.json')
          cfg=json.loads(p.read_text(encoding='utf-8'))
          cfg.update({
            'enabled':True,'max_per_day':12,'minimum_site_gap_minutes':0,
            'max_candidate_attempts':25,'quality_target':9,
            'require_original_source':True,'require_unique_source_visual':True,
            'skip_if_only_package_metadata':True,'prefer_freshest':True,
            'require_discovery_version_match':True,
          })
          cfg['minimum_source_words']=max(180,int(cfg.get('minimum_source_words',180)))
          cfg['minimum_article_words']=max(900,int(cfg.get('minimum_article_words',900)))
          cfg['minimum_sections']=max(5,int(cfg.get('minimum_sections',5)))
          p.write_text(json.dumps(cfg,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY

      - name: AI-write the four validated exact-version articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/catchup-logs
          python3 - <<'PY' 2>&1 | tee /tmp/catchup-logs/selected-packages.log
          import json
          import os
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          from automation import fresh_original_source as fresh
          from automation import ios_repo_news as base

          root = Path('.').resolve()
          config = json.loads((root / 'automation/ios_repo_news.json').read_text(encoding='utf-8'))
          targets = [
              ('com.ichitaso.bottomcontrolx', '1.0.1'),
              ('run.cheng.autopower', '1.3.0'),
              ('com.ichitaso.notificationtest', '0.0.2'),
              ('com.icraze.alarmsearch', '1.0'),
          ]
          run_id = os.environ.get('GITHUB_RUN_ID_VALUE', 'selected-four')
          original_base_discover = base.discover

          def new_rows():
              baseline = set(json.loads(Path('/tmp/baseline-hrefs.json').read_text(encoding='utf-8')))
              audit = json.loads((root / 'automation/published-articles.json').read_text(encoding='utf-8'))
              return [e for e in audit.get('entries', []) if isinstance(e, dict) and e.get('href') and str(e.get('href')) not in baseline]

          try:
              available = fresh.discover(config)
              print('Pinned publication targets:')
              for package_id, version in targets:
                  print(f' - {package_id} {version}')

              for package_id, expected_version in targets:
                  matches = [c for c in available if c.package_id == package_id]
                  if not matches:
                      raise SystemExit(f'Pinned package not present in fresh discovery: {package_id}')

                  published = False
                  last_error = ''
                  for retry in range(1, 5):
                      print(f'===== {package_id} {expected_version}: generation try {retry}/4 =====')
                      base.discover = lambda _cfg, chosen=matches: list(chosen)
                      try:
                          result = base.publish(
                              repository_root=root,
                              now=datetime.now(timezone.utc),
                              run_id=f'{run_id}-{package_id}-{retry}',
                              github_output=None,
                              confirm_live=True,
                          )
                          print(json.dumps(result, sort_keys=True, ensure_ascii=False))
                          if result.get('published'):
                              rows = new_rows()
                              matching = [r for r in rows if r.get('package') == package_id]
                              if not matching:
                                  raise RuntimeError(f'{package_id} reported published but is absent from audit')
                              actual_version = str(matching[0].get('version', '')).strip()
                              if actual_version != expected_version:
                                  raise RuntimeError(f'{package_id} version mismatch: expected {expected_version}, got {actual_version}')
                              subprocess.run([sys.executable, '-m', 'automation.editorial_integrity'], check=True)
                              published = True
                              break
                          last_error = str(result.get('reason', 'publisher returned no publication'))
                      except Exception as exc:
                          last_error = str(exc)
                          print(f'Retryable publication error for {package_id}: {exc}', file=sys.stderr)

                  if not published:
                      raise SystemExit(f'Could not publish pinned target {package_id} {expected_version}: {last_error}')

              rows = new_rows()
              packages = {str(r.get('package')): str(r.get('version')) for r in rows}
              for package_id, expected_version in targets:
                  if packages.get(package_id) != expected_version:
                      raise SystemExit(f'Final selected-package check failed for {package_id}: {packages.get(package_id)!r}')
              if len(rows) != 4:
                  raise SystemExit(f'Expected exactly 4 new articles, found {len(rows)}')
              print('All four pinned fresh articles generated successfully.')
          finally:
              base.discover = original_base_discover
          PY

      - name: Synchronize site and social cards
        run: |
          python3 automation/sync_editorial_indexes.py
          python3 -m automation.editorial_integrity
          python3 automation/sync_editorial_indexes.py
          python3 -m automation.community_comments_rollout

      - name: Restore normal discovery configuration
        if: always()
        run: git checkout -- automation/ios_repo_news.json

      - name: Validate four new pages
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          baseline=set(json.loads(Path('/tmp/baseline-hrefs.json').read_text(encoding='utf-8')))
          audit=json.loads(Path('automation/published-articles.json').read_text(encoding='utf-8'))
          rows=[e for e in audit.get('entries',[]) if isinstance(e,dict) and e.get('href') and str(e.get('href')) not in baseline]
          rows.sort(key=lambda e:str(e.get('published_at','')))
          expected={
            'com.ichitaso.bottomcontrolx':'1.0.1',
            'run.cheng.autopower':'1.3.0',
            'com.ichitaso.notificationtest':'0.0.2',
            'com.icraze.alarmsearch':'1.0',
          }
          if len(rows)!=4: raise SystemExit(f'Expected 4 new entries, found {len(rows)}')
          if {str(e.get('package')):str(e.get('version')) for e in rows} != expected:
              raise SystemExit('The four generated package/version pairs do not match the pinned target set')
          for e in rows:
              page=Path(str(e['href']))/'index.html' if str(e['href']).endswith('/') else Path(str(e['href']))
              text=page.read_text(encoding='utf-8')
              if re.search(r'https?://(?:www\.)?nextsolution\.cc(?=[:/"\'\s<]|$)',text,re.I): raise SystemExit(f'Old site domain remains: {page}')
              for required in ('https://nextjailbreak.com/','name="twitter:card" content="summary_large_image"','name="twitter:site" content="@nextjailbreak"','property="og:image"','property="og:image:secure_url"','name="twitter:image"'):
                  if required not in text: raise SystemExit(f'Missing {required}: {page}')
          if not re.search(r'HOME_PAGE_SIZE\s*=\s*8\s*;',Path('assets/site-content.js').read_text(encoding='utf-8')): raise SystemExit('Homepage not set to 8 articles')
          Path('/tmp/catchup-new.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False),encoding='utf-8')
          print('\n'.join(f"{i}. {e.get('title')} -> https://nextjailbreak.com/{e.get('href')}" for i,e in enumerate(rows,1)))
          PY

      - name: Commit four fresh articles and repairs
        run: |
          git config user.name "nextjailbreak-ai-publisher[bot]"
          git config user.email "nextjailbreak-ai-publisher[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes" >&2; exit 1; }
          git commit -m "AI catch-up: publish four validated fresh articles"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify committed count
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/catchup-new.json').read_text(encoding='utf-8'))
          assert len(rows)==4
          for row in rows:
              p=Path(str(row['href']))/'index.html' if str(row['href']).endswith('/') else Path(str(row['href']))
              assert p.exists(),p
          print('All four fresh article pages verified in the committed workspace.')
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-fresh-article-catchup-${{ github.run_number }}
          path: /tmp/catchup-logs/
          if-no-files-found: ignore
          retention-days: 14

