name: Provision Next Accountant STAGING Credential

on:
  push:
    branches: [main]
    paths:
      - "tools/next-accountant-migrator/STAGING_PUBLIC_KEY.pem"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-accountant-staging-credential
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify owner public key
        run: |
          set -euo pipefail
          KEY=tools/next-accountant-migrator/STAGING_PUBLIC_KEY.pem
          test -s "$KEY"
          openssl pkey -pubin -in "$KEY" -noout -text > /tmp/key-check.txt
          grep -E 'Public-Key: \(3072 bit\)' /tmp/key-check.txt > /dev/null
          echo "RSA-3072 public key accepted; private key is not in GitHub." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Generate and set separate staging secret
        working-directory: cloudflare/next-accountant-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          cat > wrangler.staging-secret.toml <<'EOF'
          name = "next-accountant-api-staging"
          main = "worker.staging.js"
          compatibility_date = "2026-10-26"
          workers_dev = false
          EOF
          TOKEN=$(openssl rand -hex 32)
          mkdir -p ../../staging-secret-delivery
          printf '%s' "$TOKEN" | openssl pkeyutl -encrypt -pubin \
            -inkey ../../tools/next-accountant-migrator/STAGING_PUBLIC_KEY.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            | base64 -w0 > ../../staging-secret-delivery/NEXT_ACCOUNTANT_STAGING_CREDENTIAL.txt
          printf '%s' "$TOKEN" | wrangler secret put OWNER_TOKEN --config=wrangler.staging-secret.toml > /dev/null
          unset TOKEN
          echo "Separate staging owner token provisioned; only RSA-encrypted ciphertext is exported." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted credential (safe for artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NextAccountantStagingEncryptedCredential
          path: staging-secret-delivery/NEXT_ACCOUNTANT_STAGING_CREDENTIAL.txt
          if-no-files-found: error
          retention-days: 7

      - name: Verify protected staging route
        run: |
          set -e
          API=https://accounts-stage-api.nextjailbreak.com
          curl --fail "$API/health" > /tmp/health.json
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "$API/api/admin/tables")
          test "$STATUS" = "401"
          echo "Staging authentication is enabled; unauthorized requests return 401." >> "$GITHUB_STEP_SUMMARY"
