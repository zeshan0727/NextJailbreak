name: AppForge - iOS 16 test TIPA
on:
  push:
    branches: [agent/appforge-test-20261022]
    paths:
      - 'apps/AppForge/**'
      - '.github/workflows/appforge-ios-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/AppForge
        run: xcodegen generate
      - name: Build AppForge
        working-directory: apps/AppForge
        run: |
          set -euo pipefail
          xcodebuild -project AppForge.xcodeproj -scheme AppForge -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA and TIPA
        working-directory: apps/AppForge
        run: |
          set -euo pipefail
          mkdir -p out/Payload
          ditto DerivedData/Build/Products/Release-iphoneos/AppForge.app out/Payload/AppForge.app
          (cd out && zip -qry AppForge.ipa Payload)
          cp out/AppForge.ipa out/AppForge.tipa
          unzip -t out/AppForge.tipa | tail -5
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppForge-test-${{ github.run_number }}
          path: |
            apps/AppForge/out/AppForge.ipa
            apps/AppForge/out/AppForge.tipa
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "appforge-test-${{ github.run_number }}" apps/AppForge/out/AppForge.ipa apps/AppForge/out/AppForge.tipa --title "AppForge test build ${{ github.run_number }}" --notes "Unsigned iOS 16 test build; use TrollStore or a compatible signing method." --target "$GITHUB_SHA"
