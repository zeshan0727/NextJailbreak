          <!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f5f6"><title>AirCard-iOS 1.3 Adds .tendies Wallpapers and NeoSpring on iOS 27 | Next Jailbreak</title><meta name="description" content="AirCard-iOS 1.3 brings on-device Wallet skins, passcode themes and PosterBoard .tendies wallpapers to iOS 27+, with NeoSpring respring support."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://nextjailbreak.com/aircard-ios-1-3-ios-27-wallet-passcode-wallpaper-customization/"><link rel="alternate" type="application/rss+xml" title="Next Jailbreak articles" href="/feed.xml"><link rel="icon" type="image/svg+xml" href="/assets/brand/next-jailbreak-mark.svg"><link rel="stylesheet" href="/assets/site.css"><meta property="og:type" content="article"><meta property="og:site_name" content="Next Jailbreak"><meta property="og:url" content="https://nextjailbreak.com/aircard-ios-1-3-ios-27-wallet-passcode-wallpaper-customization/"><meta property="og:title" content="AirCard-iOS 1.3 Adds .tendies Wallpapers and NeoSpring on iOS 27"><meta property="og:description" content="A verified look at AirCard-iOS 1.3, released September 20, 2026, and its iOS 27+ Wallet, passcode and PosterBoard customization features."><meta property="og:image" content="https://nextjailbreak.com/assets/articles/source-media/aircard-ios-1-3-app-icon.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://nextjailbreak.com/assets/articles/source-media/aircard-ios-1-3-app-icon.png"><meta name="twitter:site" content="@nextjailbreak"><meta name="google-adsense-account" content="ca-pub-4770123899731214"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4770123899731214" crossorigin="anonymous"></script><script type="application/ld+json">{"@context":"https://schema.org","@type":"TechArticle","headline":"AirCard-iOS 1.3 Adds .tendies Wallpapers and NeoSpring on iOS 27","datePublished":"2026-09-20","dateModified":"2026-09-20","author":{"@type":"Person","name":"Zeeshan Barvi"},"publisher":{"@type":"Organization","name":"Next Jailbreak","url":"https://nextjailbreak.com"},"mainEntityOfPage":"https://nextjailbreak.com/aircard-ios-1-3-ios-27-wallet-passcode-wallpaper-customization/","image":"https://nextjailbreak.com/assets/articles/source-media/aircard-ios-1-3-app-icon.png"}</script><link rel="stylesheet" href="/assets/community-comments.css"></head><body><div class="topline"><div class="topline-inner"><span>iPhone jailbreak guides, tweak reviews and practical fixes</span><span class="topline-status"><i aria-hidden="true"></i> Direct links to original sources</span></div></div><header class="site-header"><div class="nav-shell"><a class="brand" href="/"><img class="brand-logo" src="/assets/brand/next-jailbreak-mark.svg" alt="" width="52" height="52"><span class="brand-name"><strong>Next</strong> Jailbreak</span></a><nav><ul class="nav-links"><li><a href="/">Blog</a></li><li><a href="/tutorials/#verified-articles">Tweaks</a></li><li><a href="/tutorials/#jailbreak-guides">Jailbreak</a></li><li><a href="/videos/">Videos</a></li><li><a href="https://repo.nextjailbreak.com/">Repo</a></li></ul></nav></div></header><main class="container article-main"><nav class="breadcrumbs"><a href="/">Home</a><span>/</span><a href="/tutorials/#verified-articles">Latest updates</a><span>/</span><span>AirCard-iOS</span></nav><article><header class="article-hero"><span class="article-kicker">Fresh release · Original-source editorial</span><h1>AirCard-iOS 1.3 Adds .tendies Wallpapers and NeoSpring on iOS 27</h1><p class="article-summary">Mak5er released AirCard-iOS 1.3 on September 20, 2026. The native iPhone utility expands its iOS 27+ customization toolkit with PosterBoard .tendies wallpaper importing, automatic container detection, NeoSpring resprings, transit-pass PDF artwork, and refinements to Wallet and passcode theming.</p></header><figure class="article-visual"><img src="/assets/articles/source-media/aircard-ios-1-3-app-icon.png" alt="Official AirCard-iOS app icon from the developer repository" fetchpriority="high"><figcaption>Official AirCard-iOS application artwork cached from Mak5er’s v1.3 source tree. Source: developer repository.</figcaption></figure><div class="article-layout"><div class="article-content"><h2>AirCard-iOS 1.3 is a same-day iOS 27 customization release</h2><p>AirCard-iOS 1.3 was published by developer Mak5er on September 20, 2026. The release is notable because it moves several customization jobs directly onto the iPhone rather than requiring a desktop session for every change. The developer describes the current target as iOS 27.0 and newer. This is a jailbreak-adjacent utility rather than a conventional full jailbreak: it communicates with internal system services over a local loopback tunnel and uses AirTraffic-related file access to modify selected system caches.</p><p>The v1.3 release includes a downloadable AirCard-iOS IPA and the repository remains public, giving users a first-party place to inspect the implementation and exact release notes. The project credits AirLift research by 0xjohnny for the underlying AirTraffic and ATAirlock sandbox-escape work, while the iOS application combines that foundation with its own SwiftUI interface, pairing flow and customization engines.</p><h2>PosterBoard .tendies wallpapers are the headline addition</h2><p>The biggest new feature in 1.3 is support for importing and unpacking <code>.tendies</code> wallpaper archives. According to the developer, AirCard-iOS can automatically locate PosterBoard wallpaper containers, preserve the active descriptor UUID and inject the required configuration and assets. That turns the app into more than a Wallet-card skinner or passcode-theme utility: it now covers a third visible customization surface on iOS 27.</p><p>The release also integrates a WebKit-based NeoSpring respring immediately after a wallpaper is flashed. The intended benefit is that users do not need to reboot the entire device simply to make the newly injected PosterBoard configuration take effect. This is specifically documented as part of v1.3, so it should not be assumed to exist in older AirCard-iOS builds.</p><h2>Wallet skins and transit passes get additional work</h2><p>AirCard-iOS already supported replacing Apple Wallet card artwork, but 1.3 adds PDF artwork generation for transit passes such as Suica and Pasmo. The repository explains that the app writes Wallet artwork to Passbook cache locations and clears related front-face and thumbnail caches so the changed artwork can appear when Wallet restarts. Individual cards can receive different artwork, or the same skin can be applied across detected cards.</p><p>Card detection happens while Apple Pay is opened, allowing the application to identify card identifiers in real time. The developer’s documentation describes output for standard raster card backgrounds as well as PDF output needed by some transit cards. These changes are cosmetic; users should not interpret them as modifications to payment credentials, balances or the secure payment functions of a card.</p><h2>Passcode theming also receives fixes</h2><p>The passcode-theme portion of AirCard-iOS supports <code>.passthm</code> archives and offers both a poster-style layout spanning an image across the numeric keypad and individual circular artwork for each button. Version 1.3 fixes keypad preview framing and TelephonyUI cache paths, and cleans up the number-localization pickers. The repository also documents localized number subtext options, including Ukrainian and Russian Cyrillic layouts.</p><p>Several interface refinements accompany those functional changes. The release notes say action buttons were centered, misplaced list divider lines were removed, disruptive import and install alert popups were replaced by inline status logs, and the VPN status presentation was simplified. The developer also removed sluggish animations around card scanning and log copying.</p><h2>How the on-device connection works</h2><p>AirCard-iOS depends on a local loopback route rather than operating as a completely isolated App Store-style application. The current README lists LocalDevVPN as a prerequisite, with loopback routing through addresses such as 10.7.0.1 or 127.0.0.1 so the app can reach internal device services. Core file operations are handled by AirliftFFI, a Rust library used by the application.</p><p>The project also includes an on-device pairing flow. It advertises locally over Bonjour so the phone can pair with itself through the Developer Mode pairing interface, then reads and synchronizes the pairing record into the app’s own document storage. Once the required pairing and loopback environment are working, the developer says a computer does not need to remain connected for normal use.</p><h2>Compatibility and installation limits matter</h2><p>The v1.3 release notes explicitly state that AirCard-iOS currently supports iOS 27.0 and newer. That is the compatibility claim readers should use for this release. Although older commits or related AirCard projects may mention earlier firmware, they should not be mixed into the compatibility statement for this specific native iOS release. The application’s current README and v1.3 notes are the authoritative references for its supported target.</p><p>The developer lists SideStore, AltStore, TrollStore, LiveContainer, Xcode and iOS App Signer as possible installation routes. Availability of any particular signing or installation method still depends on the device and firmware. AirCard-iOS also requires its loopback/pairing prerequisites after installation, so successfully sideloading the IPA does not by itself mean the customization path is ready.</p><h2>What to verify before trying AirCard-iOS</h2><p>Users should start by confirming that they are looking at the official Mak5er repository and the v1.3 release dated September 20, 2026. The official release asset is named <code>AirCard-iOS.ipa</code>. The developer’s published SHA-256 metadata for the release asset can be checked through GitHub’s release information when integrity verification is important.</p><p>Next, confirm the firmware requirement and read the current open issues. Low-level system-cache modification can fail differently across devices, and the project is under active development. A fresh release does not guarantee that every combination of hardware, pairing state and local tunnel behaves identically. Keep recoverability in mind before modifying system-facing caches, and do not rely on unofficial mirrors when the developer already provides the source and release asset directly.</p><p>For the jailbreak community, the interesting part of AirCard-iOS 1.3 is not that it replaces a jailbreak—it does not—but that it packages several system-customization techniques into an on-device workflow for current iOS 27 firmware. PosterBoard wallpaper injection, Wallet artwork replacement and passcode cache theming now sit in one native utility, backed by a transparent public repository and a clearly dated release.</p><h2>Frequently asked questions</h2><div class="faq-list"><details><summary>What is new in AirCard-iOS 1.3?</summary><p>The September 20 release adds .tendies PosterBoard wallpaper support, automatic container and descriptor handling, NeoSpring resprings, transit-pass PDF artwork generation, passcode-theme fixes and multiple UI refinements.</p></details><details><summary>Does AirCard-iOS 1.3 require a jailbreak?</summary><p>The developer presents it as an on-device customization utility using a local loopback tunnel and AirTraffic-related access rather than as a traditional full jailbreak. Its prerequisites and limitations still need to be followed exactly.</p></details><details><summary>Which iOS versions are supported?</summary><p>The v1.3 release and current project documentation state iOS 27.0 and newer.</p></details><details><summary>Where should the IPA come from?</summary><p>Use the official Mak5er AirCard-iOS v1.3 GitHub release. Avoid unrelated mirrors when a first-party release is available.</p></details></div><div class="article-disclaimer"><strong>Before installing:</strong> verify the current release, prerequisites and open issues at the original developer repository for your exact device and firmware.</div><p class="article-footnote">Original-source editorial · Published 2026-09-20 · Next Jailbreak</p></div><aside class="article-sidebar"><h2>Original sources</h2><p>First-party developer pages used to verify this article.</p><div class="button-stack"><a class="button button-primary" href="https://github.com/Mak5er/AirCard-iOS/releases/tag/v1.3" rel="nofollow noopener noreferrer">AirCard-iOS v1.3 release</a><a class="button button-primary" href="https://github.com/Mak5er/AirCard-iOS" rel="nofollow noopener noreferrer">Developer repository</a></div><p><strong>Released:</strong> September 20, 2026</p><p><strong>Version:</strong> 1.3</p><p><strong>Target:</strong> iOS 27+</p></aside></div></article></main><footer class="site-footer"><div class="footer-shell"><div><strong>Next Jailbreak</strong><p>Independent jailbreak news and practical iPhone customization coverage.</p></div></div></footer><script src="/assets/community-comments.js" defer></script></body></html>
