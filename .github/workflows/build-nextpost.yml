name: Build Next Post TIPA

# 1.0.11 original X commentary + article refresh
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "NextPost/**"
      - ".github/workflows/build-nextpost.yml"
  push:
    branches: [main]
    paths:
      - "NextPost/**"
      - ".github/workflows/build-nextpost.yml"

permissions:
  contents: write

concurrency:
  group: build-nextpost-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen and icon renderer
        run: brew install xcodegen librsvg

      - name: Render app icon
        run: |
          rsvg-convert -w 1024 -h 1024 NextPost/Resources/AppIcon.svg > NextPost/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          cp NextPost/Assets.xcassets/AppIcon.appiconset/AppIcon.png NextPost/Assets.xcassets/NextPostIcon.imageset/NextPostIcon.png

      - name: Generate Xcode project
        run: |
          cd NextPost
          xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project NextPost/NextPost.xcodeproj \
            -scheme NextPost \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-nextpost \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package TIPA
        run: |
          APP_PATH="$(find build-nextpost/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextPost-1.0.11-Original-Content-Refresh.tipa
          shasum -a 256 NextPost-1.0.11-Original-Content-Refresh.tipa > NextPost-1.0.11-Original-Content-Refresh.sha256

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "1.0.11"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "11"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          file "$APP_PATH/Next Post"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextPost-1.0.11-Original-Content-Refresh
          path: |
            NextPost-1.0.11-Original-Content-Refresh.tipa
            NextPost-1.0.11-Original-Content-Refresh.sha256
          if-no-files-found: error

      - name: Publish TIPA to repository
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="$RUNNER_TEMP/nextpost-release"
          mkdir -p "$RELEASE_DIR"
          cp NextPost-1.0.11-Original-Content-Refresh.tipa "$RELEASE_DIR/"
          cp NextPost-1.0.11-Original-Content-Refresh.sha256 "$RELEASE_DIR/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main

            mkdir -p applications
            cp "$RELEASE_DIR/NextPost-1.0.11-Original-Content-Refresh.tipa" applications/
            cp "$RELEASE_DIR/NextPost-1.0.11-Original-Content-Refresh.sha256" applications/
            git add applications/NextPost-1.0.11-Original-Content-Refresh.tipa applications/NextPost-1.0.11-Original-Content-Refresh.sha256

            if git diff --cached --quiet; then
              echo "Next Post 1.0.11 build is already published."
              exit 0
            fi

            git commit -m "Publish Next Post 1.0.11 original content refresh TIPA"
            if git push origin HEAD:main; then
              echo "Published Next Post 1.0.11 successfully."
              exit 0
            fi

            sleep $((attempt * 3))
          done

          echo "Failed to publish after 5 attempts."
          exit 1
