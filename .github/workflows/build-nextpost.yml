name: Build Next Post TIPA

# 1.0.17 adds verified clean four-line posts while retaining the ad-free All Articles UI.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "NextPost/**"
      - ".github/workflows/build-nextpost.yml"
  push:
    branches: [main]
    paths:
      - "NextPost/**"
      - ".github/workflows/build-nextpost.yml"

permissions:
  contents: write

concurrency:
  group: build-nextpost-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen and icon renderer
        run: brew install xcodegen librsvg

      - name: Render app icon
        run: |
          rsvg-convert -w 1024 -h 1024 NextPost/Resources/AppIcon.svg > NextPost/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          cp NextPost/Assets.xcassets/AppIcon.appiconset/AppIcon.png NextPost/Assets.xcassets/NextPostIcon.imageset/NextPostIcon.png

      - name: Verify advertising code and dependencies are absent
        run: |
          if grep -R -nE 'UnityMediationSDK|UnityAdsAdapter|AdsManager|AdTestDeviceHelper|IronSource|LevelPlay' NextPost/Sources NextPost/project.yml; then
            echo "Advertising integration unexpectedly present"
            exit 1
          fi

      - name: Verify composer formatting
        run: |
          swiftc NextPost/Sources/Models.swift NextPost/Sources/PostComposer.swift NextPost/Tests/PostComposerSmokeTests.swift -o "$RUNNER_TEMP/nextpost-composer-checks"
          "$RUNNER_TEMP/nextpost-composer-checks"

      - name: Generate Xcode project
        run: |
          cd NextPost
          xcodegen generate
          if grep -E "UnityMediationSDK|UnityAdsAdapter|LevelPlay|AdsManager" NextPost.xcodeproj/project.pbxproj; then exit 1; fi

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project NextPost/NextPost.xcodeproj \
            -scheme NextPost \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-nextpost \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package TIPA
        run: |
          APP_PATH="$(find build-nextpost/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextPost-1.0.17-Professional-X-Posts.tipa
          shasum -a 256 NextPost-1.0.17-Professional-X-Posts.tipa > NextPost-1.0.17-Professional-X-Posts.sha256

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "1.0.17"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "17"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          file "$APP_PATH/Next Post"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextPost-1.0.17-Professional-X-Posts
          path: |
            NextPost-1.0.17-Professional-X-Posts.tipa
            NextPost-1.0.17-Professional-X-Posts.sha256
          if-no-files-found: error

      - name: Publish TIPA to repository
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/nextpost-release"
          mkdir -p "$RELEASE_DIR"
          cp NextPost-1.0.17-Professional-X-Posts.tipa "$RELEASE_DIR/"
          cp NextPost-1.0.17-Professional-X-Posts.sha256 "$RELEASE_DIR/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p applications
            cp "$RELEASE_DIR/NextPost-1.0.17-Professional-X-Posts.tipa" applications/
            cp "$RELEASE_DIR/NextPost-1.0.17-Professional-X-Posts.sha256" applications/
            git add applications/NextPost-1.0.17-Professional-X-Posts.tipa applications/NextPost-1.0.17-Professional-X-Posts.sha256
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish Next Post 1.0.17 professional X posts TIPA"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1


  auto_sign:
    name: Automatically sign Next Post after successful build
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_DIRECTORY: ${{ runner.temp }}/unsigned
      EXPECTED_BUNDLE_ID: com.nextsolution.nextpost
    steps:
      - name: Check out the signing validator
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download Next Post build artifact
        uses: actions/download-artifact@v4
        with:
          name: NextPost-1.0.17-Professional-X-Posts
          path: ${{ runner.temp }}/unsigned
      - name: Check app identity and build contents
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/auto-sign-ios.py inspect
      - name: Submit for signing with saved GitHub certificates
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view nextsigner-inbox >/dev/null 2>&1; then
            gh release create nextsigner-inbox --draft --title 'Next Signer Inbox' --notes 'Unsigned signing inbox'
          fi
          ASSET="auto-nextpost-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ipa"
          cp "$RUNNER_TEMP/auto-sign-input.ipa" "$RUNNER_TEMP/$ASSET"
          gh release upload nextsigner-inbox "$RUNNER_TEMP/$ASSET"
          gh workflow run nextsigner-sign-publish.yml --ref main \
            -f "staging_asset=$ASSET" \
            -f "requested_name=$APP_NAME" \
            -f "requested_bundle_id=$REQUESTED_BUNDLE_ID"
          {
            echo '## Next Post signing requested'
            echo "App: $APP_NAME"
            echo "Original bundle ID: $REQUESTED_BUNDLE_ID"
            echo "Version: $APP_VERSION ($APP_BUILD)"
            echo 'The existing Next Signer publisher signs and publishes the IPA.'
          } >> "$GITHUB_STEP_SUMMARY"
