name: Build Next Signer 1.5.0 Modern UI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nextsigner-1.5.0-modern-ui
    paths:
      - 'NextSigner/**'
      - '.github/workflows/build-nextsigner-150-modern.yml'

permissions:
  contents: read

concurrency:
  group: nextsigner-150-modern-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXTSIGNER_VERSION: '1.5.0'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MARKETING_VERSION: "1.5.0"' NextSigner/project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "26"' NextSigner/project.yml
          grep -q 'struct NSFloatingTabBar' NextSigner/NextSigner/NextSignerRootView.swift
          grep -q 'struct NSGlassCard' NextSigner/NextSigner/NextSignerDesignSystem.swift
          grep -q 'local.install(app, using: store)' NextSigner/NextSigner/NextSignerLocalViews.swift
          grep -q 'itms-services://?action=download-manifest' NextSigner/NextSigner/LocalSigningController.swift

      - name: Prepare patched Zsign sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf NextSigner/Vendor/Zsign-Package
          git clone --depth 1 --branch package https://github.com/claration/Zsign-Package.git NextSigner/Vendor/Zsign-Package
          python3 - <<'PY'
          from pathlib import Path

          bridge = Path('NextSigner/Vendor/Zsign-Package/swift/zsign.mm')
          s = bridge.read_text()
          s = s.replace('void(^completionHandler)(BOOL success, NSError *error)',
                        'void(^completionHandler)(BOOL success)')
          old_call = 'bundle.SignFolder(&zsa, strFolder, strBundleId, strBundleVersion, strDisplayName, arrDylibFiles, bForce, bWeakInject, bEnableCache, excludeprovion)'
          new_call = 'bundle.SignFolder(&zsa, strFolder, strBundleId, strBundleVersion, strDisplayName, arrDylibFiles, arrDisDylibFiles, bForce, bWeakInject, bEnableCache, excludeprovion)'
          if old_call not in s:
              raise SystemExit('Expected stale SignFolder bridge call not found')
          s = s.replace(old_call, new_call)
          s = s.replace('completionHandler(bRet);', 'if (completionHandler) { completionHandler(bRet); }')
          bridge.write_text(s)

          bundle = Path('NextSigner/Vendor/Zsign-Package/src/bundle.cpp')
          b = bundle.read_text()
          stale = 'if (bRemoveProvision) {'
          fixed = 'if (!bRemoveProvision) {'
          if stale not in b:
              raise SystemExit('Expected embedded.mobileprovision condition not found')
          bundle.write_text(b.replace(stale, fixed, 1))
          PY

      - name: Generate app icon
        run: python3 NextSigner/generate_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: NextSigner
        run: xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: NextSigner
        run: |
          set -euo pipefail
          xcodebuild \
            -project NextSigner.xcodeproj \
            -scheme NextSigner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/NextSignerDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA and TIPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/NextSignerDerived/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP_PATH" || { echo 'Built .app not found'; exit 1; }
          test -f "$APP_PATH/Assets.car" || { echo 'Compiled asset catalog missing'; exit 1; }

          rm -rf "$RUNNER_TEMP/package"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/NextSigner.app"

          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.ipa" Payload
          cp "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.ipa" "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.tipa"

          unzip -t "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.ipa" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/package/Payload/NextSigner.app/Info.plist" | grep -qx '1.5.0'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/package/Payload/NextSigner.app/Info.plist" | grep -qx '26'
          shasum -a 256 "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.ipa" "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.tipa"
          stat -f '%N %z bytes' "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.ipa" "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.tipa"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NextSigner-1.5.0-Modern
          path: |
            ${{ runner.temp }}/NextSigner-1.5.0.ipa
            ${{ runner.temp }}/NextSigner-1.5.0.tipa
          if-no-files-found: error
          retention-days: 30
