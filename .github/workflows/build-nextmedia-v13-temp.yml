name: Temporary Publish NetMirror 1.0.25
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-nextmedia-v13-temp.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            transfer/index.json
            transfer/files/NetMirror/1.0.24/NetMirror-1.0.24-Stable-Player-Downloads-Tabs.tipa
            transfer/files/NetMirror/1.0.25/NetMirror-1.0.25-Player-Back-UI-Fix.tipa
            .github/workflows/build-nextmedia-v13-temp.yml
          sparse-checkout-cone-mode: false
      - name: Patch and publish
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          SRC="transfer/files/NetMirror/1.0.24/NetMirror-1.0.24-Stable-Player-Downloads-Tabs.tipa"
          OUT="transfer/files/NetMirror/1.0.25/NetMirror-1.0.25-Player-Back-UI-Fix.tipa"
          rm -rf /tmp/nm25
          mkdir -p /tmp/nm25 "$(dirname "$OUT")"
          unzip -q "$SRC" -d /tmp/nm25
          python3 - <<'PY'
          from pathlib import Path
          import os,plistlib,hashlib,base64
          app=next(Path("/tmp/nm25/Payload").glob("*.app"))
          bp=app/"NetMirrorPort"
          b=bytearray(bp.read_bytes())
          k=bytes(b).find(b"window._n24")
          if k<0: raise SystemExit("V24 slot missing")
          s=bytes(b).rfind(b"\0",0,k)+1
          e=bytes(b).find(b"\0",k)
          n=e-s
          js=base64.b64decode(os.environ["PATCH_B64"])
          if len(js)>=n: raise SystemExit(f"patch too long {len(js)} >= {n}")
          b[s:s+n]=js+b"\0"+b"\0"*(n-len(js)-1)
          bp.write_bytes(b)
          pl=app/"Info.plist"
          with pl.open("rb") as f:i=plistlib.load(f)
          i["CFBundleShortVersionString"]="1.0.25";i["CFBundleVersion"]="25"
          with pl.open("wb") as f:plistlib.dump(i,f,fmt=plistlib.FMT_BINARY)
          hb=(app/"main.jsbundle").read_bytes()
          assert len(hb)==1215512
          assert hashlib.sha256(hb).hexdigest()=="42f96376c8971aee304f6806471dbee0b7f94e3de5f329f6365e83088aea2ca6"
          PY
          (cd /tmp/nm25 && zip -qry "$GITHUB_WORKSPACE/$OUT" Payload)
          unzip -t "$OUT" >/dev/null
          export TIPA_SHA="$(shasum -a 256 "$OUT" | awk '{print $1}')"
          export TIPA_SIZE="$(stat -f%z "$OUT")"
          python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path("transfer/index.json")
          d=json.loads(p.read_text())
          e={"id":"netmirror-1.0.25-player-back-ui-fix","name":"NetMirror 1.0.25 — Player Back + UI Fix","fileName":"NetMirror-1.0.25-Player-Back-UI-Fix.tipa","type":"tipa","platform":"TrollStore / iOS 15.1+","version":"1.0.25","url":"https://nextjailbreak.com/transfer/files/NetMirror/1.0.25/NetMirror-1.0.25-Player-Back-UI-Fix.tipa","sha256":os.environ["TIPA_SHA"],"sizeBytes":int(os.environ["TIPA_SIZE"]),"notes":"Keeps the confirmed-working V24/V20 playback path unchanged while refining the iOS-style Home/Downloads interface and adding a persistent Home/Back control whenever video or fullscreen playback is active. The control pauses video, exits fullscreen when possible, and returns cleanly to NetMirror Home. Original recovered Hermes bundle remains unchanged."}
          d["files"]=[x for x in d.get("files",[]) if x.get("id")!=e["id"]]
          d["files"].insert(0,e)
          d["updatedAt"]=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          p.write_text(json.dumps(d,indent=2)+"\n")
          PY
          curl -fsSL "https://raw.githubusercontent.com/zeshan0727/NextJailbreak/6fba0855fe8146a365083d739d0fccf4e511d3d5/.github/workflows/build-nextmedia-v13-temp.yml" -o .github/workflows/build-nextmedia-v13-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT" transfer/index.json .github/workflows/build-nextmedia-v13-temp.yml
          git commit -m "Publish NetMirror 1.0.25 to NS Transfer [skip ci]"
          git push origin HEAD:main
