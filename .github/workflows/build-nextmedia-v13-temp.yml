name: Temporary Publish NetMirror 1.0.24

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-nextmedia-v13-temp.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build NetMirror 1.0.24 from validated V20
        shell: bash
        run: |
          set -euo pipefail
          SRC="transfer/files/NetMirror/1.0.20/NetMirror-1.0.20-Android-WebView-Support-Gate-Bypass.tipa"
          OUT="transfer/files/NetMirror/1.0.24/NetMirror-1.0.24-Stable-Player-Downloads-Tabs.tipa"
          rm -rf /tmp/nm24
          mkdir -p /tmp/nm24 "$(dirname "$OUT")"
          unzip -q "$SRC" -d /tmp/nm24
          python3 - <<'PY'
          from pathlib import Path
          import plistlib, hashlib

          app=next(Path("/tmp/nm24/Payload").glob("*.app"))
          binp=app/"NetMirrorPort"
          b=bytearray(binp.read_bytes())
          key=b"__nmSupportBypassInstalled"
          k=bytes(b).find(key)
          if k < 0:
              raise SystemExit("V20 support script not found")
          start=bytes(b).rfind(b"\0",0,k)+1
          end=bytes(b).find(b"\0",start)
          oldlen=end-start

          js=r"""(function(){try{if(!/(^|\.)net52\.cc$/i.test(location.hostname)||!location.pathname.startsWith('/mobile/home'))return's';if(window._n24)return'o';window._n24=1;var d=document,k='nmD';function g(){try{return JSON.parse(localStorage[k]||'[]')}catch(e){return[]}}function p(u){var a=g().filter(function(x){return x!=u});a.unshift(u);localStorage[k]=JSON.stringify(a.slice(0,30))}d.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a');if(!a)return;var u=a.href||'',t=a.textContent||'';if(a.hasAttribute('download')||/download/i.test(t)||/\.(ipa|tipa|zip|apk|pdf|mp4|mkv|mov)([?#]|$)/i.test(u)){p(u);a.target='_blank'}},true);function b(){var B=d.body;if(!B)return;var T=B.innerText||'';if(/We\s*Need\s*Support/i.test(T)&&/Click\s*Here/i.test(T)){var A=[].slice.call(B.querySelectorAll('*')).filter(function(e){var t=e.innerText||'';return/We\s*Need\s*Support/i.test(t)&&/Click\s*Here/i.test(t)}).sort(function(a,c){return a.children.length-c.children.length})[0];if(A)A.style.display='none'}}function l(){var L=d.getElementById('nl'),a=g();L.innerHTML=a.length?'':'No downloads yet.';a.forEach(function(u){var z=d.createElement('a');z.href=u;z.target='_blank';z.textContent=u.split('/').pop().split('?')[0]||'Download';L.appendChild(z)})}function n(){if(!d.body||d.getElementById('nt'))return;d.head.insertAdjacentHTML('beforeend','<style>#nt{position:fixed;left:12px;right:12px;bottom:max(8px,env(safe-area-inset-bottom));height:54px;z-index:2147483000;background:#1c1c1eee;border-radius:17px;display:flex}#nt button{flex:1;border:0;background:0;color:#fff;font:600 12px -apple-system}#ns{display:none;position:fixed;inset:0;z-index:2147483100;background:#0009;align-items:flex-end}#nb{width:100%;max-height:70vh;overflow:auto;background:#1c1c1e;color:#fff;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));font:15px -apple-system}#nl a{display:block;background:#2c2c2e;color:#fff;padding:11px;margin:8px 0;border-radius:11px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style>');d.body.insertAdjacentHTML('beforeend','<div id=nt><button id=nh>⌂<br>Home</button><button id=nd>⇩<br>Downloads</button></div><div id=ns><div id=nb><b>Downloads</b><div id=nl></div><button id=nc>Done</button></div></div>');var S=d.getElementById('ns');d.getElementById('nh').onclick=function(){location.href='https://net52.cc/mobile/home?app=1'};d.getElementById('nd').onclick=function(){l();S.style.display='flex'};d.getElementById('nc').onclick=function(){S.style.display='none'};S.onclick=function(e){if(e.target==S)S.style.display='none'}}function R(){b();n();[].slice.call(d.querySelectorAll('a[download]')).forEach(function(a){a.target='_blank'})}R();new MutationObserver(R).observe(d.documentElement,{subtree:true,childList:true});return'o'}catch(e){return'e'}})();""".encode()

          if len(js) >= oldlen:
              raise SystemExit(f"replacement too long {len(js)} >= {oldlen}")
          b[start:start+oldlen]=js+b"\0"+b"\0"*(oldlen-len(js)-1)
          binp.write_bytes(b)

          pl=app/"Info.plist"
          with pl.open("rb") as f: info=plistlib.load(f)
          info["CFBundleShortVersionString"]="1.0.24"
          info["CFBundleVersion"]="24"
          with pl.open("wb") as f: plistlib.dump(info,f,fmt=plistlib.FMT_BINARY)

          hb=(app/"main.jsbundle").read_bytes()
          h=hashlib.sha256(hb).hexdigest()
          assert len(hb)==1215512
          assert h=="42f96376c8971aee304f6806471dbee0b7f94e3de5f329f6365e83088aea2ca6"
          print("Hermes",len(hb),h)
          PY
          (cd /tmp/nm24 && zip -qry "$GITHUB_WORKSPACE/$OUT" Payload)
          unzip -t "$OUT" >/dev/null
          shasum -a 256 "$OUT"

      - name: Update NS Transfer feed and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          OUT="transfer/files/NetMirror/1.0.24/NetMirror-1.0.24-Stable-Player-Downloads-Tabs.tipa"
          SHA="$(shasum -a 256 "$OUT" | awk '{print $1}')"
          SIZE="$(stat -f%z "$OUT")"
          export SHA SIZE
          python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path("transfer/index.json")
          d=json.loads(p.read_text())
          e={
            "id":"netmirror-1.0.24-stable-player-downloads-tabs",
            "name":"NetMirror 1.0.24 — Stable Player + Downloads",
            "fileName":"NetMirror-1.0.24-Stable-Player-Downloads-Tabs.tipa",
            "type":"tipa",
            "platform":"TrollStore / iOS 15.1+",
            "version":"1.0.24",
            "url":"https://nextjailbreak.com/transfer/files/NetMirror/1.0.24/NetMirror-1.0.24-Stable-Player-Downloads-Tabs.tipa",
            "sha256":os.environ["SHA"],
            "sizeBytes":int(os.environ["SIZE"]),
            "notes":"Rebased on confirmed-working V20 playback and removes the experimental Cast/player changes. Adds iOS-style Home/Downloads tabs, records download links, and opens downloads through the normal iOS browser/Files flow. Original recovered Hermes bundle remains unchanged."
          }
          d["files"]=[x for x in d.get("files",[]) if x.get("id")!=e["id"]]
          d["files"].insert(0,e)
          d["updatedAt"]=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          p.write_text(json.dumps(d,indent=2)+"\n")
          PY

          git checkout HEAD^ -- .github/workflows/build-nextmedia-v13-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT" transfer/index.json .github/workflows/build-nextmedia-v13-temp.yml
          git commit -m "Publish NetMirror 1.0.24 to NS Transfer [skip ci]"
          git push origin HEAD:main
