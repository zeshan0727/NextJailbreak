name: Publish Next Signer 1.4.4 Test to NS Transfer

on:
  push:
    branches:
      - feature/nextsigner-1.4.4-redesign-bulk-resign
    paths:
      - NextSigner/publish-144-transfer-trigger.txt

permissions:
  contents: write
  actions: read

concurrency:
  group: nextsigner-144-transfer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      R2_BUCKET: next-signer-apps
      R2_ACCOUNT_ID: 4fe920e259870b0366118a17cc5727e5
      R2_PUBLIC_BASE: https://files.nextsolution.cc
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Checkout current main for NS Transfer metadata
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download latest verified CI artifact
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" || { echo 'R2 credentials missing'; exit 1; }
          ARTIFACT_ID="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=NextSigner-1.4.4-32-Test&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$ARTIFACT_ID" || { echo 'Verified build artifact not found'; exit 1; }
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/nextsigner.zip"
          mkdir -p "$RUNNER_TEMP/nextsigner"
          unzip -q "$RUNNER_TEMP/nextsigner.zip" -d "$RUNNER_TEMP/nextsigner"
          SRC="$(find "$RUNNER_TEMP/nextsigner" -type f -name 'NextSigner-1.4.4-32.tipa' | head -n1)"
          test -n "$SRC" && test -s "$SRC" || { echo 'TIPA missing'; exit 1; }
          unzip -t "$SRC" >/dev/null
          echo "TIPA_PATH=$SRC" >> "$GITHUB_ENV"
      - name: Install AWS CLI
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Publish TIPA to R2
        run: |
          set -euo pipefail
          KEY="apps/tipa/NextSigner/1.4.4/NextSigner-1.4.4-32.tipa"
          URL="$R2_PUBLIC_BASE/$KEY"
          aws s3 cp "$TIPA_PATH" "s3://$R2_BUCKET/$KEY" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type application/octet-stream \
            --cache-control 'public, max-age=31536000, immutable' \
            --only-show-errors
          curl --fail --silent --show-error --location --head \
            --retry 6 --retry-delay 3 --retry-all-errors "$URL" >/dev/null
          echo "TIPA_URL=$URL" >> "$GITHUB_ENV"
          echo "TIPA_SHA256=$(sha256sum "$TIPA_PATH" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "TIPA_BYTES=$(stat -c '%s' "$TIPA_PATH")" >> "$GITHUB_ENV"
      - name: Add test release to NS Transfer catalog
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path('transfer/index.json')
          obj = json.loads(path.read_text())
          items = obj.get('files', [])
          items = [item for item in items if item.get('id') != 'nextsigner-1.4.4-32-test']
          entry = {
              'id': 'nextsigner-1.4.4-32-test',
              'name': 'Next Signer 1.4.4 Build 32 — Redesign & Bulk Re-sign (Test)',
              'fileName': 'NextSigner-1.4.4-32.tipa',
              'type': 'tipa',
              'platform': 'TrollStore / iOS 16+',
              'version': '1.4.4',
              'url': os.environ['TIPA_URL'],
              'sha256': os.environ['TIPA_SHA256'],
              'sizeBytes': int(os.environ['TIPA_BYTES']),
              'storage': 'Cloudflare R2',
              'notes': 'Test build: redesigned adaptive light/dark UI, Home dashboard, local bulk and selected-app re-signing. Keeps original IPA files. Validate on device before promoting.'
          }
          obj['files'] = [entry] + items
          obj['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          path.write_text(json.dumps(obj, indent=2) + '\n')
          PY
          python3 -m json.tool transfer/index.json > /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json
          git commit -m 'Publish Next Signer 1.4.4 build 32 test to NS Transfer'
          git pull --rebase origin main
          git push origin HEAD:main
