name: Publish NetMirror 1.0.17 to NS Transfer

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-netmirror-1.0.17.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HANDOFF_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-25bc-8211-8453-6ef8407952ec/raw?se=2026-10-06T08%3A27%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=6e325017-7e47-5737-9b19-81e5b9df8133&skoid=37f774a3-b6f2-4e56-9fdd-339e5d6e97f8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A54%3A14Z&ske=2026-10-07T01%3A54%3A14Z&sks=b&skv=2026-02-06&sig=ddqJFhj3dxzlYWPcn1cuW1J9VvOaQ05D/yLwlmR8xQY%3D"
      EXPECTED_TIPA_SHA256: "7802caf750f750e3ab7c2e7fdded6219bdbd650f9d7ebf2f3afdfef47a6d5045"
      EXPECTED_HERMES_SHA256: "42f96376c8971aee304f6806471dbee0b7f94e3de5f329f6365e83088aea2ca6"
      EXPECTED_HERMES_SIZE: "1215512"
      DEST_DIR: "transfer/files/NetMirror/1.0.17"
      DEST_NAME: "NetMirror-1.0.17-Android-WebView-MainFrame-Events-Fix.tipa"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated private build handoff
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 "$HANDOFF_URL" -o /tmp/netmirror-v17.zip
          rm -rf /tmp/netmirror-v17 /tmp/netmirror-payload
          mkdir -p /tmp/netmirror-v17 /tmp/netmirror-payload
          unzip -q /tmp/netmirror-v17.zip -d /tmp/netmirror-v17
          SRC="$(find /tmp/netmirror-v17 -maxdepth 1 -type f -name '*.tipa' | head -n1)"
          test -n "$SRC"
          test "$(sha256sum "$SRC" | awk '{print $1}')" = "$EXPECTED_TIPA_SHA256"

          unzip -q "$SRC" -d /tmp/netmirror-payload
          BUNDLE="$(find /tmp/netmirror-payload -path '*/Payload/*.app/main.jsbundle' | head -n1)"
          test -n "$BUNDLE"
          test "$(stat -c '%s' "$BUNDLE")" = "$EXPECTED_HERMES_SIZE"
          test "$(sha256sum "$BUNDLE" | awk '{print $1}')" = "$EXPECTED_HERMES_SHA256"

          mkdir -p "$DEST_DIR"
          cp "$SRC" "$DEST_DIR/$DEST_NAME"

      - name: Update NS Transfer feed
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p=Path("transfer/index.json")
          data=json.loads(p.read_text())
          entry={
            "id":"netmirror-1.0.17-android-webview-mainframe-events-fix",
            "name":"NetMirror 1.0.17 — Android WebView Main-Frame Events Fix",
            "fileName":"NetMirror-1.0.17-Android-WebView-MainFrame-Events-Fix.tipa",
            "type":"tipa",
            "platform":"TrollStore / iOS 15.1+",
            "version":"1.0.17",
            "url":"https://nextjailbreak.com/transfer/files/NetMirror/1.0.17/NetMirror-1.0.17-Android-WebView-MainFrame-Events-Fix.tipa",
            "sha256":"7802caf750f750e3ab7c2e7fdded6219bdbd650f9d7ebf2f3afdfef47a6d5045",
            "sizeBytes":6415925,
            "notes":"Fixes the remaining splash stall by treating WKNavigationAction.targetFrame.isMainFrame as a valid top-frame signal in addition to request.mainDocumentURL equality. This allows the recovered Android WebView onLoadStart callback to receive the successful iOS main-frame navigation and set webViewLoaded=true. Adds startCB/finishCB diagnostics. Original recovered Hermes bundle remains unchanged."
          }
          data["files"]=[x for x in data.get("files",[]) if x.get("id")!=entry["id"]]
          data["files"].insert(0,entry)
          data["updatedAt"]=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          p.write_text(json.dumps(data,indent=2,ensure_ascii=True)+"\n")
          PY

      - name: Commit publication and remove one-shot handoff
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-netmirror-1.0.17.yml
          git add "$DEST_DIR/$DEST_NAME" transfer/index.json
          git commit -m "Publish NetMirror 1.0.17 to NS Transfer [skip ci]"
          git push origin HEAD:main
