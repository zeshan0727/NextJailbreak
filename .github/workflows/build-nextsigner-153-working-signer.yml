name: Build Next Signer 1.5.3 Restored Working Signer

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nextsigner-1.5.3-restore-working-signer
    paths:
      - 'NextSigner/**'
      - '.github/workflows/build-nextsigner-153-working-signer.yml'

permissions:
  contents: read

concurrency:
  group: nextsigner-153-working-signer-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXTSIGNER_VERSION: '1.5.3'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify restored signer and release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MARKETING_VERSION: "1.5.3"' NextSigner/project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "29"' NextSigner/project.yml
          grep -q '<key>CADisableMinimumFrameDurationOnPhone</key>' NextSigner/Info.plist
          grep -A1 '<key>CADisableMinimumFrameDurationOnPhone</key>' NextSigner/Info.plist | grep -q '<true/>'

          test "$(git hash-object NextSigner/NextSigner/LocalSignerService.swift)" = "a5797f6fd3b8c41345ed0bd78fa75d088ec159ec" || {
            echo 'LocalSignerService no longer matches proven 1.4.2 signing core' >&2
            exit 1
          }

          grep -q 'local.install(app, using: store)' NextSigner/NextSigner/NextSignerLocalViews.swift
          grep -q 'itms-services://?action=download-manifest' NextSigner/NextSigner/LocalSigningController.swift

      - name: Prepare Zsign with proven provisioning fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf NextSigner/Vendor/Zsign-Package
          git clone --depth 1 --branch package https://github.com/claration/Zsign-Package.git NextSigner/Vendor/Zsign-Package

          python3 - <<'PY'
          from pathlib import Path
          import re

          bundle = Path('NextSigner/Vendor/Zsign-Package/src/bundle.cpp')
          text = bundle.read_text()

          already_fixed = re.compile(
              r'if\s*\(!pSignAsset->m_strProvData\.empty\(\)\)\s*\{\s*'
              r'if\s*\(\s*!bRemoveProvision\s*\)'
              r'(?=\s*\{\s*if\s*\(!ZFile::WriteFileV\(pSignAsset->m_strProvData,\s*"%s/embedded\.mobileprovision")',
              re.S
          )
          broken = re.compile(
              r'(if\s*\(!pSignAsset->m_strProvData\.empty\(\)\)\s*\{\s*)'
              r'if\s*\(\s*bRemoveProvision\s*\)'
              r'(?=\s*\{\s*if\s*\(!ZFile::WriteFileV\(pSignAsset->m_strProvData,\s*"%s/embedded\.mobileprovision")',
              re.S
          )

          if already_fixed.search(text):
              print('Zsign provisioning write condition is already fixed upstream.')
          else:
              match = broken.search(text)
              if not match:
                  for m in re.finditer(r'm_strProvData|embedded\.mobileprovision', text):
                      lo = max(0, m.start() - 450)
                      hi = min(len(text), m.start() + 650)
                      print('\n--- candidate ---\n' + text[lo:hi])
                  raise SystemExit('Could not locate the Zsign provisioning write condition')
              text = text[:match.start()] + match.group(1) + 'if (!bRemoveProvision)' + text[match.end():]
              bundle.write_text(text)
              print('Restored the proven 1.4.2 embedded.mobileprovision write fix.')

          verify = bundle.read_text()
          if not already_fixed.search(verify):
              raise SystemExit('Corrected !bRemoveProvision write condition not found after patch')
          PY

      - name: Generate app icon
        run: python3 NextSigner/generate_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: NextSigner
        run: xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: NextSigner
        run: |
          set -euo pipefail
          xcodebuild             -project NextSigner.xcodeproj             -scheme NextSigner             -configuration Release             -sdk iphoneos             -derivedDataPath "$RUNNER_TEMP/NextSignerDerived"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

      - name: Package IPA and TIPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/NextSignerDerived/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP_PATH" || { echo 'Built .app not found'; exit 1; }
          test -f "$APP_PATH/Assets.car" || { echo 'Compiled asset catalog missing'; exit 1; }

          rm -rf "$RUNNER_TEMP/package"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/NextSigner.app"

          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.ipa" Payload
          cp "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.ipa" "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.tipa"

          unzip -t "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.ipa" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/package/Payload/NextSigner.app/Info.plist" | grep -qx '1.5.3'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/package/Payload/NextSigner.app/Info.plist" | grep -qx '29'
          /usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$RUNNER_TEMP/package/Payload/NextSigner.app/Info.plist" | grep -qx 'true'
          shasum -a 256 "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.ipa" "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.tipa"
          stat -f '%N %z bytes' "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.ipa" "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.tipa"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NextSigner-1.5.3-Restored-Working-Signer
          path: |
            ${{ runner.temp }}/NextSigner-1.5.3.ipa
            ${{ runner.temp }}/NextSigner-1.5.3.tipa
          if-no-files-found: error
          retention-days: 30
