name: Publish Next Ledger Build 102 to NS Transfer
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-nextledger-budget102-transfer.yml"
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      BUILD_RUN_ID: "41281937807"
      ARTIFACT_ID: "13073636224"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify successful Build 102 artifact
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" || { echo "R2 credentials unavailable"; exit 1; }
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          python3 - "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/artifacts.json" "$ARTIFACT_ID" <<'PY'
          import json,sys
          run=json.load(open(sys.argv[1]))
          artifacts=json.load(open(sys.argv[2]))['artifacts']
          aid=int(sys.argv[3])
          assert run['conclusion']=='success' and run['name']=='Next Ledger Build 102 Budget Performance Report'
          matches=[a for a in artifacts if a['id']==aid and a['name']=='NextLedger-1.3.84-Build102-BudgetPerformance-UNSIGNED' and not a['expired']]
          assert len(matches)==1, 'No unique verified Build 102 artifact'
          PY
          mkdir -p "$RUNNER_TEMP/nextledger102"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/build102.zip"
          unzip -q "$RUNNER_TEMP/build102.zip" -d "$RUNNER_TEMP/nextledger102"
      - name: Verify IPA checksum and exact bundle
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/nextledger102" -name '*.ipa' -print -quit)"
          SHA="$(find "$RUNNER_TEMP/nextledger102" -name '*.sha256' -print -quit)"
          python3 - "$IPA" "$SHA" <<'PY'
          import sys,hashlib,zipfile,plistlib
          ipa,shafile=sys.argv[1:]
          sha=hashlib.sha256(open(ipa,'rb').read()).hexdigest()
          assert sha==open(shafile).read().split()[0].lower()
          with zipfile.ZipFile(ipa) as f:
            assert f.testzip() is None
            name=next(n for n in f.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist') and n.count('/')==2)
            info=plistlib.loads(f.read(name))
            assert info['CFBundleIdentifier']=='com.nextsolution.dailyledger'
            assert info['CFBundleShortVersionString']=='1.3.84'
            assert info['CFBundleVersion']=='102'
            assert 'iCloud.com.nextsolution.dailyledger' in info.get('NSUbiquitousContainers',{})
          print('Verified IPA',sha)
          PY
          cp "$IPA" "$RUNNER_TEMP/NextLedger-1.3.84-Build102-UNSIGNED.ipa"
          echo "FILE_SHA=$(sha256sum "$IPA" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "FILE_SIZE=$(stat -c %s "$IPA")" >> "$GITHUB_ENV"
      - name: Upload to Cloudflare R2 and verify public URL
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet --break-system-packages awscli
          export PATH="$HOME/.local/bin:$PATH"
          KEY="apps/ipa/NextLedger/1.3.84/build-102/artifact-$ARTIFACT_ID/NextLedger-1.3.84-Build102-UNSIGNED.ipa"
          URL="https://files.nextsolution.cc/$KEY"
          aws s3 cp "$RUNNER_TEMP/NextLedger-1.3.84-Build102-UNSIGNED.ipa" "s3://next-signer-apps/$KEY" --endpoint-url "https://4fe920e259870b0366118a17cc5727e5.r2.cloudflarestorage.com" --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable" --only-show-errors
          curl --fail --silent --show-error --location --head --retry 6 --retry-all-errors "$URL" >/dev/null
          echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"
      - name: Register in NS Transfer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('transfer/index.json')
          doc=json.loads(p.read_text())
          entry={'id':'nextledger-1.3.84-build102-unsigned-ipa',
                 'name':'Next Ledger 1.3.84 Build 102 — Budget Performance (unsigned)',
                 'fileName':'NextLedger-1.3.84-Build102-UNSIGNED.ipa',
                 'type':'ipa',
                 'platform':'iOS 16+ — sign with Next Signer',
                 'version':'1.3.84 (102)',
                 'url':os.environ['PUBLIC_URL'],
                 'sha256':os.environ['FILE_SHA'],
                 'sizeBytes':int(os.environ['FILE_SIZE']),
                 'storage':'Cloudflare R2',
                 'notes':'Budget Performance report: actual paid, % remaining, outside-budget spending, manual matching. UNSIGNED; keep a backup before installing.'}
          doc['files']=[entry]+[x for x in doc.get('files',[]) if x.get('id')!=entry['id']]
          doc['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(doc,indent=2,ensure_ascii=False)+'\n')
          PY
          python3 -m json.tool transfer/index.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json
          if ! git diff --cached --quiet; then
            git commit -m "Register Next Ledger Build 102 in NS Transfer"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
