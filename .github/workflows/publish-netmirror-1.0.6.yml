name: Publish NetMirror 1.0.6 To NS Transfer

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-netmirror-1.0.6.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild TIPA from transfer chunks
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p transfer/files/NetMirror/1.0.6
          cat transfer/builds/NetMirror-1.0.6-chunks/part*.txt | base64 -d > transfer/files/NetMirror/1.0.6/NetMirror-1.0.6-Hermes-Stack-Diagnostic.tipa
          test "$(stat -c%s transfer/files/NetMirror/1.0.6/NetMirror-1.0.6-Hermes-Stack-Diagnostic.tipa)" = "6407038"
          echo "c3e837f081a4032e33978941d029629642aba231d5d12d6ff5f25f5b0a1c09b8  transfer/files/NetMirror/1.0.6/NetMirror-1.0.6-Hermes-Stack-Diagnostic.tipa" | sha256sum -c -

      - name: Add NetMirror v6 to NS Transfer feed
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p=Path("transfer/index.json")
          j=json.loads(p.read_text())
          files=[x for x in j.get("files",[]) if x.get("id")!="netmirror-1.0.6-hermes-stack-diagnostic"]
          files.insert(0,{
            "id":"netmirror-1.0.6-hermes-stack-diagnostic",
            "name":"NetMirror 1.0.6 — Hermes Stack Diagnostic",
            "fileName":"NetMirror-1.0.6-Hermes-Stack-Diagnostic.tipa",
            "type":"tipa",
            "platform":"TrollStore / iOS 15.1+",
            "version":"1.0.6",
            "url":"https://nextjailbreak.com/transfer/files/NetMirror/1.0.6/NetMirror-1.0.6-Hermes-Stack-Diagnostic.tipa",
            "sha256":"c3e837f081a4032e33978941d029629642aba231d5d12d6ff5f25f5b0a1c09b8",
            "sizeBytes":6407038,
            "notes":"Diagnostic build for the remaining startup TypeError. Keeps all previous Android-to-iOS compatibility fixes and changes fatal error reporting so the full Hermes JavaScript stack/function location is shown instead of the generic runtime error."
          })
          j["files"]=files
          p.write_text(json.dumps(j,indent=2)+"\n")
          PY

      - name: Commit NS Transfer package
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transfer/files/NetMirror/1.0.6/NetMirror-1.0.6-Hermes-Stack-Diagnostic.tipa transfer/index.json
          git commit -m "Publish NetMirror 1.0.6 to NS Transfer [skip ci]"
          git push origin HEAD:main
