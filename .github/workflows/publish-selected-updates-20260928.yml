name: Publish selected recent tweak updates - Sep 28

on:
  push:
    branches: [main]
    paths:
      - 'automation/article_batch_20260928.json'
      - 'automation/publish_selected_updates_20260928.py'
      - 'automation/ios_repo_news.py'
      - '.github/workflows/publish-selected-updates-20260928.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nextjailbreak-selected-updates-20260928
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate publisher
        run: |
          python3 -m py_compile automation/publish_selected_updates_20260928.py automation/ios_repo_news.py
          python3 -m unittest automation.tests.test_source_visuals -v

      - name: Generate, verify and publish selected articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: |
          test -n "${OPENAI_API_KEY:-}"
          set -o pipefail
          python3 -u -m automation.publish_selected_updates_20260928 | tee /tmp/selected-updates-20260928.log

      - name: Commit live website updates
        run: |
          git config user.name "nextsolution-publisher[bot]"
          git config user.email "nextsolution-publisher[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          pages = []
          for target in json.loads(Path('automation/article_batch_20260928.json').read_text()):
              slug = target.get('slug')
              if not slug:
                  value = f"{target['name']} {target['version']} update".lower()
                  slug = re.sub(r"[^a-z0-9]+", "-", value).strip("-")[:80] or "ios-update"
              page = Path(slug) / 'index.html'
              if page.exists():
                  pages.append(page)

          ns = Path('nosafariformkeyboard-1-0-0-update/index.html')
          if ns.exists():
              pages.append(ns)

          # Normalize generated HTML before Git's whitespace validation.
          for page in pages:
              text = page.read_text(encoding='utf-8')
              page.write_text(
                  '\n'.join(line.rstrip() for line in text.splitlines()) + '\n',
                  encoding='utf-8'
              )

          subprocess.run([
              'git','add',
              'automation/published-articles.json',
              'automation/source-visual-registry.json',
              'automation/batch-20260928-result.json',
              'index.html','tutorials.html','tutorials/index.html',
              'feed.xml','sitemap.xml','assets/articles/source-media'
          ], check=True)
          for page in pages:
              subprocess.run(['git','add',str(page)],check=True)
          PY
          if git diff --cached --quiet; then
            echo "No website changes to commit."
            exit 0
          fi
          git diff --cached --check -- . ':(exclude)assets/articles/source-media'
          git commit -m "Publish selected recent tweak updates with Monetag"
          git pull --rebase -X ours origin main
          git push origin HEAD:main

      - name: Preserve publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-updates-20260928
          path: |
            /tmp/selected-updates-20260928.log
            automation/batch-20260928-result.json
          if-no-files-found: ignore
          retention-days: 14
