name: Temporary Location Spoofer IPA Build

on:
  push:
    paths:
      - ".github/workflows/location-spoofer-build-temp.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: xweiba/location-spoofer
          ref: v1.0.8
          path: location-spoofer

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build IPA
        working-directory: location-spoofer
        run: ./build.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Location-Spoofer-iOS15plus-unsigned-IPA
          path: location-spoofer/dist/PaopaoLocationSpoofer-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
