name: Next AI TrollStore Test
on:
  pull_request:
    paths:
      - 'next-ai-ios16/**'
      - '.github/workflows/next-ai-ios16.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: next-ai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned inference engines
        run: |
          git clone --depth 1 --branch b5046 https://github.com/ggml-org/llama.cpp.git next-ai-ios16/llama.cpp
          git init next-ai-ios16/photo-engine/stable-diffusion.cpp
          git -C next-ai-ios16/photo-engine/stable-diffusion.cpp remote add origin https://github.com/leejet/stable-diffusion.cpp.git
          git -C next-ai-ios16/photo-engine/stable-diffusion.cpp fetch --depth 1 origin 0d9d6659a7ebb7fc51902d6a96f2ea60bd0e82d6
          git -C next-ai-ios16/photo-engine/stable-diffusion.cpp checkout --detach FETCH_HEAD
          git -C next-ai-ios16/photo-engine/stable-diffusion.cpp submodule update --init --depth 1
      - name: Validate and apply Turbo schedule
        run: |
          c++ -std=c++17 next-ai-ios16/photo-engine/test_turbo.cpp -o /tmp/test-turbo
          /tmp/test-turbo
          python3 next-ai-ios16/photo-engine/patch_turbo.py
      - name: Build isolated photo framework
        run: |
          cmake -S next-ai-ios16/photo-engine -B photo-build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          cmake --build photo-build --config Release --target NextPhoto --parallel 3
      - name: Configure iOS 16 app
        shell: bash
        run: |
          framework=$(find "$PWD/photo-build" -type d -name NextPhoto.framework -print -quit)
          test -n "$framework"
          cmake -S next-ai-ios16 -B next-ai-build -G Xcode \
            -DPHOTO_FRAMEWORK="$framework" \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
      - name: Compile
        run: cmake --build next-ai-build --config Release --target NextAI --parallel 3
      - name: Package and verify TrollStore app
        shell: bash
        run: |
          set -euo pipefail
          app=$(find next-ai-build -type d -name NextAI.app -print -quit)
          framework=$(find photo-build -type d -name NextPhoto.framework -print -quit)
          test -n "$app"
          test -n "$framework"
          mkdir -p "$app/Frameworks"
          cp -R "$framework" "$app/Frameworks/"
          cp next-ai-ios16/llama.cpp/LICENSE "$app/llama-LICENSE.txt"
          cp next-ai-ios16/photo-engine/stable-diffusion.cpp/LICENSE "$app/stable-diffusion-LICENSE.txt"
          cp next-ai-ios16/photo-engine/stable-diffusion.cpp/ggml/LICENSE "$app/photo-ggml-LICENSE.txt"
          codesign --force --sign - "$app/Frameworks/NextPhoto.framework"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose "$app"
          xcrun vtool -show-build "$app/NextAI"
          xcrun vtool -show-build "$app/Frameworks/NextPhoto.framework/NextPhoto"
          xcrun nm -gU "$app/Frameworks/NextPhoto.framework/NextPhoto" > photo-symbols.txt
          grep '_NextPhotoGenerate' photo-symbols.txt
          if grep -E ' _ggml_| _llama_' photo-symbols.txt; then exit 1; fi
          xcrun nm -a "$app/Frameworks/NextPhoto.framework/NextPhoto" > photo-all-symbols.txt
          grep 'OBJC_CLASS_.*NextPhotoGGMLMetalClass' photo-all-symbols.txt
          if grep 'OBJC_CLASS_.*_GGMLMetalClass' photo-all-symbols.txt; then exit 1; fi
          xcrun otool -L "$app/NextAI" > linked-libraries.txt
          grep '@rpath/NextPhoto.framework/NextPhoto' linked-libraries.txt
          mkdir -p package/Payload
          cp -R "$app" package/Payload/
          cp next-ai-ios16/README.md package/README.md
          cd package
          zip -qry NextAI-0.3.0-Turbo.tipa Payload
          shasum -a 256 NextAI-0.3.0-Turbo.tipa > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NextAI-0.3.0-Turbo
          path: |
            package/NextAI-0.3.0-Turbo.tipa
            package/SHA256.txt
            package/README.md
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NextAI-0.3.0-Turbo
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          sha256sum -c SHA256.txt
          gh release create next-ai-0.3.0 NextAI-0.3.0-Turbo.tipa SHA256.txt --target "$BUILD_SHA" --title "Next AI 0.3.0 Turbo" --notes "Offline chat and photos for iOS 16 / TrollStore. Adds SD-Turbo 1/2/4-step mode, correct trailing schedule, and generation timings. Install over existing app to retain data. Device speed testing required."
      - name: Publish NS Transfer catalog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, base64, hashlib, urllib.request, urllib.error, datetime
          from pathlib import Path
          name="NextAI-0.3.0-Turbo.tipa"
          data=Path(name).read_bytes()
          repo=os.environ["GITHUB_REPOSITORY"]
          url=f"https://api.github.com/repos/{repo}/contents/transfer/index.json"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}
          for attempt in range(3):
              with urllib.request.urlopen(urllib.request.Request(url+"?ref=main",headers=headers)) as r:
                  current=json.load(r)
              catalog=json.loads(base64.b64decode(current["content"]))
              entry={"id":"next-ai-0.3.0","name":"Next AI 0.3.0 Turbo","fileName":name,"type":"tipa","platform":"TrollStore / iOS 16+","version":"0.3.0","url":f"https://github.com/{repo}/releases/download/next-ai-0.3.0/{name}","sha256":hashlib.sha256(data).hexdigest(),"sizeBytes":len(data),"storage":"GitHub Release fallback","notes":"Offline chat + photos. Fast SD-Turbo mode with 1/2/4 steps. Requires separate SD-Turbo GGUF download. Install over existing Next AI."}
              catalog["files"]=[entry]+[x for x in catalog["files"] if x.get("id")!=entry["id"]]
              catalog["updatedAt"]=datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00","Z")
              payload={"message":"Publish Next AI 0.3.0 Turbo to NS Transfer","branch":"main","sha":current["sha"],"content":base64.b64encode((json.dumps(catalog,indent=2)+"\n").encode()).decode()}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps(payload).encode(),headers=headers,method="PUT")) as r:
                      result=json.load(r)
                  print("Published catalog commit",result["commit"]["sha"])
                  print("SHA256",entry["sha256"],"bytes",entry["sizeBytes"])
                  break
              except urllib.error.HTTPError as e:
                  if e.code!=409 or attempt==2: raise
          PY
