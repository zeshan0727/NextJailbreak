name: Publish NetMirror 1.0.9 To NS Transfer

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-netmirror-1.0.9.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild TIPA from transfer chunks
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p transfer/files/NetMirror/1.0.9
          cat transfer/builds/NetMirror-1.0.9-chunks/part*.txt | base64 -d > transfer/files/NetMirror/1.0.9/NetMirror-1.0.9-Startup-Network-Diagnostic.tipa
          test "$(stat -c%s transfer/files/NetMirror/1.0.9/NetMirror-1.0.9-Startup-Network-Diagnostic.tipa)" = "6413944"
          echo "af09b2da628dbaee5746dc5a8333022bdbd79614db3a1720107d5909d01bdff9  transfer/files/NetMirror/1.0.9/NetMirror-1.0.9-Startup-Network-Diagnostic.tipa" | sha256sum -c -

      - name: Add NetMirror v9 to NS Transfer feed
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          p=Path("transfer/index.json")
          j=json.loads(p.read_text())
          files=[x for x in j.get("files",[]) if x.get("id")!="netmirror-1.0.9-startup-network-diagnostic"]
          files.insert(0,{
            "id":"netmirror-1.0.9-startup-network-diagnostic",
            "name":"NetMirror 1.0.9 — Startup Network Diagnostic",
            "fileName":"NetMirror-1.0.9-Startup-Network-Diagnostic.tipa",
            "type":"tipa",
            "platform":"TrollStore / iOS 15.1+",
            "version":"1.0.9",
            "url":"https://nextjailbreak.com/transfer/files/NetMirror/1.0.9/NetMirror-1.0.9-Startup-Network-Diagnostic.tipa",
            "sha256":"af09b2da628dbaee5746dc5a8333022bdbd79614db3a1720107d5909d01bdff9",
            "sizeBytes":6413944,
            "notes":"Diagnostic follow-up to 1.0.8. Keeps the exact original Hermes bundle and all existing compatibility shims, and adds on-device startup networking diagnostics for the bootstrap /check.php requests (request start/end, host, timeout, HTTP status/error, response byte count). This is intended to diagnose the remaining red-dot splash hang without changing app startup logic."
          })
          j["files"]=files
          j["updatedAt"]=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          p.write_text(json.dumps(j,indent=2)+"\n")
          PY

      - name: Commit NS Transfer package
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transfer/files/NetMirror/1.0.9/NetMirror-1.0.9-Startup-Network-Diagnostic.tipa transfer/index.json
          if git diff --cached --quiet; then
            echo "No publish changes"
          else
            git commit -m "Publish NetMirror 1.0.9 to NS Transfer [skip ci]"
            git push origin HEAD:main
          fi
