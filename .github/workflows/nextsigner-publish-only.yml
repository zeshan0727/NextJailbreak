name: Next Signer - Publish Only

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Next Signer request ID
        required: false
        default: ''
        type: string
      staging_asset:
        description: IPA/TIPA asset in the Next Signer inbox release
        required: true
        type: string
      requested_name:
        description: Requested display name used only as metadata fallback
        required: false
        default: ''
        type: string
      requested_bundle_id:
        description: Requested bundle ID used only as metadata fallback
        required: false
        default: ''
        type: string
      custom_icon_asset:
        required: false
        default: ''
        type: string
      tweak_assets_json:
        required: false
        default: '[]'
        type: string

permissions:
  contents: write

concurrency:
  group: nextsigner-publish
  cancel-in-progress: false

jobs:
  publish-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REQUEST_ID: ${{ inputs.request_id }}
      INBOX_TAG: nextsigner-inbox
      R2_BUCKET: next-signer-apps
      R2_PUBLIC_BASE: https://files.nextsolution.cc
      R2_ACCOUNT_ID: 4fe920e259870b0366118a17cc5727e5
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      CUSTOM_ICON_ASSET: ${{ inputs.custom_icon_asset }}
      TWEAK_ASSETS_JSON: ${{ inputs.tweak_assets_json }}

    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Log • download staged IPA
        continue-on-error: true
        run: bash .github/scripts/nextsigner-publish-status.sh running Download "Downloading the IPA for publish-only mode."

      - name: Download staged IPA
        env:
          STAGING_ASSET: ${{ inputs.staging_asset }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$INBOX_TAG" --jq '.id')"
          test -n "$RELEASE_ID" || { echo 'Signing inbox release not found'; exit 1; }
          ASSETS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100")"
          APP_ASSET_ID="$(printf '%s' "$ASSETS_JSON" | jq -r --arg name "$STAGING_ASSET" '.[] | select(.name==$name) | .id' | head -n1)"
          test -n "$APP_ASSET_ID" && test "$APP_ASSET_ID" != null || { echo "Staged app not found: $STAGING_ASSET"; exit 1; }
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$APP_ASSET_ID" > "$RUNNER_TEMP/published.ipa"
          test -s "$RUNNER_TEMP/published.ipa"
          unzip -t "$RUNNER_TEMP/published.ipa" >/dev/null
          echo "INBOX_RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

      - name: Log • read original metadata
        continue-on-error: true
        run: bash .github/scripts/nextsigner-publish-status.sh running Metadata "Reading the original IPA name, bundle ID, version and build."

      - name: Read original app metadata
        env:
          REQUESTED_NAME: ${{ inputs.requested_name }}
          REQUESTED_BUNDLE_ID: ${{ inputs.requested_bundle_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib, re, zipfile
          ipa = os.path.join(os.environ['RUNNER_TEMP'], 'published.ipa')
          with zipfile.ZipFile(ipa) as z:
              infos = [n for n in z.namelist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', n)]
              if not infos:
                  raise SystemExit('Main app Info.plist not found')
              info = plistlib.loads(z.read(infos[0]))
          name = str(info.get('CFBundleDisplayName') or info.get('CFBundleName') or os.environ.get('REQUESTED_NAME') or 'Published App')
          bundle_id = str(info.get('CFBundleIdentifier') or os.environ.get('REQUESTED_BUNDLE_ID') or 'com.nextsolution.publishedapp')
          version = str(info.get('CFBundleShortVersionString') or '1.0')
          build = str(info.get('CFBundleVersion') or '1')
          minimum = str(info.get('MinimumOSVersion') or 'Unknown')
          slug = re.sub(r'[^a-z0-9]+', '-', bundle_id.lower()).strip('-')[-70:] or 'published-app'
          vslug = re.sub(r'[^A-Za-z0-9._-]+', '-', version).strip('-') or '1.0'
          bslug = re.sub(r'[^A-Za-z0-9._-]+', '-', build).strip('-') or '1'
          filename = f'{slug}-{vslug}-{bslug}.ipa'
          values = {
              'APP_NAME': name,
              'APP_BUNDLE_ID': bundle_id,
              'APP_VERSION': version,
              'APP_BUILD': build,
              'APP_MINIMUM_OS': minimum,
              'APP_SLUG': slug,
              'APP_VERSION_SLUG': vslug,
              'APP_BUILD_SLUG': bslug,
              'PUBLISHED_FILENAME': filename,
              'R2_OBJECT_KEY': f'apps/ipa/{slug}/{vslug}/{filename}',
          }
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for k,v in values.items(): print(f'{k}={v}', file=f)
          PY
          echo "PUBLISHED_SHA256=$(sha256sum "$RUNNER_TEMP/published.ipa" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "PUBLISHED_SIZE=$(stat -c '%s' "$RUNNER_TEMP/published.ipa")" >> "$GITHUB_ENV"

      - name: Log • upload original IPA
        continue-on-error: true
        run: bash .github/scripts/nextsigner-publish-status.sh running "R2 Upload" "Uploading the original IPA without re-signing it."

      - name: Publish IPA to Cloudflare R2
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID:-}" && test -n "${AWS_SECRET_ACCESS_KEY:-}" || { echo 'Cloudflare R2 credentials are required for publish-only mode'; exit 1; }
          python3 -m pip install --user --quiet awscli
          export PATH="$HOME/.local/bin:$PATH"
          cp "$RUNNER_TEMP/published.ipa" "$RUNNER_TEMP/$PUBLISHED_FILENAME"
          aws s3 cp "$RUNNER_TEMP/$PUBLISHED_FILENAME" "s3://$R2_BUCKET/$R2_OBJECT_KEY" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type 'application/octet-stream' \
            --cache-control 'public, max-age=31536000, immutable' \
            --only-show-errors
          echo "PUBLISHED_URL=$R2_PUBLIC_BASE/$R2_OBJECT_KEY" >> "$GITHUB_ENV"

      - name: Log • verify published IPA
        continue-on-error: true
        run: bash .github/scripts/nextsigner-publish-status.sh running "R2 Verify" "Verifying the public IPA URL."

      - name: Verify published IPA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --head --retry 8 --retry-delay 3 --retry-all-errors "$PUBLISHED_URL" >/dev/null

      - name: Log • extract icon
        continue-on-error: true
        run: bash .github/scripts/nextsigner-publish-status.sh running Icon "Extracting the original app icon."

      - name: Extract original app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p install/icons
          python3 - <<'PY'
          import os, pathlib, plistlib, re, struct, zipfile
          ipa = pathlib.Path(os.environ['RUNNER_TEMP']) / 'published.ipa'
          outdir = pathlib.Path('install/icons')
          target = outdir / f"{os.environ['APP_SLUG']}-{os.environ['PUBLISHED_SHA256'][:12]}.png"
          def dims(data):
              if not data.startswith(b'\x89PNG\r\n\x1a\n'): return (0,0)
              p=8
              while p+24<=len(data):
                  ln=struct.unpack('>I',data[p:p+4])[0]
                  if data[p+4:p+8]==b'IHDR': return struct.unpack('>II',data[p+8:p+16])
                  p += 12+ln
              return (0,0)
          with zipfile.ZipFile(ipa) as z:
              infos=[n for n in z.namelist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist',n)]
              info_path=infos[0]; info=plistlib.loads(z.read(info_path)); root=info_path.rsplit('/',1)[0]+'/'
              declared=[]
              for v in (info.get('CFBundleIconFile'),info.get('CFBundleIconFiles')):
                  if isinstance(v,str): declared.append(v)
                  elif isinstance(v,list): declared.extend(map(str,v))
              for key in ('CFBundleIcons','CFBundleIcons~ipad'):
                  d=info.get(key)
                  if isinstance(d,dict):
                      p=d.get('CFBundlePrimaryIcon')
                      if isinstance(p,dict) and isinstance(p.get('CFBundleIconFiles'),list): declared.extend(map(str,p['CFBundleIconFiles']))
              declared=[pathlib.PurePosixPath(x).stem.lower().replace('@2x','').replace('@3x','') for x in declared]
              c=[]
              for m in z.namelist():
                  if not m.startswith(root) or '/' in m[len(root):] or not m.lower().endswith('.png'): continue
                  stem=pathlib.PurePosixPath(m).stem.lower().replace('@2x','').replace('@3x','')
                  match=any(stem==d or stem.startswith(d) or d.startswith(stem) for d in declared if d) or 'appicon' in stem or 'icon' in stem
                  if not match: continue
                  data=z.read(m); w,h=dims(data); c.append(((min(w,h),w*h,len(data)),m,data))
              if c:
                  _,m,data=max(c,key=lambda x:x[0]); target.write_bytes(data); print(target)
          PY
          ICON_FILE="$(find install/icons -maxdepth 1 -type f -name "${APP_SLUG}-${PUBLISHED_SHA256:0:12}.png" -print -quit)"
          if [ -n "$ICON_FILE" ] && [ -s "$ICON_FILE" ]; then
            rm -f install/icons/${APP_SLUG}-*.png.old 2>/dev/null || true
            echo "ICON_URL=/${ICON_FILE}" >> "$GITHUB_ENV"
          else
            echo 'ICON_URL=/apple-touch-icon.png' >> "$GITHUB_ENV"
          fi

      - name: Log • generate installer entry
        continue-on-error: true
        run: bash .github/scripts/nextsigner-publish-status.sh running Manifest "Generating the installer manifest and catalog entry."

      - name: Publish manifest and catalog entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, plistlib
          from datetime import date
          from pathlib import Path
          root=Path('install')
          app={
            'id':os.environ['APP_SLUG'],'name':os.environ['APP_NAME'],'version':os.environ['APP_VERSION'],'build':os.environ['APP_BUILD'],
            'platform':'iPhone','minimumOS':('iOS '+os.environ['APP_MINIMUM_OS']+'+') if os.environ['APP_MINIMUM_OS']!='Unknown' else 'iOS',
            'bundleId':os.environ['APP_BUNDLE_ID'],'icon':os.environ['ICON_URL'],'manifest':f"/install/{os.environ['APP_SLUG']}.plist",
            'available':True,'status':'Ready to install','downloadURL':os.environ['PUBLISHED_URL'],'sha256':os.environ['PUBLISHED_SHA256'],
            'sizeBytes':int(os.environ['PUBLISHED_SIZE']),'storage':'Cloudflare R2','duplicateSigned':False,'tweakCount':0,'customIcon':False,'signedByNextSigner':False
          }
          cp=root/'apps.json'; catalog=json.loads(cp.read_text()) if cp.exists() else {'catalog':'Next Jailbreak Private Apps','updated':'','apps':[]}
          catalog['apps']=[app]+[x for x in catalog.get('apps',[]) if x.get('id')!=app['id']]; catalog['updated']=date.today().isoformat(); cp.write_text(json.dumps(catalog,indent=2)+'\n')
          icon=os.environ['ICON_URL']; icon_abs=icon if icon.startswith('http') else 'https://nextjailbreak.com'+icon
          manifest={'items':[{'assets':[{'kind':'software-package','url':os.environ['PUBLISHED_URL']},{'kind':'display-image','needs-shine':False,'url':icon_abs},{'kind':'full-size-image','needs-shine':False,'url':icon_abs}], 'metadata':{'bundle-identifier':os.environ['APP_BUNDLE_ID'],'bundle-version':os.environ['APP_BUILD'],'kind':'software','title':os.environ['APP_NAME']}}]}
          with open(root/f"{os.environ['APP_SLUG']}.plist",'wb') as f: plistlib.dump(manifest,f,fmt=plistlib.FMT_XML,sort_keys=False)
          PY

      - name: Log • commit site catalog
        continue-on-error: true
        run: bash .github/scripts/nextsigner-publish-status.sh running Site "Committing the publish-only app to the installer."

      - name: Commit catalog update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install/apps.json "install/$APP_SLUG.plist" install/icons || true
          if ! git diff --cached --quiet; then
            git commit -m "Publish $APP_NAME without re-signing via Next Signer"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Remove staging assets after success
        if: success()
        continue-on-error: true
        env:
          STAGING_ASSET: ${{ inputs.staging_asset }}
        shell: bash
        run: |
          set -u
          ASSETS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/$INBOX_RELEASE_ID/assets?per_page=100")"
          delete_name(){ local n="$1"; [ -n "$n" ] || return 0; local id; id="$(printf '%s' "$ASSETS_JSON" | jq -r --arg n "$n" '.[]|select(.name==$n)|.id'|head -n1)"; [ -z "$id" ] || [ "$id" = null ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" || true; }
          delete_name "$STAGING_ASSET"
          delete_name "$CUSTOM_ICON_ASSET"
          printf '%s' "$TWEAK_ASSETS_JSON" | jq -r '.[]' | while IFS= read -r a; do delete_name "$a"; done

      - name: Report publish success
        if: success()
        continue-on-error: true
        run: bash .github/scripts/nextsigner-publish-status.sh success Complete "Original IPA uploaded, verified and added to the installer without re-signing."

      - name: Report publish failure
        if: failure()
        continue-on-error: true
        run: bash .github/scripts/nextsigner-publish-status.sh failed "${CURRENT_STAGE:-Unknown}" "Publish-only mode failed during ${CURRENT_STAGE:-an unknown stage}."
