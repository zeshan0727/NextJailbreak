name: Next Ledger 1.3.84 Build 106 - App Store Preflight

on:
  push:
    branches: [fix/nextledger-appstore106-branding-audit]
    paths:
      - ".github/workflows/nextledger-appstore-106-preflight.yml"
      - ".github/scripts/nextledger_appstore_brand_audit.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextledger-appstore-build106-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - name: Checkout dedicated App Store source
        uses: actions/checkout@v4
        with:
          ref: feature/nextledger-1.3.84-build106-budget-performance-entry

      - name: Checkout independently versioned App Store release checks
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: |
            .github/scripts/nextledger_appstore_brand_audit.py
          sparse-checkout-cone-mode: false

      - name: Stage clean source outside studio-named repository path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ledger-appstore-source/.release-tooling/.github/scripts"
          cp -R DailyLedger Tests project.yml "$RUNNER_TEMP/ledger-appstore-source/"
          cp .release-tooling/.github/scripts/nextledger_appstore_brand_audit.py "$RUNNER_TEMP/ledger-appstore-source/.release-tooling/.github/scripts/"
          test -f "$RUNNER_TEMP/ledger-appstore-source/project.yml"

      - name: Prepare App Store identity and remove legacy branding
        shell: bash
        run: |
          cd "$RUNNER_TEMP/ledger-appstore-source"
          set -euo pipefail
          python3 .release-tooling/.github/scripts/nextledger_appstore_brand_audit.py --prepare

      - name: Require supported App Store SDK and preserve correct identity
        shell: bash
        run: |
          cd "$RUNNER_TEMP/ledger-appstore-source"
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          python3 -c 'import sys; assert int(sys.argv[1].split(".")[0]) >= 26, "App Store requires iOS 26+ SDK"' "$SDK_VERSION"
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.nextledger' project.yml
          grep -Fq 'DEVELOPMENT_TEAM: T52CDY8W32' project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "106"' project.yml
          grep -Fq 'MARKETING_VERSION: "1.3.84"' project.yml
          grep -Fq 'CloudDocuments' DailyLedger/DailyLedger.entitlements
          grep -Fq 'iCloud.com.nextsolution.dailyledger' DailyLedger/DailyLedger.entitlements
          grep -Fq 'iCloud.com.nextsolution.dailyledger' DailyLedger/Info.plist
          grep -Fq 'static let taskIdentifier = "com.nextsolution.nextledger.backup-refresh"' DailyLedger/Services/BackupSyncService.swift
          grep -Fq 'Sync Across Devices' DailyLedger/Views/SettingsView.swift
          grep -Fq 'SettingsGroupedDetailPage(title: "Backup & Sync")' DailyLedger/Views/SettingsView.swift
          ! grep -Fq 'Section("ERP Accounting")' DailyLedger/Views/ReportsView.swift
          ! grep -Fq 'Section("Accounting Registers")' DailyLedger/Views/ReportsView.swift
          ! grep -Fq 'Section("Statements & Aging")' DailyLedger/Views/ReportsView.swift
          plutil -lint DailyLedger/DailyLedger.entitlements DailyLedger/Info.plist

      - name: Run ledger regression tests
        shell: bash
        run: |
          cd "$RUNNER_TEMP/ledger-appstore-source"
          set -euo pipefail
          xcrun swiftc DailyLedger/Models/MonthlyFixedBudget.swift Tests/NextLedgerBudget/main.swift -o /tmp/nextledger-budget-tests
          /tmp/nextledger-budget-tests
          xcrun swiftc DailyLedger/Services/SafeDeviceMerge.swift Tests/NextLedgerDeviceSync/main.swift -o /tmp/nextledger-device-sync-tests
          /tmp/nextledger-device-sync-tests

      - name: Run Build 106 Budget Performance regression tests
        shell: bash
        run: |
          cd "$RUNNER_TEMP/ledger-appstore-source"
          set -euo pipefail
          xcrun swiftc DailyLedger/Models/MonthlyFixedBudget.swift DailyLedger/Services/BudgetPerformanceEngine.swift Tests/NextLedgerBudgetPerformance/main.swift -o /tmp/nextledger-appstore-budget106
          /tmp/nextledger-appstore-budget106
          grep -Fq 'Actual vs Forecast' DailyLedger/Views/BudgetPerformanceReportView.swift
          grep -Fq 'BudgetPerformanceReportView(initialCycle: displayedCycle)' DailyLedger/Views/FixedBudgetDashboardView.swift
          grep -Fq 'Books vs Messages Balance' DailyLedger/Views/ReportsView.swift

      - name: Generate Xcode project
        shell: bash
        run: |
          cd "$RUNNER_TEMP/ledger-appstore-source"
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Compile unsigned iOS 26 or newer App Store configuration
        shell: bash
        run: |
          cd "$RUNNER_TEMP/ledger-appstore-source"
          set -o pipefail
          xcodebuild -project DailyLedger.xcodeproj -scheme DailyLedger \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/nextledger-appstore-106 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/nextledger-appstore-106.log

      - name: Verify app identity and prepare unsigned preflight artifact
        shell: bash
        run: |
          cd "$RUNNER_TEMP/ledger-appstore-source"
          set -euo pipefail
          APP="$(find /tmp/nextledger-appstore-106/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          python3 .release-tooling/.github/scripts/nextledger_appstore_brand_audit.py --app-audit "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = 'com.nextsolution.nextledger'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" = '1.3.84'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" = '106'
          test "$(/usr/libexec/PlistBuddy -c 'Print NSUbiquitousContainers:iCloud.com.nextsolution.dailyledger:NSUbiquitousContainerIsDocumentScopePublic' "$APP/Info.plist")" = 'true'
          test "$(/usr/libexec/PlistBuddy -c 'Print BGTaskSchedulerPermittedIdentifiers:0' "$APP/Info.plist")" = 'com.nextsolution.nextledger.backup-refresh'
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.84-Build106-APPSTORE-PREFLIGHT-UNSIGNED.ipa
          unzip -t NextLedger-1.3.84-Build106-APPSTORE-PREFLIGHT-UNSIGNED.ipa >/dev/null
          cp DailyLedger/DailyLedger.entitlements NextLedger-1.3.84-Build106-APPSTORE-ENTITLEMENTS-TEMPLATE.plist
          shasum -a 256 NextLedger-1.3.84-Build106-APPSTORE-PREFLIGHT-UNSIGNED.ipa > NextLedger-1.3.84-Build106-APPSTORE-PREFLIGHT-UNSIGNED.sha256
          echo 'PREFLIGHT ONLY: Unsigned archive cannot be uploaded to App Store Connect.'
          echo 'Publishing requires an Apple App Store Distribution profile authorizing the EXACT com.nextsolution.nextledger App ID and iCloud.com.nextsolution.dailyledger container.'
          echo 'Never use the Ad Hoc / TrollStore signing profile for App Store distribution.'

      - name: Upload App Store SDK preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.84-Build106-AppStore-Preflight-UNSIGNED
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ledger-appstore-source/NextLedger-1.3.84-Build106-APPSTORE-PREFLIGHT-UNSIGNED.ipa
            ${{ runner.temp }}/ledger-appstore-source/NextLedger-1.3.84-Build106-APPSTORE-ENTITLEMENTS-TEMPLATE.plist
            ${{ runner.temp }}/ledger-appstore-source/NextLedger-1.3.84-Build106-APPSTORE-PREFLIGHT-UNSIGNED.sha256
