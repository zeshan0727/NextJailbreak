name: Deploy TIPA Search Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-tipa-search.yml"
      - "cloudflare/tipa-search/**"

permissions:
  contents: read

concurrency:
  group: tipa-search-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate deployment secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "${TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN missing" >&2; exit 1; }
          test -n "${ACCOUNT:-}" || { echo "CLOUDFLARE_ACCOUNT_ID missing" >&2; exit 1; }
          test -n "${OPENAI:-}" || { echo "OPENAI_API_KEY missing" >&2; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Resolve or create rate-limit database
        id: db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 list --json > /tmp/d1.json
          DB_ID=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/d1.json'))
          for item in data:
              if item.get('name') == 'tipa-search-rate':
                  print(item.get('uuid') or item.get('id') or '')
                  break
          PY
          )
          if [ -z "$DB_ID" ]; then
            wrangler d1 create tipa-search-rate
            wrangler d1 list --json > /tmp/d1.json
            DB_ID=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/d1.json'))
          for item in data:
              if item.get('name') == 'tipa-search-rate':
                  print(item.get('uuid') or item.get('id') or '')
                  break
          PY
            )
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Build deployment config
        env:
          DB_ID: ${{ steps.db.outputs.database_id }}
        run: |
          cat > cloudflare/tipa-search/wrangler.deploy.toml <<EOF
          name = "tipa-search"
          main = "worker.js"
          compatibility_date = "2026-09-21"
          workers_dev = false

          routes = [
            { pattern = "search.nextjailbreak.com", custom_domain = true }
          ]

          [[d1_databases]]
          binding = "RATE_DB"
          database_name = "tipa-search-rate"
          database_id = "$DB_ID"
          EOF

      - name: Apply rate-limit schema
        working-directory: cloudflare/tipa-search
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute tipa-search-rate --remote --file=schema.sql --config=wrangler.deploy.toml --yes

      - name: Deploy search worker
        working-directory: cloudflare/tipa-search
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config=wrangler.deploy.toml

      - name: Set OpenAI secret
        working-directory: cloudflare/tipa-search
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printf '%s' "$OPENAI_API_KEY" | wrangler secret put OPENAI_API_KEY --config=wrangler.deploy.toml

      - name: Verify health and live Patrol search
        run: |
          set -euo pipefail
          sleep 8
          curl --fail --retry 4 --retry-delay 3 --max-time 30             https://search.nextjailbreak.com/health | grep -q '"ok":true'

          curl --fail --retry 2 --retry-delay 4 --max-time 120             "https://search.nextjailbreak.com/api/tipa/search?q=patrol%202012"             -o /tmp/patrol.json

          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/patrol.json'))
          listings=data.get('listings') or []
          if not listings:
              raise SystemExit('Patrol 2012 backend verification returned zero listings')
          for item in listings:
              url=item.get('url','')
              if not url.startswith('https://'):
                  raise SystemExit(f'Non-HTTPS listing returned: {url}')
          print(f"Verified {len(listings)} Patrol 2012 direct listings")
          print(json.dumps(listings[:3], indent=2)[:3000])
          PY
