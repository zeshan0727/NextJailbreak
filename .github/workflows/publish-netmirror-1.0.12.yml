name: Publish NetMirror 1.0.12 To NS Transfer

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-netmirror-1.0.12.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild TIPA from transfer chunks
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p transfer/files/NetMirror/1.0.12
          cat transfer/builds/NetMirror-1.0.12-chunks/part*.txt | base64 -d > transfer/files/NetMirror/1.0.12/NetMirror-1.0.12-Bridge-Delivery-Fix.tipa
          test "$(stat -c%s transfer/files/NetMirror/1.0.12/NetMirror-1.0.12-Bridge-Delivery-Fix.tipa)" = "6414068"
          echo "e32c10f0f738619daffdb681788b155989a00bd362590aec660343632566146c  transfer/files/NetMirror/1.0.12/NetMirror-1.0.12-Bridge-Delivery-Fix.tipa" | sha256sum -c -

      - name: Add NetMirror v12 to NS Transfer feed
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          p=Path("transfer/index.json")
          j=json.loads(p.read_text())
          files=[x for x in j.get("files",[]) if x.get("id")!="netmirror-1.0.12-bridge-delivery-fix"]
          files.insert(0,{
            "id":"netmirror-1.0.12-bridge-delivery-fix",
            "name":"NetMirror 1.0.12 — Bridge Delivery Fix",
            "fileName":"NetMirror-1.0.12-Bridge-Delivery-Fix.tipa",
            "type":"tipa",
            "platform":"TrollStore / iOS 15.1+",
            "version":"1.0.12",
            "url":"https://nextjailbreak.com/transfer/files/NetMirror/1.0.12/NetMirror-1.0.12-Bridge-Delivery-Fix.tipa",
            "sha256":"e32c10f0f738619daffdb681788b155989a00bd362590aec660343632566146c",
            "sizeBytes":6414068,
            "notes":"Targets the remaining bootstrap hang after 1.0.11 proved the first mobiledetect check succeeds and native response/data/complete events are constructed. Network event delivery now resolves the active React Native bridge via self.bridge with RCTBridge.currentBridge fallback and reports BRIDGE/QUEUE diagnostics. Original Hermes bundle and all previous compatibility shims remain unchanged."
          })
          j["files"]=files
          j["updatedAt"]=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          p.write_text(json.dumps(j,indent=2)+"\n")
          PY

      - name: Commit NS Transfer package
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transfer/files/NetMirror/1.0.12/NetMirror-1.0.12-Bridge-Delivery-Fix.tipa transfer/index.json
          if git diff --cached --quiet; then
            echo "No publish changes"
          else
            git commit -m "Publish NetMirror 1.0.12 to NS Transfer [skip ci]"
            git push origin HEAD:main
          fi
