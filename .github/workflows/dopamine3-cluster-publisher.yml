name: Dopamine 3 traffic cluster publisher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "automation/dopamine3-cluster-trigger.json"
  schedule:
    # 00:00 UTC = 03:00 Qatar
    - cron: "0 0 * * *"
    # 12:00 UTC = 15:00 Qatar
    - cron: "0 12 * * *"
  pull_request:
    paths:
      - "automation/dopamine_cluster.py"
      - "automation/dopamine_cluster_quality.py"
      - "automation/source_visuals.py"
      - "automation/dopamine3-cluster.json"
      - "automation/dopamine3-cluster-state.json"
      - "automation/social-queue.json"
      - "automation/tests/test_dopamine_cluster.py"
      - "automation/tests/test_source_visuals.py"
      - ".github/workflows/dopamine3-cluster-publisher.yml"

permissions:
  contents: read

concurrency:
  group: nextsolution-content-state
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run deterministic tests
        run: python3 -m unittest discover -s automation/tests -v

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check encrypted OpenAI secret
        id: api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Dopamine 3 publisher paused" >> "$GITHUB_STEP_SUMMARY"
            echo "OPENAI_API_KEY is not configured as an encrypted repository secret." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate source-grounded 9 out of 10 cluster page
        if: steps.api.outputs.enabled == 'true'
        id: cluster
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        shell: bash
        run: |
          set +e
          python3 -m automation.dopamine_cluster_quality \
            --repository-root . \
            --run-id "$GITHUB_RUN_ID" \
            --confirm-live \
            --github-output "$GITHUB_OUTPUT" 2>&1 | tee dopamine-cluster-run.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "reason=publisher-error" >> "$GITHUB_OUTPUT"
            echo "target_path=" >> "$GITHUB_OUTPUT"
            RUN_ID="$GITHUB_RUN_ID" RUN_NUMBER="$GITHUB_RUN_NUMBER" STATUS="$status" python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          log_path = Path("dopamine-cluster-run.log")
          log = log_path.read_text(encoding="utf-8", errors="replace") if log_path.exists() else ""
          tail = log[-6000:]
          payload = {
              "schema_version": 1,
              "status": "error",
              "exit_code": int(os.environ["STATUS"]),
              "run_id": os.environ["RUN_ID"],
              "run_number": os.environ["RUN_NUMBER"],
              "recorded_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "diagnostic_tail": tail,
          }
          Path("automation/dopamine3-last-run.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          fi
          exit 0

      - name: Commit approved cluster publication
        if: steps.cluster.outputs.published == 'true'
        env:
          TARGET_PATH: ${{ steps.cluster.outputs.target_path }}
          ARTICLE_TITLE: ${{ steps.cluster.outputs.title }}
          TOPIC_ID: ${{ steps.cluster.outputs.topic_id }}
        run: |
          git config user.name "nextsolution-publisher[bot]"
          git config user.email "nextsolution-publisher[bot]@users.noreply.github.com"
          if [ -f automation/dopamine3-last-run.json ]; then
            git rm -f -- automation/dopamine3-last-run.json
          fi
          git add -- \
            "$TARGET_PATH" \
            index.html \
            tutorials.html \
            feed.xml \
            sitemap.xml \
            automation/published-articles.json \
            automation/dopamine3-cluster-state.json \
            automation/social-queue.json \
            automation/source-visual-registry.json \
            assets/articles/source-media
          git commit -m "Publish source-grounded Dopamine 3 guide: $ARTICLE_TITLE"
          git push origin HEAD:main
          echo "### Dopamine 3 article published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Topic: **$TOPIC_ID**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Page: https://nextjailbreak.com/$TARGET_PATH" >> "$GITHUB_STEP_SUMMARY"
          echo "- Editorial floor: **9/10**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unique visual from cited source: **required and verified**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Generic repeated hero fallback: **disabled**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Social post queued: **yes**" >> "$GITHUB_STEP_SUMMARY"

      - name: Persist publisher error diagnostic
        if: steps.api.outputs.enabled == 'true' && steps.cluster.outputs.reason == 'publisher-error'
        run: |
          git config user.name "nextsolution-publisher[bot]"
          git config user.email "nextsolution-publisher[bot]@users.noreply.github.com"
          if [ -f automation/dopamine3-last-run.json ]; then
            git add -- automation/dopamine3-last-run.json
            if ! git diff --cached --quiet; then
              git commit -m "Record Dopamine 3 publisher diagnostic"
              git push origin HEAD:main
            fi
          fi
          echo "### Dopamine 3 publisher error" >> "$GITHUB_STEP_SUMMARY"
          echo "A bounded, secret-safe diagnostic was saved to automation/dopamine3-last-run.json." >> "$GITHUB_STEP_SUMMARY"

      - name: Record safe no-op
        if: steps.api.outputs.enabled == 'true' && steps.cluster.outputs.published != 'true' && steps.cluster.outputs.reason != 'publisher-error'
        run: |
          echo "### Dopamine 3 publisher" >> "$GITHUB_STEP_SUMMARY"
          echo "No article was published on this run." >> "$GITHUB_STEP_SUMMARY"
          echo "Reason: **${{ steps.cluster.outputs.reason }}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail after diagnostic is persisted
        if: steps.api.outputs.enabled == 'true' && steps.cluster.outputs.reason == 'publisher-error'
        run: exit 1

      - name: Upload publisher log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dopamine3-cluster-${{ github.run_number }}
          path: dopamine-cluster-run.log
          if-no-files-found: ignore
          retention-days: 14
