name: Build Next Chat Advanced
on:
  workflow_dispatch:
  push:
    branches: [agent/next-chat-advanced]
    paths: ['NextChat/**', '.github/workflows/build-next-chat.yml']
permissions:
  contents: write
concurrency:
  group: next-chat-build5-publication
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/nextchat-venv"
          "$RUNNER_TEMP/nextchat-venv/bin/pip" install Pillow
      - name: Generate Xcode project and icon
        working-directory: NextChat
        run: |
          "$RUNNER_TEMP/nextchat-venv/bin/python" generate_icon.py
          xcodegen generate
      - name: Compile app and widget for iOS 16
        working-directory: NextChat
        run: |
          set -o pipefail
          xcodebuild -project NextChat.xcodeproj -scheme NextChat -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee "$RUNNER_TEMP/nextchat-build.log"
      - name: Verify, sign and package Build 5
        working-directory: NextChat
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/NextChat.app"
          WIDGET="$APP/PlugIns/NextChatWidgets.appex"
          test -s "$APP/NextChat"
          test -d "$WIDGET"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = com.nextsolution.chat
          for INFO in "$APP/Info.plist" "$WIDGET/Info.plist"; do
            /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.0.0' "$INFO"
            /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 5' "$INFO"
          done
          codesign --force --sign - --timestamp=none --generate-entitlement-der "$WIDGET"
          codesign --force --sign - --timestamp=none --generate-entitlement-der "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p "$RUNNER_TEMP/nextchat-build5/Payload"
          ditto "$APP" "$RUNNER_TEMP/nextchat-build5/Payload/NextChat.app"
          cd "$RUNNER_TEMP/nextchat-build5"
          zip -qry "$RUNNER_TEMP/NextChat_1.0.0_Build5.ipa" Payload
          unzip -tqq "$RUNNER_TEMP/NextChat_1.0.0_Build5.ipa"
          cd "$RUNNER_TEMP"
          shasum -a 256 NextChat_1.0.0_Build5.ipa > NextChat_1.0.0_Build5.ipa.sha256
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: NextChat-Advanced-Build5
          path: |
            ${{ runner.temp }}/NextChat_1.0.0_Build5.ipa
            ${{ runner.temp }}/NextChat_1.0.0_Build5.ipa.sha256
          if-no-files-found: error
      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NextChat-compile-log
          path: ${{ runner.temp }}/nextchat-build.log
          if-no-files-found: ignore

      - name: Publish verified IPA and index entry
        run: |
          set -euo pipefail
          RELEASE_DIR=transfer/files/NextChat/1.0.0
          FILE_NAME=NextChat_1.0.0_Build5.ipa
          for ATTEMPT in 1 2 3 4; do
            git fetch origin main:refs/remotes/origin/main
            git reset --hard origin/main
            mkdir -p "$RELEASE_DIR"
            cp "$RUNNER_TEMP/$FILE_NAME" "$RELEASE_DIR/$FILE_NAME"
            (cd "$RELEASE_DIR" && shasum -a 256 "$FILE_NAME" > "$FILE_NAME.sha256")
            export SHA256=$(shasum -a 256 "$RELEASE_DIR/$FILE_NAME" | awk '{print $1}')
            export SIZE=$(stat -f%z "$RELEASE_DIR/$FILE_NAME")
            python3 - <<'PY'
          import os,json
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('transfer/index.json')
          d=json.loads(p.read_text())
          entry={
            'id':'next-chat-1.0.0-build5',
            'name':'Next Chat Advanced 1.0.0 - Build 5',
            'fileName':'NextChat_1.0.0_Build5.ipa',
            'type':'ipa',
            'platform':'iOS 16+ / TrollStore (ad-hoc signed)',
            'version':'1.0.0 (5)',
            'url':'https://nextjailbreak.com/transfer/files/NextChat/1.0.0/NextChat_1.0.0_Build5.ipa',
            'sha256':os.environ['SHA256'],
            'sizeBytes':int(os.environ['SIZE']),
            'notes':'Unofficial ChatGPT web companion. Direct mode default; supported Apple navigation, account-password guidance and corrected WebKit cancellation handling. Physical-device login still requires testing. Not Apple Distribution signed.'
          }
          d['files']=[entry]+[x for x in d.get('files',[]) if x.get('id')!=entry['id']]
          d['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
            python3 -m json.tool transfer/index.json >/dev/null
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f "$RELEASE_DIR/$FILE_NAME" "$RELEASE_DIR/$FILE_NAME.sha256" transfer/index.json
            if ! git diff --cached --quiet; then git commit -m 'Publish Next Chat Advanced 1.0.0 Build 5 IPA'; fi
            if git push origin HEAD:main; then
              echo "Published: https://nextjailbreak.com/$RELEASE_DIR/$FILE_NAME" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          exit 1
