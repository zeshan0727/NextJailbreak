name: Build Next App 1.0.2 Duplicate Test

on:
  workflow_dispatch:
  push:
    branches:
      - agent/nextapp-1.0.2-duplicates
    paths:
      - 'NextAppApp/**'
      - '.github/workflows/build-nextapp-102-duplicates-test.yml'

permissions:
  contents: read

concurrency:
  group: nextapp-102-duplicates-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate duplicate feature source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MARKETING_VERSION: 1.0.2' NextAppApp/project.yml
          grep -q 'CURRENT_PROJECT_VERSION: 3' NextAppApp/project.yml
          grep -q 'ZIPFoundation' NextAppApp/project.yml
          grep -q 'Button("Duplicate App")' NextAppApp/NextApp/NextApp.swift
          grep -q 'Number of copies' NextAppApp/NextApp/NextApp.swift
          grep -q 'nextdup' NextAppApp/NextApp/AppDuplication.swift
          grep -q 'apple-magnifier' NextAppApp/NextApp/AppDuplication.swift
          grep -q '127.0.0.1' NextAppApp/NextApp/AppDuplication.swift
          grep -q 'unzipItem' NextAppApp/NextApp/AppDuplication.swift
          grep -q 'zipItem' NextAppApp/NextApp/AppDuplication.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate glossy Next App icon
        working-directory: NextAppApp
        run: swift generate_app_icon.swift NextApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        working-directory: NextAppApp
        run: xcodegen generate

      - name: Resolve packages
        working-directory: NextAppApp
        run: |
          xcodebuild             -resolvePackageDependencies             -project NextApp.xcodeproj             -scheme NextApp

      - name: Build unsigned iPhone app
        working-directory: NextAppApp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output
          xcodebuild             -project NextApp.xcodeproj             -scheme NextApp             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build 2>&1 | tee build-output/xcodebuild-1.0.2.log

      - name: Package IPA
        working-directory: NextAppApp
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Payload NextApp-1.0.2.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NextApp.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextApp-1.0.2.ipa
          cp NextApp-1.0.2.ipa build-output/NextApp-1.0.2.ipa
          shasum -a 256 build-output/NextApp-1.0.2.ipa > build-output/NextApp-1.0.2.sha256

      - name: Validate IPA
        working-directory: NextAppApp
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify
          mkdir -p verify
          ditto -x -k NextApp-1.0.2.ipa verify
          APP=verify/Payload/NextApp.app
          BIN="$APP/NextApp"

          test -f "$BIN"
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")

          echo "Version=$SHORT Build=$BUILD Bundle=$BUNDLE"
          test "$SHORT" = "1.0.2"
          test "$BUILD" = "3"
          test "$BUNDLE" = "com.nextsolution.nextapp"
          test -f "$APP/Assets.car"

          grep -q 'Button("Duplicate App")' NextApp/NextApp.swift
          grep -q 'nextdup' NextApp/AppDuplication.swift
          grep -q 'apple-magnifier' NextApp/AppDuplication.swift
          grep -q '127.0.0.1' NextApp/AppDuplication.swift
          test -d "$APP/ZIPFoundation_ZIPFoundation.bundle"

      - name: Upload test IPA
        uses: actions/upload-artifact@v4
        with:
          name: NextApp-1.0.2-Duplicate-Test
          path: |
            NextAppApp/build-output/NextApp-1.0.2.ipa
            NextAppApp/build-output/NextApp-1.0.2.sha256
            NextAppApp/build-output/xcodebuild-1.0.2.log
          if-no-files-found: error
