name: Publish Sealora 1.0.9 test banner to NS Transfer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-sealora-109-ns-transfer.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-sealora-109-ns-transfer
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified Sealora 1.0.9 iOS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42976800400 --jq .conclusion)" = success
          mkdir -p "$RUNNER_TEMP/sealora109"
          gh run download 42976800400 --repo "$GITHUB_REPOSITORY" --name Sealora-1.0.9-unsigned-IPA --dir "$RUNNER_TEMP/sealora109"
          test -s "$RUNNER_TEMP/sealora109/Sealora-unsigned.ipa"
          python3 - "$RUNNER_TEMP/sealora109/Sealora-unsigned.ipa" <<'PY'
          import sys,zipfile,plistlib
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None, 'Damaged IPA'
              matches = [s for s in z.namelist() if s.startswith('Payload/') and s.endswith('.app/Info.plist') and s.count('/')==2]
              assert len(matches)==1,matches
              info = plistlib.loads(z.read(matches[0]))
              assert info['CFBundleIdentifier']=='com.nextsolution.sealora'
              assert info['CFBundleShortVersionString']=='1.0.9'
              assert str(info['CFBundleVersion'])=='10'
              assert info['MinimumOSVersion']=='16.0'
              assert not info.get('CFBundleURLTypes'), 'Retired UDID callback still present'
              assert 'audio' in info.get('UIBackgroundModes',[]), 'OTA background audio support missing'
              assert info.get('GADApplicationIdentifier')=='ca-app-pub-3940256099942544~1458002511', 'Missing AdMob demo app ID'
              assert any('/Frameworks/GoogleMobileAds.framework/GoogleMobileAds' in n for n in z.namelist()), 'AdMob framework missing'
              executable=matches[0].removesuffix('Info.plist')+info['CFBundleExecutable']
              assert z.getinfo(executable).file_size>500_000
          PY
      - name: Publish unsigned test IPA and catalog metadata
        run: |
          set -euo pipefail
          mkdir -p transfer/files/Sealora/1.0.9
          cp "$RUNNER_TEMP/sealora109/Sealora-unsigned.ipa" transfer/files/Sealora/1.0.9/Sealora-1.0.9-unsigned.ipa
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          from datetime import datetime, timezone
          ipa=Path('transfer/files/Sealora/1.0.9/Sealora-1.0.9-unsigned.ipa')
          catalog_path=Path('transfer/index.json')
          catalog=json.loads(catalog_path.read_text())
          entry={
            'id':'sealora-1.0.9-build10-unsigned',
            'name':'Sealora 1.0.9 — Test Banner Ads',
            'fileName':ipa.name,
            'type':'ipa',
            'platform':'iOS 16+; unsigned IPA (requires compatible signing before installation)',
            'version':'1.0.9 (10)',
            'url':'https://nextjailbreak.com/transfer/files/Sealora/1.0.9/Sealora-1.0.9-unsigned.ipa',
            'sha256':hashlib.sha256(ipa.read_bytes()).hexdigest(),
            'sizeBytes':ipa.stat().st_size,
            'notes':'Adds slim 320x50 Google AdMob official TEST banner above the tab bar, with Next Jailbreak house promotion fallback and Settings toggle. Google demo unit does not generate revenue. Preserves on-device IPA signing and direct OTA install. Unsigned iOS 16+ test IPA; sign using a compatible profile before installation.'
          }
          catalog['files']=[entry]+[x for x in catalog.get('files',[]) if not str(x.get('id','')).startswith('sealora-')]
          catalog['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          catalog_path.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n')
          print('Publishing SHA256',entry['sha256'])
          PY
          python3 -m json.tool transfer/index.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json transfer/files/Sealora/1.0.9/Sealora-1.0.9-unsigned.ipa
          if git diff --cached --quiet; then
            echo 'Sealora 1.0.9 already published'
          else
            git commit -m 'Publish Sealora 1.0.9 unsigned test banner IPA to NS Transfer'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
