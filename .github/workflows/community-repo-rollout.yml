name: Community comments and repo rollout

# Includes legacy original-release pages outside the publication audit.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/community-repo-rollout.yml"

permissions:
  contents: write

concurrency:
  group: nextjailbreak-community-rollout
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply comments and repo changes
        run: |
          python3 -m automation.community_comments_rollout

      - name: Validate rollout
        run: |
          python3 -m py_compile automation/community_comments.py automation/community_comments_rollout.py automation/publisher.py automation/ios_repo_news.py automation/dopamine_cluster.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          audit = json.loads((root/'automation/published-articles.json').read_text(encoding='utf-8'))
          checked = 0
          for entry in audit.get('entries', []):
              if not isinstance(entry, dict) or not entry.get('href'):
                  continue
              href = str(entry['href']).lstrip('/')
              page = root / href
              if href.endswith('/'):
                  page = page / 'index.html'
              if not page.exists():
                  continue
              text = page.read_text(encoding='utf-8')
              if text.count('data-nj-comments') != 1:
                  raise SystemExit(f'Comments block missing/duplicated: {page}')
              if text.count('/assets/community-comments.css') != 1:
                  raise SystemExit(f'Comments CSS missing/duplicated: {page}')
              if text.count('/assets/community-comments.js') != 1:
                  raise SystemExit(f'Comments JS missing/duplicated: {page}')
              checked += 1
          for legacy in ('nextlock-tweak/index.html','next-home-lock-tweak-ios16/index.html','phoneaura-tweak-ios16/index.html'):
              page = root/legacy
              if page.exists():
                  text = page.read_text(encoding='utf-8')
                  if 'data-nj-comments' not in text or 'repo.nextjailbreak.com' not in text:
                      raise SystemExit(f'Legacy article rollout missing: {legacy}')
          for publisher, variable in [
              ('automation/publisher.py','rendered_article'),
              ('automation/ios_repo_news.py','rendered'),
              ('automation/dopamine_cluster.py','rendered'),
          ]:
              text = (root/publisher).read_text(encoding='utf-8')
              if 'from automation.community_comments import ensure_community_comments' not in text:
                  raise SystemExit(f'Future comments import missing: {publisher}')
              if f'{variable} = ensure_community_comments({variable})' not in text:
                  raise SystemExit(f'Future comments guard missing: {publisher}')
          repo = (root/'repo-site/index.html').read_text(encoding='utf-8')
          for scheme in ('sileo://source/','cydia://url/','zbra://sources/add/','installer://add/repo='):
              if scheme not in repo:
                  raise SystemExit(f'Repo manager link missing: {scheme}')
          print(f'Validated community comments on {checked} audited pages, legacy originals, and all future publishers.')
          PY

      - name: Commit rollout
        run: |
          git config user.name "nextjailbreak-community[bot]"
          git config user.email "nextjailbreak-community[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No rollout changes required."
            exit 0
          fi
          git commit -m "Add community comments to legacy original articles"
          git pull --rebase origin main
          git push origin HEAD:main
