name: Temporary Build Next Signer 1.4.3

on:
  push:
    branches: [main]
    paths:
      - 'NextSigner/build-143-trigger.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout 1.4.3 feature branch
        uses: actions/checkout@v4
        with:
          ref: release/nextsigner-1.4.3-build29-ipa-identity
          fetch-depth: 0

      - name: Verify 1.4.3 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MARKETING_VERSION: "1.4.3"' NextSigner/project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "29"' NextSigner/project.yml
          grep -q 'local.install(app, using: store)' NextSigner/NextSigner/NextSignerLocalViews.swift
          grep -q 'Enable iCloud Documents (CloudDocuments)' NextSigner/NextSigner/NextSignerManualViews.swift
          grep -q 'customProvisioningURL' NextSigner/NextSigner/ManualSigningFlow.swift
          grep -q 'customEntitlementsURL' NextSigner/NextSigner/ManualSigningFlow.swift
          grep -q 'Enable iCloud Documents (CloudDocuments)' NextSigner/NextSigner/NextSignerLocalViews.swift
          grep -q 'entitlementsPath: signingEntitlements' NextSigner/NextSigner/LocalSignerService.swift
          grep -q 'case "com.apple.developer.ubiquity-kvstore-identifier":' NextSigner/NextSigner/LocalSignerService.swift
          grep -q 'private func normalizedKeychainGroups(' NextSigner/NextSigner/LocalSignerService.swift
          grep -q 'IPAIdentityReader.read(from: localURL)' NextSigner/NextSigner/SignerStore.swift
          grep -q 'Payload' NextSigner/NextSigner/IPAIdentityReader.swift
          if grep -q 'suggestedBundleID(from: request.appName)' NextSigner/NextSigner/SignerStore.swift; then
            echo 'IPA importer still derives signing bundle ID from staged UUID name' >&2
            exit 1
          fi
          grep -q 'itms-services://?action=download-manifest' NextSigner/NextSigner/LocalSigningController.swift
          if grep -q 'apple-magnifier://install' NextSigner/NextSigner/NextSignerLocalViews.swift; then
            echo 'Signed Apps UI still uses Magnifier scheme' >&2
            exit 1
          fi

      - name: Prepare patched Zsign sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf NextSigner/Vendor/Zsign-Package
          git clone --depth 1 --branch package https://github.com/claration/Zsign-Package.git NextSigner/Vendor/Zsign-Package
          git -C NextSigner/Vendor/Zsign-Package rev-parse HEAD
          python3 - <<'PY'
          from pathlib import Path
          bridge = Path('NextSigner/Vendor/Zsign-Package/swift/zsign.mm')
          s = bridge.read_text()
          s = s.replace('void(^completionHandler)(BOOL success, NSError *error)', 'void(^completionHandler)(BOOL success)')
          old_call = 'bundle.SignFolder(&zsa, strFolder, strBundleId, strBundleVersion, strDisplayName, arrDylibFiles, bForce, bWeakInject, bEnableCache, excludeprovion)'
          new_call = 'bundle.SignFolder(&zsa, strFolder, strBundleId, strBundleVersion, strDisplayName, arrDylibFiles, arrDisDylibFiles, bForce, bWeakInject, bEnableCache, excludeprovion)'
          if old_call in s:
              s = s.replace(old_call, new_call)
          elif new_call in s:
              print('Zsign bridge already has the full dylib argument list')
          else:
              # Different formatting or a supported new bridge is acceptable
              # only when the real SignFolder call is still present.
              if 'bundle.SignFolder(' not in s or 'arrDylibFiles' not in s:
                  raise SystemExit('Unsupported upstream Zsign bridge ABI; refusing blind patch')
              print('Upstream bridge ABI differs from known variants; Xcode will validate it')
          s = s.replace('completionHandler(bRet);', 'if (completionHandler) { completionHandler(bRet); }')
          bridge.write_text(s)

          bundle = Path('NextSigner/Vendor/Zsign-Package/src/bundle.cpp')
          b = bundle.read_text()
          old = '''if (!pSignAsset->m_strProvData.empty()) {
          \t\tif (bRemoveProvision) {
          \t\t\tif (!ZFile::WriteFileV(pSignAsset->m_strProvData, "%s/embedded.mobileprovision", m_strAppFolder.c_str())) { // embedded.mobileprovision'''
          new = '''if (!pSignAsset->m_strProvData.empty()) {
          \t\tif (!bRemoveProvision) {
          \t\t\tif (!ZFile::WriteFileV(pSignAsset->m_strProvData, "%s/embedded.mobileprovision", m_strAppFolder.c_str())) { // embedded.mobileprovision'''
          if old in b:
              bundle.write_text(b.replace(old, new, 1))
          elif new in b:
              print('Upstream embedded.mobileprovision handling already corrected')
          else:
              print('Upstream provision logic changed; deferring verification to Xcode')
          PY

      - name: Test iCloud entitlement preparation and signed Mach-O validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nextsigner-validation"
          git show origin/main:.github/scripts/nextsigner-icloud-entitlements.py > "$RUNNER_TEMP/nextsigner-validation/nextsigner-icloud-entitlements.py"
          git show origin/main:.github/scripts/test-nextsigner-icloud-entitlements.py > "$RUNNER_TEMP/nextsigner-validation/test-nextsigner-icloud-entitlements.py"
          python3 "$RUNNER_TEMP/nextsigner-validation/test-nextsigner-icloud-entitlements.py"

      - name: Generate icon
        run: python3 NextSigner/generate_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: NextSigner
        run: xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: NextSigner
        run: |
          set -euo pipefail
          xcodebuild \
            -project NextSigner.xcodeproj \
            -scheme NextSigner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/NextSignerDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA and TIPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/NextSignerDerived/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP_PATH"
          rm -rf "$RUNNER_TEMP/package"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/NextSigner.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/NextSigner-1.4.3.ipa" Payload
          cp "$RUNNER_TEMP/NextSigner-1.4.3.ipa" "$RUNNER_TEMP/NextSigner-1.4.3.tipa"
          unzip -t "$RUNNER_TEMP/NextSigner-1.4.3.ipa" >/dev/null
          shasum -a 256 "$RUNNER_TEMP/NextSigner-1.4.3.ipa" "$RUNNER_TEMP/NextSigner-1.4.3.tipa"
          stat -f '%N %z bytes' "$RUNNER_TEMP/NextSigner-1.4.3.ipa" "$RUNNER_TEMP/NextSigner-1.4.3.tipa"

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextSigner-1.4.3-Test
          path: |
            ${{ runner.temp }}/NextSigner-1.4.3.ipa
            ${{ runner.temp }}/NextSigner-1.4.3.tipa
          if-no-files-found: error
          retention-days: 30
